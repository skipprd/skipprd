[package]
name = "skippr-plugin-data-sink-athena"
version = "0.1.4"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-sink-athena"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true

arrow = { version = "58.3.0", features = ["ipc_compression"] }
async-trait = "0.1.77"
aws-config = "1.5.1"
aws-sdk-athena = { version = "1.30.0" }
aws-sdk-glue = "1.38.0"
aws-sdk-s3 = "1.32.0"
bytes = "1.5.0"
dashmap = "5.5.3"
datafusion.workspace = true
futures = "0.3.25"
hex = "0.4.3"
md5 = "0.7.0"
once_cell = "1.17.0"
parquet.workspace = true
rand = "0.8.5"
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSink"
plugin_name = "Athena"

[package.metadata.skippr-plugin.sink_capability]
name = "Athena"
guarantee_tier = "CdcEncodedOnly"
can_manage_skippr_columns = false
can_maintain_tombstone_tables = false
can_compare_order_tokens = false
supports_transactions = false
supports_replace_partition = true
supports_replace_table = true
supports_primary_key_metadata = true
