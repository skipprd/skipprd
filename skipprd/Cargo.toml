[package]
name = "skipprd"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_derive = "1.0.105"
serde = "1.0.105"
serde_json = "1.0.85"
serde_yaml = "0.9.16"
schemars = "0.7.0"
regex = "1.7.0"
memory-stats = "1.0.0"
rand = "0.8.5"
chrono = "0.4.23"
icu = "1.0.0"
array-init = "2.1.0"
envy = "0.4.2"
io = "0.0.2"
aws-config = "0.55.1"
aws-sdk-s3 = "0.26.0"
aws-types = "0.55.1"
aws-sdk-athena = "0.26.0"
tokio = { version = "1", features = ["full"] }
flate2 = "1.0.25"
csv = "1.1.6"
futures = "0.3.25"
periodic = "0.1.1"
glob = "0.3.0"
clap = { version = "4.0.32", features = ["derive"] }
yaml-rust = "0.4.5"
once_cell = "1.17.0"
parquet = "23.0.0"
arrow = "23.0.0"
arrow-schema = "30.0.0"
indexmap = "1.9.2"
reqwest = { version = "0.11.16", features = ["blocking", "json"] }
lazy_static = "1.4.0"
urldecode = "0.1.1"
url = "2.3.1"
aws-smithy-http = "0.55.1"
aws-sdk-glue = "0.26.0"
md5 = "0.7.0"
phf = { version = "0.11.1", default-features = false, features = ["macros"] }
sled = { version = "0.34.4" }
zerocopy = "0.6.1"
byteorder = "1.4.3"

[dev-dependencies]
serial_test = "1.0.0"
