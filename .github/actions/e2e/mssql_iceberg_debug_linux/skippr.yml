skippr:
  skippr_s3_bucket: skippr-e2e-sample-data-output
  workspace: iceberg-debug-mssql-linux

pipelines:
  mssql_iceberg_debug_linux:
    auto_approve: yes
    env: test
    buffer_threshold_bytes: 20000000
    buffer_threshold_seconds: 60
    data_source: data_sources.mssql_debug
    data_sink: data_sinks.iceberg_debug

data_sources:
  mssql_debug:
    Mssql:
      connection_string: "server=tcp:127.0.0.1,1433;database=testdb;user id=sa;password=Skippr!Test123;TrustServerCertificate=true"
      tables: ["dbo.customers", "dbo.orders", "dbo.order_items"]

data_sinks:
  iceberg_debug:
    AthenaIceberg:
      warehouse: s3://skippr-e2e-sample-data-output/iceberg-e2e-mssql-debug-linux
      glue_database_name: iceberg_e2e_mssql_debug_linux
      athena_workgroup_name: bikehire
      athena_results_s3_bucket: skippr-e2e-sample-data-output
      catalog_id: "353855562591"
      region: us-east-1
    schema_sink: schema_sinks.iceberg_glue

schema_sinks:
  iceberg_glue:
    AthenaIceberg:
      warehouse: s3://skippr-e2e-sample-data-output/iceberg-e2e-mssql-debug-linux
      glue_database_name: iceberg_e2e_mssql_debug_linux
      athena_workgroup_name: bikehire
      athena_results_s3_bucket: skippr-e2e-sample-data-output
      catalog_id: "353855562591"
      region: us-east-1
