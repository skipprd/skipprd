[package]
name = "skippr-store-cloud-tables"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cloud tables backends for skipprd leases, membership, offsets, and Iceberg catalog pointers"

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono = "0.4.44"
iceberg = "0.9.1"
iceberg-storage-opendal = "0.9.1"
once_cell.workspace = true
serde_json.workspace = true
sha2.workspace = true
skippr-iceberg-catalog = { path = "../skippr-iceberg-catalog" }
skippr-lease = { path = "../skippr-lease" }
skippr-tables-client = { path = "../skippr-tables-client" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
