.github_publish_release:
  stage: publish
  script:
    - apt-get update && apt-get install -y curl jq
#    - RELEASE_BODY="Release $CI_COMMIT_TAG"
    - REPO="skipprd/skipprd"
    - TAG_NAME="v$CI_COMMIT_TAG"

    - |
      # Create a new release on GitHub
      RESPONSE_JSON=$(curl -s -X POST https://api.github.com/repos/$REPO/releases \
        -H "Authorization: token $GITHUB_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{
          "tag_name": "'"$TAG_NAME"'",
          "name": "'"$RELEASE_NAME"'",
          "body": "'"$RELEASE_BODY"'"
        }')

      RELEASE_ID=$(echo $RESPONSE_JSON | jq .id)

      # Upload the binary to the release
      curl -s -H "Authorization: token $GITHUB_TOKEN" \
          -H "Content-Type: $(file -b --mime-type $FILE_PATH)" \
          --data-binary "@$FILE_PATH" \
          "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$(basename $FILE_PATH)"

  only:
    - tags

cleanup:
  image: python:3.8-alpine
  stage: build
  before_script:
    - apk add --no-cache groff less jq
    - pip install awscli
  script:
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region us-east-1
    - aws s3 rm s3://skippr-e2e-sample-data-output/bikehire --recursive
    - aws s3 rm s3://skippr-metadata-test --recursive
    - aws glue delete-database --catalog-id 353855562591 --name bikehire || true
#      aws dynamodb delete-item --table-name Test-MetadataService-Stack-MetadataTable8CB34826-XGZT4CFIJO8Y --key '{"tenant": {"S": "skippr"}}'
  only:
#    - master
    - tags

