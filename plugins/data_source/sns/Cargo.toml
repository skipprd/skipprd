[package]
name = "skippr-plugin-data-source-sns"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-sns"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-core.workspace = true
skippr-runtime-sdk.workspace = true

aws-config = "1.5.1"
aws-sdk-sqs = { version = "1.47.0" }
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "Sns"

[package.metadata.skippr-plugin.source_capability]
name = "Sns"
guarantee_tier = "EventIdentityEligible"
checkpoint_style = "MessageIdentity"
bootstrap_style = "StreamOnly"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "MessageId"
