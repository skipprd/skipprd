[package]
name = "skipprd-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
bincode = "1.3"
libfuzzer-sys = "0.4"
serde_json = "1"
serde_yaml = "0.9"
iceberg = { path = "../third_party/iceberg" }
skippr-wal-catalog = { path = "../crates/skippr-wal-catalog" }
skipprd = { path = ".." }

[workspace]
members = ["."]

[patch.crates-io]
iceberg = { path = "../third_party/iceberg" }

[[bin]]
name = "world_schedule"
path = "fuzz_targets/world_schedule.rs"
test = false
doc = false
bench = false

