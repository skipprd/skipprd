name: Rust CI/CD Pipeline

on:
  push:
    tags:
      - '*'

env:
  COMPONENT_NAME: skipprd
  CONTAINER_IMAGE: skipprd:v${{ github.ref_name }}
  CONTAINER_LATEST_IMAGE: skipprd:latest
  DOCKER_HUB_REPO: skipprd
  ECR_HOST: 536671797322.dkr.ecr.us-east-1.amazonaws.com
  AWS_ECR_REGISTRY: $ECR_HOST/$COMPONENT_NAME
  RELEASES_BUCKET: skippr-web-install-site-prod
  SKIPPRD_RELEASE_SUBDIR: skipprd
  SKIPPR_RELEASE_SUBDIR: skippr
  SKIPPR_ADMIN_RELEASE_SUBDIR: skippr-admin
  RUNTIME_PLUGIN_RELEASE_SUBDIR: runtime-plugins
  SKIPPRD_LATEST_POINTER: latest-skipprd.txt
  SKIPPR_LATEST_POINTER: latest-skippr.txt
  SKIPPR_ADMIN_LATEST_POINTER: latest-skippr-admin.txt
  RUST_BUILD_CACHE_BUCKET: skippr-web-rust-cache-prod
  RUST_BUILD_CACHE_REGION: us-east-1

jobs:
  plan_runtime_plugin_release:
    name: plan runtime plugin release
    runs-on: ubuntu-latest
    outputs:
      runtime_plugin_packages_json: ${{ steps.plan.outputs.runtime_plugin_packages_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan_file="$(mktemp)"
          python3 .github/scripts/runtime_plugin_release_plan.py \
            --workspace "$GITHUB_WORKSPACE" > "$plan_file"
          cat "$plan_file"
          python3 - "$plan_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          plan_path, output_path = sys.argv[1], sys.argv[2]
          with open(plan_path, encoding="utf-8") as handle:
              plan = json.load(handle)

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write("runtime_plugin_packages_json<<EOF\n")
              handle.write(json.dumps(plan["packages"]))
              handle.write("\nEOF\n")
          PY

  cleanup:
    runs-on: ubuntu-latest
    container:
      image: python:3.8-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apk add --no-cache groff less jq
          pip install awscli
      - name: Configure AWS and clean resources
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set default.region us-east-1          
          aws s3 rm s3://skippr-e2e-sample-data-output --recursive
          aws s3 rm s3://skippr-metadata-test --recursive
          aws glue delete-database --catalog-id 353855562591 --name bikehire || true
          aws glue delete-database --catalog-id 353855562591 --name deadletters || true

  purge_dynamodb:
    runs-on: ubuntu-latest
    container:
      image: node:14
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          npm install aws-sdk
      - name: Run script
        run: node _files/purge-dynamodb.js

  macos_arm64:
    name: cargo build (macos arm64)
    needs:
      - plan_runtime_plugin_release
    runs-on: macos-14
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build macOS arm64 release
        uses: ./.github/actions/rust-build-release
        with:
          rust-version: stable
          architecture_name: macos_arm64
          runtime_plugin_packages_json: ${{ needs.plan_runtime_plugin_release.outputs.runtime_plugin_packages_json }}

  linux_x86:
    name: cargo build (linux x86)
    needs:
      - plan_runtime_plugin_release
    runs-on:
      - ubuntu-latest-32-cores
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build linux x86 release
        uses: ./.github/actions/rust-build-release
        with:
          rust-version: stable
          architecture_name: linux_x86
          runtime_plugin_packages_json: ${{ needs.plan_runtime_plugin_release.outputs.runtime_plugin_packages_json }}

  linux_test_suite:
    name: cargo test (linux host/packages)
    needs:
      - plan_runtime_plugin_release
    runs-on:
      - ubuntu-latest-32-cores
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Prepare Rust builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Configure version if tag commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python3 .github/scripts/set_root_package_version.py \
            --workspace "$GITHUB_WORKSPACE" \
            --version "${{ github.ref_name }}"
      - name: Verify host dependency boundary
        shell: bash
        run: |
          python3 .github/scripts/check_host_dependency_boundaries.py
      - name: Run root host test suite
        shell: bash
        run: |
          cargo test -p skipprd -- --nocapture
      - name: Run postgres plugin tests
        shell: bash
        run: |
          cargo test -p skippr-plugin-data-sink-postgres -- --nocapture

  data_engineer_test_suite:
    name: cargo test (data-engineer suite/providers)
    needs:
      - plan_runtime_plugin_release
    runs-on:
      - ubuntu-latest-32-cores
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd-react
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Prepare Rust builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Run data-engineer suite tests
        shell: bash
        run: |
          cargo test -p react-suite-data-engineer data_engineer::tests::control_state_thread_log_read_guardrails_are_enforced_in_rust_tests -- --nocapture
          cargo test -p react-suite-data-engineer --test sql_cte -- --nocapture
      - name: Run provider parity tests
        shell: bash
        run: |
          cargo test -p react-module-provider-catalog --test catalog_provider_parity -- --nocapture

  skippr_cli_test_suite:
    name: cargo test (skippr cli)
    needs:
      - data_engineer_test_suite
    runs-on:
      - ubuntu-latest-32-cores
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd-skippr
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Prepare Rust builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Build and test skippr CLI
        shell: bash
        run: |
          cargo build -p skippr-cli
          cargo test -p skippr-cli -- --nocapture

  skippr_admin_test_suite:
    name: cargo test (skippr-admin)
    needs:
      - data_engineer_test_suite
    runs-on:
      - ubuntu-latest-32-cores
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd-admin
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Prepare Rust builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Build and test skippr-admin
        shell: bash
        run: |
          cargo build -p skippr-admin
          cargo test -p skippr-admin -- --nocapture

  macos_arm64_test_compile:
    name: cargo test --no-run (macos arm64)
    needs:
      - plan_runtime_plugin_release
    runs-on: macos-14
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system dependencies (macos)
        shell: bash
        run: |
          brew install protobuf cmake openssl@3 libssh2 pkg-config
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libssh2)/lib/pkgconfig" >> $GITHUB_ENV
          echo "LIBSSH2_SYS_USE_PKG_CONFIG=1" >> $GITHUB_ENV
      - name: Setup Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup component add rustfmt
      - name: Configure CodeArtifact Cargo access
        shell: bash
        run: |
          token="$(aws codeartifact get-authorization-token \
            --domain skippr \
            --domain-owner 132355036174 \
            --region us-east-1 \
            --query authorizationToken \
            --output text)"
          echo "::add-mask::$token"
          echo "CARGO_REGISTRIES_REACT_CARGO_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Install sccache
        if: env.SCCACHE_BUCKET != ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0
      - name: Configure sccache
        if: env.SCCACHE_BUCKET != ''
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-test-macos_arm64
      - name: Configure version if tag commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python3 .github/scripts/set_root_package_version.py \
            --workspace "$GITHUB_WORKSPACE" \
            --version "${{ github.ref_name }}"
      - name: Verify host dependency boundary
        shell: bash
        run: |
          python3 .github/scripts/check_host_dependency_boundaries.py
      - name: Compile root host tests
        shell: bash
        run: |
          cargo test -p skipprd --no-run
      - name: Compile postgres plugin tests
        shell: bash
        run: |
          cargo test -p skippr-plugin-data-sink-postgres --no-run

  windows_x86:
    name: cargo build (windows x86)
    needs:
      - plan_runtime_plugin_release
    runs-on: windows-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure CodeArtifact Cargo access
        shell: bash
        run: |
          token="$(aws codeartifact get-authorization-token \
            --domain skippr \
            --domain-owner 132355036174 \
            --region us-east-1 \
            --query authorizationToken \
            --output text)"
          echo "::add-mask::$token"
          echo "CARGO_REGISTRIES_REACT_CARGO_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install sccache
        if: env.SCCACHE_BUCKET != ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: Configure vcpkg cache
        shell: pwsh
        run: |
          $triplet = "x64-windows-static-md"
          $cacheDir = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=$triplet" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\$triplet" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\$triplet" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_CACHE_DIR=$cacheDir" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV

      - name: Restore vcpkg cache
        shell: pwsh
        run: |
          $cachePrefix = "$env:SCCACHE_S3_KEY_PREFIX/vcpkg/$env:VCPKG_DEFAULT_TRIPLET"
          $archiveUri = "s3://$env:RUST_BUILD_CACHE_BUCKET/$cachePrefix/cache.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "vcpkg-cache-$env:VCPKG_DEFAULT_TRIPLET.zip"
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Write-Warning "AWS CLI not found; skipping vcpkg cache restore"
            exit 0
          }

          Write-Host "Restoring vcpkg binary cache from $archiveUri"
          $restoreOutput = aws s3 cp $archiveUri $archivePath --region $env:RUST_BUILD_CACHE_REGION --no-progress --only-show-errors 2>&1
          if ($LASTEXITCODE -eq 0) {
            try {
              Expand-Archive -Path $archivePath -DestinationPath $env:VCPKG_BINARY_CACHE_DIR -Force
              Write-Host "Restored vcpkg binary cache archive"
            } catch {
              Write-Warning "Failed to extract vcpkg cache archive: $($_.Exception.Message)"
            }
          } else {
            $restoreOutputText = ($restoreOutput | Out-String).Trim()
            Write-Warning "Skipping vcpkg cache restore from ${archiveUri}: $restoreOutputText"
            $global:LASTEXITCODE = 0
          }

      - name: Install native dependencies (vcpkg)
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows-static-md openssl:x64-windows-static-md zlib:x64-windows-static-md

      - name: Persist vcpkg cache
        if: always()
        shell: pwsh
        run: |
          $cachePrefix = "$env:SCCACHE_S3_KEY_PREFIX/vcpkg/$env:VCPKG_DEFAULT_TRIPLET"
          $archiveUri = "s3://$env:RUST_BUILD_CACHE_BUCKET/$cachePrefix/cache.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "vcpkg-cache-$env:VCPKG_DEFAULT_TRIPLET.zip"
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Write-Warning "AWS CLI not found; skipping vcpkg cache persist"
            exit 0
          }

          $cacheEntries = Get-ChildItem -Path $env:VCPKG_BINARY_CACHE_DIR -Recurse -File -ErrorAction SilentlyContinue
          if (-not $cacheEntries) {
            Write-Host "No vcpkg cache artifacts to persist"
            exit 0
          }

          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }
          Compress-Archive -Path (Join-Path $env:VCPKG_BINARY_CACHE_DIR '*') -DestinationPath $archivePath -Force
          Write-Host "Persisting vcpkg binary cache to $archiveUri"
          $persistOutput = aws s3 cp $archivePath $archiveUri --region $env:RUST_BUILD_CACHE_REGION --no-progress --only-show-errors 2>&1
          if ($LASTEXITCODE -ne 0) {
            $persistOutputText = ($persistOutput | Out-String).Trim()
            Write-Warning "Failed to upload vcpkg cache archive: $persistOutputText"
            $global:LASTEXITCODE = 0
          }

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-release-windows_x86
      - name: Configure sccache
        if: env.SCCACHE_BUCKET != ''
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          "SCCACHE_IDLE_TIMEOUT=0" >> $env:GITHUB_ENV

      - name: Configure version if tag commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          python .github/scripts/set_root_package_version.py --workspace "$env:GITHUB_WORKSPACE" --version "${{ github.ref_name }}"

      - name: Build release
        shell: pwsh
        run: |
          # libz-sys consults VCPKGRS_NO_ZLIB at runtime, so force a targeted
          # rebuild when the cached target dir is restored.
          cargo clean -p libz-sys -p rdkafka-sys -p rdkafka

          $rawPluginPackages = @'
          ${{ needs.plan_runtime_plugin_release.outputs.runtime_plugin_packages_json }}
          '@
          $pluginPackages = @()
          $parsedPluginPackages = ConvertFrom-Json $rawPluginPackages
          if ($null -ne $parsedPluginPackages) {
            $pluginPackages = @($parsedPluginPackages)
          }

          # The Kafka runtime plugin currently does not link cleanly on
          # windows-latest due to the bundled librdkafka/zlib toolchain path.
          # Publish it on supported targets only until the native dependency
          # chain is fixed.
          $windowsUnsupportedPluginPackages = @(
            'skippr-plugin-data-source-kafka'
          )
          $skippedPluginPackages = @(
            $pluginPackages | Where-Object { $_ -in $windowsUnsupportedPluginPackages }
          )
          if ($skippedPluginPackages.Count -gt 0) {
            Write-Host "Skipping unsupported Windows runtime plugins: $($skippedPluginPackages -join ', ')"
            $pluginPackages = @(
              $pluginPackages | Where-Object { $_ -notin $windowsUnsupportedPluginPackages }
            )
          }

          cargo build --release --bin skipprd --bin skippr --bin skippr-admin
          if ($pluginPackages.Count -gt 0) {
            $buildArgs = @('build', '--release')
            foreach ($package in $pluginPackages) {
              $buildArgs += @('-p', [string]$package)
            }
            cargo @buildArgs
          }

          New-Item -ItemType Directory -Force -Path skipprd-windows_x86
          New-Item -ItemType Directory -Force -Path skippr-windows_x86
          New-Item -ItemType Directory -Force -Path skippr-admin-windows_x86
          New-Item -ItemType Directory -Force -Path runtime-plugin-binaries-windows_x86
          Copy-Item target\release\skipprd.exe skipprd-windows_x86\skipprd.exe
          Copy-Item target\release\skippr.exe skippr-windows_x86\skippr.exe
          Copy-Item target\release\skippr-admin.exe skippr-admin-windows_x86\skippr-admin.exe
          foreach ($package in $pluginPackages) {
            $pluginBinary = "target\release\$package.exe"
            if (-not (Test-Path $pluginBinary)) {
              throw "Expected runtime plugin binary was not produced: $pluginBinary"
            }
            Copy-Item $pluginBinary "runtime-plugin-binaries-windows_x86\$package.exe"
          }
          Get-ChildItem skipprd-windows_x86
          Get-ChildItem skippr-windows_x86
          Get-ChildItem skippr-admin-windows_x86
          Get-ChildItem runtime-plugin-binaries-windows_x86
        env:
          RUSTFLAGS: "-C debuginfo=0"
          VCPKGRS_NO_ZLIB: "1"

      - name: Verify compiled version
        shell: pwsh
        run: |
          $version = (.\target\release\skipprd.exe --version 2>&1) -replace '^skipprd\s+', ''
          Write-Host "skipprd version: $version"
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Version was not plain semver"
            exit 1
          }
      - name: Show sccache stats
        if: env.SCCACHE_BUCKET != ''
        shell: pwsh
        run: sccache --show-stats

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skipprd-windows_x86
          path: skipprd-windows_x86
          retention-days: 30
      - name: Upload skippr Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skippr-windows_x86
          path: skippr-windows_x86
          retention-days: 30
      - name: Upload skippr-admin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skippr-admin-windows_x86
          path: skippr-admin-windows_x86
          retention-days: 30

      - name: Upload Runtime Plugin Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-plugin-binaries-windows_x86
          path: runtime-plugin-binaries-windows_x86
          retention-days: 30

  windows_x86_test_compile:
    name: cargo test --no-run (windows x86)
    needs:
      - plan_runtime_plugin_release
    runs-on: windows-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure CodeArtifact Cargo access
        shell: bash
        run: |
          token="$(aws codeartifact get-authorization-token \
            --domain skippr \
            --domain-owner 132355036174 \
            --region us-east-1 \
            --query authorizationToken \
            --output text)"
          echo "::add-mask::$token"
          echo "CARGO_REGISTRIES_REACT_CARGO_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install sccache
        if: env.SCCACHE_BUCKET != ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0
      - name: Configure vcpkg cache
        shell: pwsh
        run: |
          $triplet = "x64-windows-static-md"
          $cacheDir = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=$triplet" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\$triplet" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\$triplet" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_CACHE_DIR=$cacheDir" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
      - name: Restore vcpkg cache
        shell: pwsh
        run: |
          $cachePrefix = "$env:SCCACHE_S3_KEY_PREFIX/vcpkg/$env:VCPKG_DEFAULT_TRIPLET"
          $archiveUri = "s3://$env:RUST_BUILD_CACHE_BUCKET/$cachePrefix/cache.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "vcpkg-cache-$env:VCPKG_DEFAULT_TRIPLET.zip"
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Write-Warning "AWS CLI not found; skipping vcpkg cache restore"
            exit 0
          }

          Write-Host "Restoring vcpkg binary cache from $archiveUri"
          $restoreOutput = aws s3 cp $archiveUri $archivePath --region $env:RUST_BUILD_CACHE_REGION --no-progress --only-show-errors 2>&1
          if ($LASTEXITCODE -eq 0) {
            try {
              Expand-Archive -Path $archivePath -DestinationPath $env:VCPKG_BINARY_CACHE_DIR -Force
              Write-Host "Restored vcpkg binary cache archive"
            } catch {
              Write-Warning "Failed to extract vcpkg cache archive: $($_.Exception.Message)"
            }
          } else {
            $restoreOutputText = ($restoreOutput | Out-String).Trim()
            Write-Warning "Skipping vcpkg cache restore from ${archiveUri}: $restoreOutputText"
            $global:LASTEXITCODE = 0
          }
      - name: Install native dependencies (vcpkg)
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows-static-md openssl:x64-windows-static-md zlib:x64-windows-static-md
      - name: Persist vcpkg cache
        if: always()
        shell: pwsh
        run: |
          $cachePrefix = "$env:SCCACHE_S3_KEY_PREFIX/vcpkg/$env:VCPKG_DEFAULT_TRIPLET"
          $archiveUri = "s3://$env:RUST_BUILD_CACHE_BUCKET/$cachePrefix/cache.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "vcpkg-cache-$env:VCPKG_DEFAULT_TRIPLET.zip"
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Write-Warning "AWS CLI not found; skipping vcpkg cache persist"
            exit 0
          }

          $cacheEntries = Get-ChildItem -Path $env:VCPKG_BINARY_CACHE_DIR -Recurse -File -ErrorAction SilentlyContinue
          if (-not $cacheEntries) {
            Write-Host "No vcpkg cache artifacts to persist"
            exit 0
          }

          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }
          Compress-Archive -Path (Join-Path $env:VCPKG_BINARY_CACHE_DIR '*') -DestinationPath $archivePath -Force
          Write-Host "Persisting vcpkg binary cache to $archiveUri"
          $persistOutput = aws s3 cp $archivePath $archiveUri --region $env:RUST_BUILD_CACHE_REGION --no-progress --only-show-errors 2>&1
          if ($LASTEXITCODE -ne 0) {
            $persistOutputText = ($persistOutput | Out-String).Trim()
            Write-Warning "Failed to upload vcpkg cache archive: $persistOutputText"
            $global:LASTEXITCODE = 0
          }
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-test-windows_x86
      - name: Configure sccache
        if: env.SCCACHE_BUCKET != ''
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          "SCCACHE_IDLE_TIMEOUT=0" >> $env:GITHUB_ENV
      - name: Configure version if tag commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          python .github/scripts/set_root_package_version.py --workspace "$env:GITHUB_WORKSPACE" --version "${{ github.ref_name }}"
      - name: Verify host dependency boundary
        shell: pwsh
        run: |
          python .github/scripts/check_host_dependency_boundaries.py
      - name: Compile root host tests
        shell: pwsh
        run: |
          cargo test -p skipprd --no-run
      - name: Compile postgres plugin tests
        shell: pwsh
        run: |
          cargo test -p skippr-plugin-data-sink-postgres --no-run

  publish_runtime_plugins:
    name: Publish Runtime Plugins
    needs:
      - plan_runtime_plugin_release
      - linux_x86
      - macos_arm64
      - windows_x86
      - linux_test_suite
      - macos_arm64_test_compile
      - windows_x86_test_compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-plugin-binaries-*

      - name: Stage runtime plugin release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_runtime_plugins.py \
            --bucket "${{ env.RELEASES_BUCKET }}" \
            --subdir "${{ env.RUNTIME_PLUGIN_RELEASE_SUBDIR }}" \
            --public-base-url "https://install.skippr.io/releases/${{ env.RUNTIME_PLUGIN_RELEASE_SUBDIR }}" \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/runtime-plugin-release"
          python3 -c 'from pathlib import Path; [print(path) for path in sorted(Path("runtime-plugin-release").rglob("*")) if path.is_file()]'

      - name: Validate staged runtime plugin manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          sys.path.insert(0, str((workspace / ".github" / "scripts").resolve()))
          from runtime_plugin_catalog import (
              load_workspace_plugin_catalog,
              versioned_manifest_relative_path,
              workspace_runtime_protocol_version,
          )

          release_root = workspace / "runtime-plugin-release"
          catalog_entries = load_workspace_plugin_catalog(workspace)
          manifest_paths = [
              release_root / versioned_manifest_relative_path(entry)
              for entry in catalog_entries
          ]
          missing_manifests = [str(path) for path in manifest_paths if not path.exists()]
          if missing_manifests:
              raise SystemExit(
                  "staged runtime release is missing generated manifests:\n"
                  + "\n".join(missing_manifests)
              )

          expected_protocol_version = workspace_runtime_protocol_version(workspace)
          mismatches = []
          for path in manifest_paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              actual = payload.get("protocol_version")
              if actual != expected_protocol_version:
                  mismatches.append(
                      f"{path.name}: expected protocol_version {expected_protocol_version}, got {actual}"
                  )

          if mismatches:
              raise SystemExit(
                  "staged runtime manifests failed validation:\n" + "\n".join(mismatches)
              )

          latest_index_path = release_root / "latest" / "manifest-index.json"
          if not latest_index_path.exists():
              raise SystemExit(
                  f"staged runtime release is missing required index file: {latest_index_path}"
              )
          latest_index = json.loads(latest_index_path.read_text(encoding="utf-8"))
          indexed_filenames = sorted(
              entry["manifest_filename"] for entry in latest_index.get("manifests", [])
          )
          expected_filenames = sorted(
              entry["manifest_filename"] for entry in catalog_entries
          )
          if indexed_filenames != expected_filenames:
              raise SystemExit(
                  "latest manifest index does not match the workspace catalog:\n"
                  f"expected={expected_filenames}\nactual={indexed_filenames}"
              )
          PY

      - name: Configure AWS credentials for runtime plugin upload
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload runtime plugin artifacts and manifests
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="${{ env.RELEASES_BUCKET }}"
          SUBDIR="${{ env.RUNTIME_PLUGIN_RELEASE_SUBDIR }}"
          RELEASE_ROOT="$GITHUB_WORKSPACE/runtime-plugin-release"
          aws s3 cp "$RELEASE_ROOT/" \
            "s3://${BUCKET}/releases/${SUBDIR}/" \
            --recursive \
            --exclude "*.json"
          aws s3 cp "$GITHUB_WORKSPACE/runtime-plugin-release/" \
            "s3://${BUCKET}/releases/${SUBDIR}/" \
            --recursive \
            --exclude "*" \
            --include "*.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

