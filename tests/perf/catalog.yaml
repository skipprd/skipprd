# skippr-perf scenario catalog. WAL leftover import is out of suite.
# Postgres CDC is out of this matrix until sync --once actually exits.
defaults:
  rows: 10000
  smoke_rows: 200
  linux_rows: 2000
  required_perf: [sync]

scenarios:
  ingest-a-duckdb:
    group: smoke
    kind: ingest
    sink: duckdb
    fixture: exact_arrow
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true

  ingest-a-skipprlake:
    group: smoke
    kind: ingest
    sink: skipprlake
    fixture: exact_arrow
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true
      leftover_seg_count: 0

  copy-b-json-json:
    group: smoke
    kind: copy
    sink: file
    fixture: exact_arrow
    profile: none
    required_perf: [sync, wal_persist]
    asserts:
      identity: true

  ingest-json-parquet:
    group: smoke
    kind: ingest
    sink: file
    sink_format: parquet
    fixture: exact_arrow_ts
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true

  ingest-csv-duckdb:
    group: smoke
    kind: ingest
    sink: duckdb
    source_format: csv
    fixture: exact_arrow
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true
      row_count: true

  duckdb-ndjson:
    group: smoke
    kind: duckdb_ingest
    duckdb_pattern: ndjson
    fixture: exact_arrow
    rows: 100000
    smoke_rows: 5000
    linux_rows: 50000
    required_perf: [sync]
    asserts:
      row_count: true
      amount_sum: true

  duckdb-csv:
    group: smoke
    kind: duckdb_ingest
    duckdb_pattern: csv
    fixture: exact_arrow
    rows: 100000
    smoke_rows: 5000
    linux_rows: 50000
    required_perf: [sync]
    asserts:
      row_count: true
      amount_sum: true

  duckdb-json-array:
    group: always
    kind: duckdb_ingest
    duckdb_pattern: json_array
    fixture: nested_flatten
    rows: 20000
    smoke_rows: 2000
    linux_rows: 10000
    required_perf: [sync]
    asserts:
      row_count: true

  duckdb-insert-values:
    group: always
    kind: duckdb_ingest
    duckdb_pattern: insert_values
    fixture: exact_arrow
    rows: 5000
    smoke_rows: 500
    linux_rows: 2000
    required_perf: [sync]
    asserts:
      row_count: true
      amount_sum: true

  ingest-slow-flatten-duckdb:
    group: always
    kind: ingest
    sink: duckdb
    fixture: nested_flatten
    flatten_events: true
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist]
    asserts:
      exact_arrow_rows: 0
      bronze_count: true

  ingest-ops-duckdb:
    group: always
    kind: ingest
    sink: duckdb
    fixture: exact_arrow
    transform_ops: true
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim, stream_transform]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true

  ingest-aggregates-duckdb:
    group: always
    kind: ingest
    sink: duckdb
    fixture: exact_arrow
    transform_aggregates: true
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim, stream_processor]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true

  copy-format-matrix:
    group: always
    kind: wrap_existing
    script: .github/actions/e2e/file_copy/run_matrix.py
    required_perf: [sync, wal_persist]
    asserts:
      min_sync_events: 12
      min_wal_persist_events: 12

  ingest-file-postgres:
    group: always
    kind: ingest
    sink: postgres
    fixture: exact_arrow
    requires: docker
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist]
    asserts:
      bronze_count: true

  copy-stdin-file:
    group: always
    kind: copy_stdin
    sink: file
    fixture: exact_arrow
    profile: none
    required_perf: [sync, wal_persist]
    asserts:
      identity: true

  copy-socket-file:
    group: always
    kind: copy_socket
    sink: file
    fixture: exact_arrow
    profile: none
    required_perf: [sync, wal_persist]
    asserts:
      identity: true

  ingest-s3-skipprlake:
    group: optional_r2
    kind: ingest_s3_skipprlake
    fixture: exact_arrow
    secrets: r2
    skip_if_missing_secrets: true
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist]
    asserts:
      bronze_count: true

  copy-s3-file:
    group: optional_r2
    kind: wrap_existing
    script: .github/actions/e2e/s3_file_copy/run_matrix.py
    secrets: r2
    skip_if_missing_secrets: true
    required_perf: [sync, wal_persist]
    asserts:
      min_sync_events: 12
      min_wal_persist_events: 12

  copy-file-s3:
    group: optional_r2
    kind: wrap_existing
    script: .github/actions/e2e/s3_file_copy/run_s3_sink.py
    secrets: r2
    skip_if_missing_secrets: true
    required_perf: [sync, wal_persist]
    asserts:
      min_sync_events: 12
      min_wal_persist_events: 12

  copy-s3-s3:
    group: optional_r2
    kind: wrap_existing
    script: .github/actions/e2e/s3_s3_copy/run.py
    secrets: r2
    skip_if_missing_secrets: true
    required_perf: [sync, wal_persist]
    asserts:
      min_sync_events: 12
      min_wal_persist_events: 12
