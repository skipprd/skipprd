  COMPONENT_NAME: skipprd
  CONTAINER_IMAGE: $COMPONENT_NAME:$CI_COMMIT_REF_NAME
  CONTAINER_LATEST_IMAGE: $COMPONENT_NAME:latest
  CONTAINER_RELEASE_IMAGE: $COMPONENT_NAME:v3.0.0
  DOCKER_HUB_REPO: skippr
  ECR_HOST: 536671797322.dkr.ecr.us-east-1.amazonaws.com
  AWS_ECR_REGISTRY: $ECR_HOST/$COMPONENT_NAME

services:
  - docker:dind

stages:
