    kind: ingest
    sink: file
    sink_format: parquet
    fixture: exact_arrow
    flatten_events: true
    transform_py: stamp
    transform_sql: compose
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim, stream_transform]
    asserts:
      bronze_count: true
      dest_has: [mapped, amount_gbp]

