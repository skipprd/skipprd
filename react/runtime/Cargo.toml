[package]
name = "react"
version = "0.0.0-git"
edition = "2021"

[dependencies]
async-trait = "0.1.77"
clap = { version = "4.0.32", features = ["derive"] }
serde = "1.0.105"
serde_derive = "1.0.105"
serde_json = "1.0.85"
serde_yaml = "0.9.16"
chrono = "=0.4.42"
regex = "1.7.0"
rand = "0.8.5"
once_cell = "1.17.0"
dashmap = "5.5.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"], default-features = false }
futures = "0.3.25"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
thiserror = "1.0.58"
bytes = "1.5.0"
tempfile = "3.10"
walkdir = { version = "2.3.2", features = [] }
itertools = "0.12"
lazy_static = "1.4.0"
hex = "0.4.3"
ureq = { version = "2", features = ["json"] }
crossterm = "0.27"
react-core = { path = "../core" }
react-module-provider-vector-lance = { path = "../modules/provider-vector-lance" }

# Vector store + Arrow
arrow = { version = "56.2.0", features = ["ipc_compression"] }
arrow-schema = "56.2.0"
arrow-buffer = "56.2.0"
sha2 = "0.10"

# WS server
tokio-tungstenite = "0.21"
tungstenite = "0.21"

[dev-dependencies]
httpmock = "0.7"
react-suites = { path = "../suites/react-suites" }

[features]
llama_cpp = []

