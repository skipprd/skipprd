# Include specifics for the various components.
# Refer to these files for overrides.
include:
#  - local: '/ci-templates/.gitlab-ci-skippr-base-nzt.yml'
#  - local: '/ci-templates/.gitlab-ci-skippr-base-zt.yml'
#  - local: '/ci-templates/.gitlab-ci-skippr-app.yml'
  - local: '/ci-templates/.gitlab-ci-skipprd.yml'
#  - local: '/ci-templates/.gitlab-ci-skippr-queue.yml'


services:
  - docker:dind

stages:
  - tests
  - publish-image-base
  - publish
  - build-ami
#  - build-test
  - deploy
  - infra

variables:
  AWS_REGION: eu-west-2
  AWS_DEFAULT_REGION: $AWS_REGION
  AWS_PROFILE_LOCATION: /root/.aws/credentials
  COMPONENT_NAME: set-me
  PROJECT_NAME: $CI_PROJECT_NAME
  #  ECR_HOST: public.ecr.aws/skippr
  ECR_HOST: 536671797322.dkr.ecr.eu-west-2.amazonaws.com
  ECR_URL: $ECR_HOST/$COMPONENT_NAME
  DOCKER_HUB_HOST: skippr
  DOCKER_HUB_URL: $DOCKER_HUB_HOST/$COMPONENT_NAME
  DOCKERFILE_LOCATION: Dockerfile${COMPONENT_NAME}
  LATEST_DEV_TAG: latest-dev
#  LATEST_PREPROD_TAG: latest-preprod
#  LATEST_UAT_TAG: latest-uat
  LATEST_PROD_TAG: latest
  DOCKER_BUILDKIT: 1

before_script:
  - set -x

