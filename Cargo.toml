[package]
name = "skippr"
version = "0.0.0-git"
edition = "2021"

[[bin]]
name = "skippr-el"
path = "src/main.rs"

[dependencies]
serde_derive = "1.0.105"
serde = "1.0.105"
serde_json = "1.0.85"
serde_yaml = "0.9.16"
schemars = "0.7.0"
regex = "1.7.0"
memory-stats = "1.0.0"
rand = "0.8.5"
chrono = "=0.4.42"
chrono-tz = "0.8.6"
icu = "1.0.0"
array-init = "2.1.0"
envy = "0.4.2"
aws-config = "1.5.1"
aws-sdk-s3 = "1.32.0"
aws-types = "1.3.1"
aws-sdk-athena = "1.30.0"
tokio = { version = "1", features = ["full"] }
flate2 = "1.0.25"
csv = "1.1.6"
futures = "0.3.25"
periodic = "0.1.1"
glob = "0.3.0"
cc = "1.2.41"
clap = { version = "4.0.32", features = ["derive"] }
yaml-rust = "0.4.5"
once_cell = "1.17.0"
parquet = "56.2.0"
arrow = { version = "56.2.0", features = ["ipc_compression"] }
arrow-schema = "56.2.0"
arrow-buffer = "56.2.0"
indexmap = "1.9.2"
reqwest = { version = "0.11.16", features = ["blocking", "json"] }
lazy_static = "1.4.0"
urldecode = "0.1.1"
url = "2.3.1"
aws-smithy-http = "0.60.8"
aws-sdk-glue = "1.38.0"
md5 = "0.7.0"
phf = { version = "0.11.1", default-features = false, features = ["macros"] }
sled = { version = "0.34.4" }
zerocopy = "0.6.1"
byteorder = "1.4.3"
ctrlc = "3.2.5"
signal-hook = "0.3.15"
lru = "0.10.0"
tar = "0.4.38"
zip = "0.6.6"
threadpool = "1.8.1"
num_cpus = "1.16.0"
avro-rs = "0.13.0"
datafusion = "50.3.0"
serde-xml-rs = "0.6.0"
serde-transcode = "1.1.1"
serde-value = "0.7.0"
hex = "0.4.3"
shellexpand = "3.1.0"
toml = "0.8.1"
dashmap = "5.5.3"
libc = "0.2.151"
bincode = { version = "1.3", features = [] }
serde_cbor = { version = "0.11.2", features = [] }
sqlparser = "0.43.1"
ini = "1.3.0"
walkdir = { version = "2.3.2", features = [] }
bytes = "1.5.0"
async-trait = "0.1.77"
thiserror = "1.0.58"
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp"] }
rayon = "1.8.0"
arc-swap = "1.6"
tokio-util = { version = "0.7", features = ["io", "io-util", "compat"], default-features = false }
sha2 = "0.10"
aws-credential-types = "1.2.0"
ratatui = { version = "0.26" }
crossterm = { version = "0.27" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
crossbeam-channel = "0.5.15"
ureq = { version = "2", features = ["json"] }
lancedb = "0.22.3"
log = "0.4.28"
tokio-tungstenite = "0.21"
futures-util = "0.3"
tungstenite = "0.21"
uuid = { version = "1", features = ["v4"] }
tempfile = "3.10"
itertools = "0.12"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono"] }
bb8 = "0.9"
bb8-tiberius = "0.15"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
rsa = "0.9.10"
base64 = "0.22.1"
tracing-appender = "0.2.4"
tokio-postgres = "0.7.16"
pgwire-replication = "0.3.0"
postgres-native-tls = "0.5.2"
native-tls = "0.2.18"
aes = { version = "0.8", default-features = false }
mysql_async = "0.34"
aws-sdk-dynamodb = "1.51.0"
aws-sdk-kinesis = "1.48.0"
aws-sdk-sqs = "1.47.0"
aws-sdk-eventbridge = "1"
aws-sdk-sns = "1"
aws-sdk-redshiftdata = "1"
mongodb = "3"
rumqttc = "0.24"
ssh2 = "0.9"
deltalake = { version = "0.27", features = ["datafusion"] }
lapin = "2"
axum = "0.7"
rdkafka = { version = "0.36", features = ["cmake-build"] }
clickhouse = { version = "0.13", features = ["inserter"] }
aws-sdk-dynamodbstreams = "1.51.0"

[features]
stats_integration = []

[dev-dependencies]
serial_test = "1.0.0"
assert_cmd = "2"
predicates = "3"
proptest = "1.10.0"

[target.'cfg(unix)'.dependencies]
nix = "0.26.2"

[profile.profiling]
inherits = "release"
debug = true
