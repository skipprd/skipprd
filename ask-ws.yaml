openapi: 3.1.0
info:
  title: ReAct WebSocket API
  version: 0.3.0
  description: |
    WebSocket-based chat threads for the ReAct server. Clients send JSON frames and receive JSON frames.
    Supported client message types: list, suites, new, open, user, approve, reject, history, seen, delete, plans, thread_state.
    Server message types: list, suites, thread_assigned, final, review, await_user, await_approval, unread, ok, error, history, plans, plans_changed, thread_state, phase, tool_start, tool_end, llm_start, llm_end.

servers:
  - url: ws://{host}:{port}/
    description: WebSocket endpoint
    variables:
      host:
        default: localhost
      port:
        default: "8787"

# No security (for now)
security: []

tags:
  - name: websocket
    description: WebSocket handshake and message contracts

paths:
  "/":
    get:
      tags: [websocket]
      summary: WebSocket handshake (Upgrade)
      description: |
        Connect via WebSocket and exchange JSON messages.
        Frames must conform to the schemas under components/schemas.
      x-websocket: true
      responses:
        "101":
          description: Switching Protocols to WebSocket
        "400":
          description: Bad Request

components:
  schemas:
    # Discriminated unions for client->server and server->client messages
    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/ListRequest'
        - $ref: '#/components/schemas/SuitesRequest'
        - $ref: '#/components/schemas/NewRequest'
        - $ref: '#/components/schemas/OpenRequest'
        - $ref: '#/components/schemas/UserRequest'
        - $ref: '#/components/schemas/ThreadStateRequest'
        - $ref: '#/components/schemas/HistoryRequest'
        - $ref: '#/components/schemas/SeenRequest'
        - $ref: '#/components/schemas/PlansRequest'
        - $ref: '#/components/schemas/DeleteRequest'
        - $ref: '#/components/schemas/ApproveRequest'
        - $ref: '#/components/schemas/RejectRequest'
      discriminator:
        propertyName: type
        mapping:
          list: '#/components/schemas/ListRequest'
          suites: '#/components/schemas/SuitesRequest'
          new: '#/components/schemas/NewRequest'
          open: '#/components/schemas/OpenRequest'
          user: '#/components/schemas/UserRequest'
          thread_state: '#/components/schemas/ThreadStateRequest'
          history: '#/components/schemas/HistoryRequest'
          seen: '#/components/schemas/SeenRequest'
          plans: '#/components/schemas/PlansRequest'
          delete: '#/components/schemas/DeleteRequest'
          approve: '#/components/schemas/ApproveRequest'
          reject: '#/components/schemas/RejectRequest'

    ServerMessage:
      oneOf:
        - $ref: '#/components/schemas/ListResponse'
        - $ref: '#/components/schemas/SuitesResponse'
        - $ref: '#/components/schemas/FinalResponse'
        - $ref: '#/components/schemas/ReviewResponse'
        - $ref: '#/components/schemas/PlansResponse'
        - $ref: '#/components/schemas/PlansChangedResponse'
        - $ref: '#/components/schemas/ThreadStateResponse'
        - $ref: '#/components/schemas/PhaseResponse'
        - $ref: '#/components/schemas/AwaitUserResponse'
        - $ref: '#/components/schemas/AwaitApprovalResponse'
        - $ref: '#/components/schemas/OkResponse'
        - $ref: '#/components/schemas/ErrorResponse'
        - $ref: '#/components/schemas/ThreadAssignedResponse'
        - $ref: '#/components/schemas/HistoryResponse'
        - $ref: '#/components/schemas/UnreadResponse'
        - $ref: '#/components/schemas/ToolStartResponse'
        - $ref: '#/components/schemas/ToolEndResponse'
        - $ref: '#/components/schemas/LlmStartResponse'
        - $ref: '#/components/schemas/LlmEndResponse'
      discriminator:
        propertyName: type
        mapping:
          list: '#/components/schemas/ListResponse'
          suites: '#/components/schemas/SuitesResponse'
          final: '#/components/schemas/FinalResponse'
          review: '#/components/schemas/ReviewResponse'
          plans: '#/components/schemas/PlansResponse'
          plans_changed: '#/components/schemas/PlansChangedResponse'
          thread_state: '#/components/schemas/ThreadStateResponse'
          phase: '#/components/schemas/PhaseResponse'
          await_user: '#/components/schemas/AwaitUserResponse'
          await_approval: '#/components/schemas/AwaitApprovalResponse'
          ok: '#/components/schemas/OkResponse'
          error: '#/components/schemas/ErrorResponse'
          thread_assigned: '#/components/schemas/ThreadAssignedResponse'
          history: '#/components/schemas/HistoryResponse'
          unread: '#/components/schemas/UnreadResponse'
          tool_start: '#/components/schemas/ToolStartResponse'
          tool_end: '#/components/schemas/ToolEndResponse'
          llm_start: '#/components/schemas/LlmStartResponse'
          llm_end: '#/components/schemas/LlmEndResponse'

    # Client -> Server
    ListRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid]
      properties:
        v:
          type: integer
        type:
          type: string
          enum: [list]
        cid:
          type: string
          description: Client correlation id (UUID)

    SuitesRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid]
      properties:
        v: { type: integer }
        type: { type: string, enum: [suites] }
        cid:
          type: string
          description: Client correlation id (UUID)

    NewRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, suiteId, agentType]
      properties:
        v:
          type: integer
        cid:
          type: string
        type:
          type: string
          enum: [new]
        question:
          type: string
          nullable: true
          description: Optional initial message. If absent, creates an empty thread.
        suiteId:
          type: string
          description: Suite id to use (e.g. data_engineer | kb)
        agentType:
          type: string
          description: Agent/mode to use (ask | cleanse | model | kb | agent | review). Required.
          enum: [ask, cleanse, model, kb, agent, review]

    OpenRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id, suiteId, agentType]
      properties:
        v:
          type: integer
        cid:
          type: string
        type:
          type: string
          enum: [open]
        thread_id:
          type: string
          description: Existing thread id returned by a previous interaction
        question:
          type: string
          description: Optional nudge to resume the thread (default is "Continue.")
        suiteId:
          type: string
          description: Suite id to use (e.g. data_engineer | kb)
        agentType:
          type: string
          description: Agent to use for this message; if differs from current, a switch_agent step is recorded.
          enum: [ask, cleanse, model, kb, agent, review]

    UserRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id, text]
      properties:
        v:
          type: integer
        cid:
          type: string
        type:
          type: string
          enum: [user]
        thread_id:
          type: string
        text:
          type: string
          description: User-provided content in response to an `await_user` prompt

    ThreadStateRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [thread_state] }
        thread_id: { type: string }

    HistoryRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [history] }
        thread_id: { type: string }
        before_thread_seq: { type: integer, nullable: true }
        limit: { type: integer, nullable: true, default: 50 }

    SeenRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id, up_to_thread_seq]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [seen] }
        thread_id: { type: string }
        up_to_thread_seq: { type: integer }

    PlansRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [plans] }
        thread_id: { type: string }

    DeleteRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [delete] }
        thread_id: { type: string }
      description: Delete a thread (removes thread JSON and any thread-scoped embeddings)

    ApproveRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [approve] }
        thread_id: { type: string }

    RejectRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [reject] }
        thread_id: { type: string }

    # Server -> Client
    ListResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, threads]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [list]
        server_time: { type: string }
        seq: { type: integer }
        threads:
          type: array
          description: List of existing threads with summaries
          items:
            type: object
            required: [thread_id]
            properties:
              thread_id: { type: string }
              title: { type: string, nullable: true }
              last_activity: { type: string, nullable: true }
              unread_count: { type: integer, nullable: true }
              last_message_preview: { type: string, nullable: true }
              suiteId:
                type: string
                nullable: true
                description: Current suite for the thread (derived from thread history)
              agentType:
                type: string
                nullable: true
                description: Current agent/mode for the thread (derived from thread history)

    SuitesResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, suites]
      properties:
        v: { type: integer }
        type: { type: string, enum: [suites] }
        server_time: { type: string }
        seq: { type: integer }
        suites:
          type: array
          description: Available suites and their allowed agent modes.
          items:
            type: object
            additionalProperties: false
            required: [suiteId, allowedAgentTypes]
            properties:
              suiteId: { type: string }
              label: { type: string, nullable: true }
              allowedAgentTypes:
                type: array
                items:
                  type: string
                  description: Agent/mode identifier (dynamic)
              defaultAgentType:
                type: string
                nullable: true
        defaultSuiteId:
          type: string
          nullable: true

    FinalResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, thread_seq, result]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [final]
        server_time: { type: string }
        seq: { type: integer }
        thread_id:
          type: string
        thread_seq:
          type: integer
        result:
          $ref: '#/components/schemas/FinalResult'

    # Typed result union for `final` frames.
    #
    # Notes:
    # - `sql` is NOT a generic field; it is Ask-mode-specific and lives inside `payload.sql`.
    # - `kind` is stable and drives client decoding; `payload` is strict per kind.
    FinalResult:
      oneOf:
        - $ref: '#/components/schemas/AskFinalResult'
        - $ref: '#/components/schemas/KbFinalResult'
        - $ref: '#/components/schemas/GenericFinalResult'
      discriminator:
        propertyName: kind
        mapping:
          ask: '#/components/schemas/AskFinalResult'
          kb: '#/components/schemas/KbFinalResult'
          generic: '#/components/schemas/GenericFinalResult'

    AskFinalResult:
      type: object
      additionalProperties: false
      required: [kind, payload]
      properties:
        kind: { type: string, enum: [ask] }
        payload:
          $ref: '#/components/schemas/AskFinalPayload'

    AskFinalPayload:
      type: object
      additionalProperties: false
      required: [answer, sql]
      properties:
        answer:
          type: string
          description: Plain-text concise answer.
        sql:
          type: string
          description: SQL used/generated by Ask mode to produce the answer.
        data:
          description: Optional tabular data from the last successful run_sql
          type: object
          additionalProperties: false
          required: [header, rows]
          properties:
            header:
              type: array
              items: { type: string }
            rows:
              type: array
              items:
                type: array
                items: { type: string }
        chart:
          description: Optional chart suggestion derived from data shape
          type: object
          additionalProperties: false
          required: [type, x, y]
          properties:
            type:
              type: string
              enum: [line, bar, area]
            x:
              type: string
            y:
              type: array
              items: { type: string }

    KbFinalResult:
      type: object
      additionalProperties: false
      required: [kind, payload]
      properties:
        kind: { type: string, enum: [kb] }
        payload:
          $ref: '#/components/schemas/KbFinalPayload'

    KbFinalPayload:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer:
          type: string
          description: Plain-text concise answer.

    # Temporary catch-all while suites are migrated to typed finals.
    # This should shrink over time as each suite adds explicit payload schemas.
    GenericFinalResult:
      type: object
      additionalProperties: false
      required: [kind, payload]
      properties:
        kind: { type: string, enum: [generic] }
        payload:
          $ref: '#/components/schemas/GenericFinalPayload'

    GenericFinalPayload:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: Human-readable final text for non-Ask suites during migration.

    ReviewResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, thread_seq, text]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [review]
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer }
        text:
          type: string
          description: Read-only reviewer output (red team)
        meta:
          type: object
          nullable: true
          additionalProperties: true

    PlansResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id]
      properties:
        v: { type: integer }
        type: { type: string, enum: [plans] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        cleanse:
          $ref: '#/components/schemas/PlanSnapshot'
          nullable: true
        model:
          $ref: '#/components/schemas/PlanSnapshot'
          nullable: true

    PlansChangedResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, changed]
      properties:
        v: { type: integer }
        type: { type: string, enum: [plans_changed] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        changed:
          type: array
          items:
            type: string
            enum: [cleanse, model]
          description: Which plan kinds changed. UI should fetch `plans` to get latest snapshots.
        cleanse_plan_key: { type: string, nullable: true }
        model_plan_key: { type: string, nullable: true }

    ThreadStateResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, state]
      properties:
        v: { type: integer }
        type: { type: string, enum: [thread_state] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        state:
          $ref: '#/components/schemas/ThreadStateSnapshot'

    PhaseResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, step_idx, phase, ts, runs, total_runtime_ms]
      properties:
        v: { type: integer }
        type: { type: string, enum: [phase] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        step_idx:
          type: integer
          description: Index of the backing ThreadStep::Phase in the thread log.
        phase: { type: string }
        from_phase: { type: string, nullable: true }
        reason_code: { type: string, nullable: true }
        reason_detail:
          type: object
          nullable: true
          additionalProperties: true
        ts:
          type: string
          description: RFC3339 timestamp stored in the thread log for this phase transition.
        runs:
          type: array
          description: |
            List of start/end windows for this phase across the thread lifetime.
            Each re-entry into the phase appends a new run.
          items:
            $ref: '#/components/schemas/PhaseRun'
        total_runtime_ms:
          type: integer
          format: int64
          description: Sum of all completed run durations for this phase (ms).
        from_phase_runs:
          type: array
          nullable: true
          description: |
            If `from_phase` is present, this is the updated run list for the phase being exited.
          items:
            $ref: '#/components/schemas/PhaseRun'
        from_phase_total_runtime_ms:
          type: integer
          format: int64
          nullable: true
          description: If `from_phase` is present, sum of all completed run durations for it (ms).

    PhaseRun:
      type: object
      additionalProperties: false
      required: [started_at]
      properties:
        started_at:
          type: string
          description: RFC3339 start timestamp for this run.
        ended_at:
          type: string
          nullable: true
          description: RFC3339 end timestamp for this run (null if in progress).
        runtime_ms:
          type: integer
          format: int64
          nullable: true
          description: Duration for this run (ms), present when ended_at is present.
 
    ToolEventStatus:
      type: string
      enum: [running, ok, failed]

    ThreadEventKind:
      type: string
      enum: [tool_start, tool_end, llm_start, llm_end]

    ThreadEvent:
      type: object
      additionalProperties: false
      required: [step_idx, event_kind, ts]
      properties:
        step_idx:
          type: integer
          description: Index of the backing ThreadStep in the thread log.
        event_kind:
          $ref: '#/components/schemas/ThreadEventKind'
        ts:
          type: string
          description: RFC3339 timestamp of the event.
        tool_id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        clean_name:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ToolEventStatus'
        runtime_ms:
          type: integer
          format: int64
          nullable: true
        payload:
          type: object
          nullable: true
          additionalProperties: true
        error:
          type: string
          nullable: true
        call_id:
          type: integer
          nullable: true
        model:
          type: string
          nullable: true
        phase:
          type: string
          nullable: true

    ToolStartResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, tool_id, name, status]
      properties:
        v: { type: integer }
        type: { type: string, enum: [tool_start] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        tool_id: { type: string }
        name: { type: string }
        clean_name:
          type: string
          description: Human-readable, short, self-documenting label for UI (e.g. "Read dbt_project.yml").
        phase:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ToolEventStatus'
        payload:
          type: object
          nullable: true
          additionalProperties: true

    ToolEndResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, tool_id, name, status]
      properties:
        v: { type: integer }
        type: { type: string, enum: [tool_end] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        tool_id: { type: string }
        name: { type: string }
        clean_name:
          type: string
          description: Human-readable, short, self-documenting label for UI (e.g. "Read dbt_project.yml").
        phase:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ToolEventStatus'
        payload:
          type: object
          nullable: true
          additionalProperties: true
        error:
          type: string
          nullable: true

    LlmStartResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, call_id, phase]
      properties:
        v: { type: integer }
        type: { type: string, enum: [llm_start] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        call_id: { type: integer }
        phase: { type: string }
        model: { type: string, nullable: true }

    LlmEndResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, call_id, phase, status]
      properties:
        v: { type: integer }
        type: { type: string, enum: [llm_end] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        call_id: { type: integer }
        phase: { type: string }
        model: { type: string, nullable: true }
        status:
          type: string
          enum: [ok, failed]
        error: { type: string, nullable: true }

    PlanSnapshot:
      type: object
      additionalProperties: false
      required: [planKind, planKey, status, tasks]
      properties:
        planKind:
          type: string
          enum: [cleanse, model]
        planKey:
          type: string
        status:
          $ref: '#/components/schemas/PlanStatus'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/PlanTask'
        projectSnapshot:
          type: object
          additionalProperties: true
          description: |
            Optional, suite-owned snapshot payload for UI/debugging (e.g. batched review notes).
            This is an opaque JSON object; clients must treat it as best-effort and forward-compatible.

    ThreadStateSnapshot:
      type: object
      additionalProperties: false
      required: [thread_state_schema_version, thread_id, last_materialized_step_count, total_runtime_ms, phases, completedPhases, events, items]
      properties:
        thread_state_schema_version: { type: integer }
        thread_id: { type: string }
        suiteId: { type: string, nullable: true }
        agentType: { type: string, nullable: true }
        currentPhase: { type: string, nullable: true }
        last_materialized_step_count: { type: integer }
        total_runtime_ms: { type: integer, format: int64 }
        phases:
          type: array
          items: { type: string }
          description: |
            Ordered suite phases for the current suite+agent_type (suite-owned ordering).
            Clients should treat this as the authoritative phase order for rendering progress.
        completedPhases:
          type: array
          items: { type: string }
          description: |
            Subset of `phases` that are considered completed, derived from `currentPhase` and
            the suite's phase order. (Does not include the current in-flight phase.)
        events:
          type: array
          items:
            $ref: '#/components/schemas/ThreadEvent'
          description: |
            Recent, durable timeline events for UI. This is a bounded, best-effort list intended
            for "post reconnect" tool timelines. (Not a complete event log.)
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadStateItem'
        planSummaries:
          type: object
          nullable: true
          additionalProperties: true
          description: Summary-only plan refs (opaque JSON by kind).

    ThreadStateItem:
      type: object
      additionalProperties: false
      required: [item_id, kind, status]
      properties:
        item_id: { type: string }
        kind: { type: string }
        status: { type: string }
        started_at: { type: string, nullable: true }
        finished_at: { type: string, nullable: true }
        runtime_ms: { type: integer, format: int64, nullable: true }
        last_error:
          $ref: '#/components/schemas/ThreadStateItemError'
        outputs:
          type: object
          additionalProperties: true
          description: Opaque outputs object (suite/tool specific). Keep small.

    ThreadStateItemError:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: { type: string }
        tool_step_idx: { type: integer, nullable: true }
        step_ts: { type: string, nullable: true }

    PlanStatus:
      type: string
      enum: [draft, approved, completed, cancelled]

    PlanTaskStatus:
      type: string
      enum: [pending, in_progress, done, blocked, needs_update]

    PlanTask:
      oneOf:
        - $ref: '#/components/schemas/CleanseTaskSnapshot'
        - $ref: '#/components/schemas/ModelTaskSnapshot'
      discriminator:
        propertyName: taskKind
        mapping:
          cleanse: '#/components/schemas/CleanseTaskSnapshot'
          model: '#/components/schemas/ModelTaskSnapshot'

    CleanseTaskSnapshot:
      type: object
      additionalProperties: false
      required: [taskId, dataset_id, status]
      properties:
        taskId: { type: string }
        dataset_id: { type: string }
        expected_model_path: { type: string, nullable: true }
        invariants:
          type: array
          items: { type: string }
        status:
          $ref: '#/components/schemas/PlanTaskStatus'
        notes:
          type: array
          items: { type: string }

    ModelTaskSnapshot:
      type: object
      additionalProperties: false
      required: [taskId, name, status]
      properties:
        taskId: { type: string }
        name: { type: string }
        folder: { type: string, nullable: true }
        goal: { type: string, nullable: true }
        inputs:
          type: array
          items: { type: string }
        expected_model_path: { type: string, nullable: true }
        invariants:
          type: array
          items: { type: string }
        status:
          $ref: '#/components/schemas/PlanTaskStatus'
        notes:
          type: array
          items: { type: string }

    # Legacy plan diff/change schemas removed (hard cutover to thread_state + plans).

    AwaitUserResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, thread_seq, prompt]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [await_user]
        server_time: { type: string }
        seq: { type: integer }
        thread_id:
          type: string
        thread_seq:
          type: integer
        prompt:
          type: string
          description: Question the agent asks the user to proceed
    AwaitApprovalResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, thread_seq, prompt]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [await_approval]
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer }
        prompt:
          type: string
          description: Approval request message; clients should present Approve/Reject controls

    OkResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [ok]
        server_time: { type: string }
        cid: { type: string, nullable: true }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, error]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [error]
        server_time: { type: string }
        error:
          type: string
        code: { type: string, description: One of rate_limited, invalid_request, not_found, thread_closed, internal }
        cid: { type: string, nullable: true }
        retry_after_ms: { type: integer, nullable: true }

    ThreadAssignedResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, cid, thread_id]
      properties:
        v: { type: integer }
        type: { type: string, enum: [thread_assigned] }
        server_time: { type: string }
        seq: { type: integer }
        cid: { type: string }
        thread_id: { type: string }

    HistoryResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, messages]
      properties:
        v: { type: integer }
        type: { type: string, enum: [history] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        title: { type: string, nullable: true }
        suiteId:
          type: string
          nullable: true
          description: Current suite for the thread (derived from thread history)
        agentType:
          type: string
          nullable: true
          description: Current agent/mode for the thread (derived from thread history)
        messages:
          type: array
          items:
            type: object
            required: [thread_seq, role, content, created_at]
            properties:
              thread_seq: { type: integer }
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
              created_at: { type: string }
        next_before_thread_seq: { type: integer, nullable: true }

    UnreadResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, unread_count]
      properties:
        v: { type: integer }
        type: { type: string, enum: [unread] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        unread_count: { type: integer }

  examples:
    listRequest:
      summary: List threads
      value:
        v: 1
        type: list
        cid: "b2a4c2b5-1d19-4b5c-a0b3-2f8f7a7c9d11"
    suitesRequest:
      summary: List available suites
      value:
        v: 1
        type: suites
        cid: "c2a4c2b5-1d19-4b5c-a0b3-2f8f7a7c9d11"
    listResponse:
      summary: Threads listed
      value:
        v: 1
        type: list
        server_time: "2025-11-16T12:00:00Z"
        seq: 101
        threads:
          - thread_id: th_1731760000000
            last_activity: "2025-11-16T11:59:30Z"
            unread_count: 0
            last_message_preview: "Hi there!"
            suiteId: "data_engineer"
            agentType: "ask"
          - thread_id: th_1731761111222
            last_activity: "2025-11-16T11:58:10Z"
            unread_count: 2
            last_message_preview: "Can you tell me more?"
            suiteId: "data_engineer"
            agentType: "model"
    suitesResponse:
      summary: Suites listed
      value:
        v: 1
        type: suites
        server_time: "2025-11-16T12:00:00Z"
        seq: 100
        defaultSuiteId: "default_suite"
        suites:
          - suiteId: "default_suite"
            label: "Default"
            allowedAgentTypes: ["ask"]
            defaultAgentType: "ask"
          - suiteId: "analytics_suite"
            label: "Analytics"
            allowedAgentTypes: ["cleanse", "model"]
            defaultAgentType: "model"

    newRequest:
      summary: Start a new thread
      value:
        v: 1
        type: new
        cid: "a1111111-2222-3333-4444-555555555555"
        suiteId: "data_engineer"
        agentType: "ask"
        question: What were total rides last week?
    threadAssigned:
      summary: Server assigned a thread id for the new request
      value:
        v: 1
        type: thread_assigned
        server_time: "2025-11-16T12:00:01Z"
        seq: 102
        cid: "a1111111-2222-3333-4444-555555555555"
        thread_id: th_1731761234567
    processing:
      summary: Server is working on the request
      value:
        v: 1
        type: processing
        server_time: "2025-11-16T12:00:01Z"
        seq: 103
        thread_id: th_1731761234567
        stage: processing
        progress: 0.4
    token:
      summary: Optional streaming token
      value:
        v: 1
        type: token
        server_time: "2025-11-16T12:00:02Z"
        seq: 104
        thread_id: th_1731761234567
        delta: "Rides trended up "
    finalResponse:
      summary: Final answer
      value:
        v: 1
        type: final
        server_time: "2025-11-16T12:00:03Z"
        seq: 105
        thread_id: th_1731761234567
        thread_seq: 1
        result:
          kind: ask
          payload:
            answer: Rides trended up 8% vs the prior week.
            sql: |
              SELECT date, COUNT(*) AS rides
              FROM trips
              WHERE date >= DATE_SUB(CURRENT_DATE, INTERVAL 7 DAY)
              GROUP BY date
              ORDER BY date

    awaitUserResponse:
      summary: Agent needs user input
      value:
        v: 1
        type: await_user
        server_time: "2025-11-16T12:00:04Z"
        seq: 106
        thread_id: th_1731761234567
        thread_seq: 2
        prompt: Please tell me a bit about your business (1–3 sentences).
    awaitApprovalResponse:
      summary: Agent requests approval for a proposal
      value:
        v: 1
        type: await_approval
        server_time: "2025-11-16T12:00:05Z"
        seq: 107
        thread_id: th_1731761234567
        thread_seq: 3
        prompt: Approve the updated MetricFlow definition for metric 'rides_weekly'?
    approveRequest:
      summary: Approve current proposal
      value:
        v: 1
        type: approve
        cid: "a1111111-2222-3333-4444-555555555555"
        thread_id: th_1731761234567
    rejectRequest:
      summary: Reject current proposal
      value:
        v: 1
        type: reject
        cid: "a1111111-2222-3333-4444-555555555555"
        thread_id: th_1731761234567

    userRequest:
      summary: Provide user input
      value:
        v: 1
        type: user
        cid: "b1111111-2222-3333-4444-555555555555"
        thread_id: th_1731761234567
        text: We rent e-bikes in NYC and care about weekend demand.
    okResponse:
      summary: Acknowledgement
      value:
        v: 1
        type: ok
        server_time: "2025-11-16T12:00:04Z"

  x-notes:
    semantics: |
      - Clients send a request frame and receive a sequence of responses: ok/error, thread_assigned (for new), processing/token (optional), then final or await_user/await_approval.
      - Flow: `new` -> (ok) -> [thread_assigned] -> [`processing`/`token`]* -> (`final` | `await_user` | `await_approval`). If `await_user`, send `user` to continue. If `await_approval`, send `approve` or `reject` (or `user` with edits) to continue.
      - Most server frames include `seq` and `server_time`. Thread-scoped frames include `thread_seq`.
    security: |
      No authentication/authorization is enforced by the server as specified here. Avoid exposing publicly.


