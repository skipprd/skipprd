[package]
name = "react-module-provider-motherduck"
version = "0.0.0-git"
edition = "2021"

[dependencies]
async-trait = "0.1.77"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
