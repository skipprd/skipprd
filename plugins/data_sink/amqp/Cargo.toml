[package]
name = "skippr-plugin-data-sink-amqp"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-sink-amqp"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true
bytes.workspace = true
hex.workspace = true
parquet.workspace = true

arrow = { version = "58.3.0", features = ["ipc_compression"] }
async-trait = "0.1.77"
datafusion.workspace = true
futures = "0.3.25"
lapin = { version = "2" }
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSink"
plugin_name = "Amqp"

[package.metadata.skippr-plugin.sink_capability]
name = "Amqp"
guarantee_tier = "CdcEncodedOnly"
can_manage_skippr_columns = false
can_maintain_tombstone_tables = false
can_compare_order_tokens = false
supports_transactions = false
retry_semantics = "AtLeastOnce"
grouping_support = "CdcEncodedBatches"
