name: Rust Build Release
description: 'Rust release'
inputs:
  rust-version:
    description: 'version of rust to install (e.g. stable)'
    required: true
    default: 'stable'
  architecture_name:
    description: 'macos_arm64, macos-x86, linux_x86'
    required: true
    default: 'stable'
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Install system dependencies (linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ "$(id -u)" = "0" ]; then
          apt-get update
          apt-get install -y protobuf-compiler
        else
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
        fi
    - name: Setup Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable
        rustup default stable
        rustup component add rustfmt
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-release
        key: ${{ inputs.architecture_name }}
    - name: Configure version if tag commit
      shell: bash
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mv Cargo.toml Cargo.toml.orig
        sed "s/0\\.0\\.0-git/${{ github.ref_name }}/" Cargo.toml.orig > Cargo.toml
        mv Cargo.lock Cargo.lock.orig
        sed "s/0\\.0\\.0-git/${{ github.ref_name }}/" Cargo.lock.orig > Cargo.lock
    - name: Build release
      shell: bash
      run: |
        cargo build --release
        mkdir -p skippr-${{ inputs.architecture_name }}
        cp target/release/skippr skippr-${{ inputs.architecture_name }}/skippr
        ls -la skippr-${{ inputs.architecture_name }}
      env:
        # do not produce debug symbols to keep memory usage down
        RUSTFLAGS: "-C debuginfo=0"
    - name: Cargo Test
      shell: bash
      run: |
          cargo test --release -- --nocapture

