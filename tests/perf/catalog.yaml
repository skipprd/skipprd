# skippr-regression scenario catalog. WAL leftover import is out of suite.
# Ingest/copy: File/Stdin → DuckDB/SkipprLake/file. Postgres CDC ingest cells stay out until sync --once actually exits.
# Query (q-*): ingest then skipprd query. File parquet Iceberg vs DuckDB.
# CDC query: SnapshotThenLogExactOnce for Postgres, MySQL, DynamoDB (count / update /
# late-delete / reinsert / sum / overlap / iceberg-only), plus ALTER on that lake
# then continue CDC then query.
# File migrate query cells ALTER already-ingested rows, ingest a second batch, then query.
# SQL SELECT / CREATE TABLE / migrate: historical = drained DuckDB SELECT; stream = SkipprLake STREAM with live WAL pin.
# wal_pin: drained = the measured query pinned no WAL (W \ E empty, lake only);
#          live    = the measured query read WAL held behind the compaction hold.
# SQL filter/derive and CREATE TABLE: File = historical batch, Stdin = stream source.
# Migrate ingest cells: historical = ALTER after compact then continue ingest; stream = ALTER under a WAL compaction hold then continue ingest.
defaults:
  rows: 10000
  smoke_rows: 200
  linux_rows: 50000
  required_perf: [sync]
  table: events

scenarios:
  ingest-a-duckdb:
    group: smoke
    kind: ingest
    sink: duckdb
    fixture: exact_arrow
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true

