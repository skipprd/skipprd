[package]
name = "skippr-plugin-data-source-s3"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-s3"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-core.workspace = true
skippr-runtime-sdk.workspace = true

aws-config = "1.5.1"
aws-sdk-s3 = "1.32.0"
flate2 = "1.0.25"
futures = "0.3.25"
num_cpus = "1.16.0"
serde.workspace = true
serde_derive = "1.0.105"
tracing = "0.1"
urldecode = "0.1.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "S3"

[package.metadata.skippr-plugin.source_capability]
name = "S3"
guarantee_tier = "IncrementalOnly"
checkpoint_style = "ObjectIdentity"
bootstrap_style = "FullScan"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "ObjectPath"
