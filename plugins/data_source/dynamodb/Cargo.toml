[package]
name = "skippr-plugin-data-source-dynamodb"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-dynamodb"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-core.workspace = true
skippr-runtime-sdk.workspace = true

aws-config = "1.5.1"
aws-sdk-dynamodb = { version = "1.51.0" }
aws-sdk-dynamodbstreams = { version = "1.51.0" }
aws-types = "1.3.1"
base64 = "0.22.1"
chrono = "=0.4.42"
md5 = "0.7.0"
num_cpus = "1.16.0"
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "Dynamodb"

[package.metadata.skippr-plugin.source_capability]
name = "Dynamodb"
guarantee_tier = "SnapshotThenLogExactOnce"
checkpoint_style = "LogNative"
bootstrap_style = "AnchoredSnapshot"
order_model = "StableKeyScopedOrder"
supports_deletes = true
event_id_semantics = "LogPosition"
