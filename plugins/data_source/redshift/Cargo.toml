[package]
name = "skippr-plugin-data-source-redshift"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-redshift"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true

aws-config = "1.5.1"
aws-sdk-redshiftdata = { version = "1" }
hex = "0.4.3"
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "Redshift"

[package.metadata.skippr-plugin.source_capability]
name = "Redshift"
guarantee_tier = "IncrementalOnly"
checkpoint_style = "CursorBased"
bootstrap_style = "FullScan"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "None"
