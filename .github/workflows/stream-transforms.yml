name: Stream transforms
on:
  pull_request:
  push:
    branches:
      - stream-transforms
      - issue-14-skippr-perf
      - main
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  processor_suite:
    name: Local Sled chaos / sim / fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: skipprd
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skipprd/cloud
          path: cloud
          token: ${{ secrets.SKIPPR_CLOUD_CHECKOUT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: skipprd
          submodules: true
      - name: Install Linux x86 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: R2 sccache
        if: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
        uses: ./skipprd/.github/actions/configure-r2-sccache
        with:
          account_id: ${{ secrets.R2_ACCOUNT_ID }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Full stream-transform suite (local FS Sled)
        run: "cargo test -p skipprd --lib -- processor:: stream_transform::"
