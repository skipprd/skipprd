[package]
name = "skipprd"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
    "crates/skippr-core",
    "crates/skippr-runtime-sdk",
    "crates/skippr-cli",
    "crates/skippr-admin",
    "crates/skipprd-react-suite-data-engineer",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-postgres",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-bigquery",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-athena",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-dbt",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-catalog",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-snowflake",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-mssql",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-skippr",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-databricks",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-synapse",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-redshift",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-clickhouse",
    "crates/skipprd-react-suite-data-engineer/src/modules/provider-motherduck",
    "plugins/data_source/*",
    "plugins/data_sink/*",
    "plugins/schema_sink/*",
]

[workspace.dependencies]
async-trait = "0.1.77"
arrow = { version = "56.2.0", features = ["ipc_compression"] }
bytes = "1.5.0"
clap = { version = "4.0.32", features = ["derive"] }
dashmap = "5.5.3"
datafusion = "50.3.0"
futures = "0.3.25"
futures-util = "0.3"
hex = "0.4.3"
md5 = "0.7.0"
native-tls = "0.2.18"
once_cell = "1.17.0"
parquet = "56.2.0"
pgwire-replication = "0.3.0"
postgres-native-tls = "0.5.2"
serde = "1.0.105"
serde_derive = "1.0.105"
serde_json = "1.0.85"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.16"
tokio-tungstenite = "0.21"
tracing = "0.1"
tungstenite = "0.21"
skippr-core = { path = "crates/skippr-core" }
skippr-runtime-sdk = { path = "crates/skippr-runtime-sdk" }
react-core = { version = "1.2.1", registry = "react-cargo" }
react = { version = "1.2.1", registry = "react-cargo" }
react-module-storage-s3 = { version = "1.2.1", registry = "react-cargo" }
react-module-storage-local = { version = "1.2.1", registry = "react-cargo" }
react-module-storage-memory = { version = "1.2.1", registry = "react-cargo" }
react-module-provider-vector-lance = { version = "1.2.1", registry = "react-cargo" }
react-suite-debugger = { version = "1.2.1", registry = "react-cargo" }

[[bin]]
name = "skipprd"
path = "src/main.rs"

[[bin]]
name = "skippr-runtime-plugin-test-helper"
path = "src/bin/skippr-runtime-plugin-test-helper.rs"

[dependencies]
serde_derive = "1.0.105"
serde = "1.0.105"
serde_json = "1.0.85"
serde_yaml = "0.9.16"
schemars = "0.7.0"
regex = "1.7.0"
memory-stats = "1.0.0"
rand = "0.8.5"
chrono = "=0.4.42"
chrono-tz = "0.8.6"
icu = "1.0.0"
array-init = "2.1.0"
envy = "0.4.2"
aws-config = "1.5.1"
aws-sdk-s3 = "1.32.0"
aws-types = "1.3.1"
tokio = { version = "1", features = ["full"] }
flate2 = "1.0.25"
csv = "1.1.6"
futures = "0.3.25"
periodic = "0.1.1"
glob = "0.3.0"
cc = "1.2.41"
clap = { version = "4.0.32", features = ["derive"] }
yaml-rust = "0.4.5"
once_cell = "1.17.0"
parquet = "56.2.0"
arrow = { version = "56.2.0", features = ["ipc_compression"] }
arrow-schema = "56.2.0"
arrow-buffer = "56.2.0"
indexmap = "1.9.2"
reqwest = { version = "0.11.16", default-features = false, features = ["blocking", "json", "rustls-tls"] }
lazy_static = "1.4.0"
urldecode = "0.1.1"
url = "2.3.1"
aws-smithy-http = "0.60.8"
aws-sdk-glue = "1.38.0"
md5 = "0.7.0"
phf = { version = "0.11.1", default-features = false, features = ["macros"] }
sled = { version = "0.34.4" }
zerocopy = "0.6.1"
byteorder = "1.4.3"
ctrlc = "3.2.5"
signal-hook = "0.3.15"
lru = "0.10.0"
tar = "0.4.38"
zip = "0.6.6"
threadpool = "1.8.1"
num_cpus = "1.16.0"
avro-rs = "0.13.0"
datafusion = "50.3.0"
serde-xml-rs = "0.6.0"
serde-transcode = "1.1.1"
serde-value = "0.7.0"
hex = "0.4.3"
shellexpand = "3.1.0"
toml = "0.8.1"
dashmap = "5.5.3"
libc = "0.2.151"
bincode = { version = "1.3", features = [] }
serde_cbor = { version = "0.11.2", features = [] }
sqlparser = "0.43.1"
ini = "1.3.0"
walkdir = { version = "2.3.2", features = [] }
bytes = "1.5.0"
async-trait = "0.1.77"
thiserror = "1.0.58"
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp"] }
rayon = "1.8.0"
arc-swap = "1.6"
tokio-util = { version = "0.7", features = ["io", "io-util", "compat"], default-features = false }
sha2 = "0.10"
aws-credential-types = "1.2.0"
ratatui = { version = "0.26" }
crossterm = { version = "0.27" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
crossbeam-channel = "0.5.15"
log = "0.4.28"
uuid = { version = "1", features = ["v4"] }
tempfile = "3.10"
itertools = "0.12"
base64 = "0.22.1"
tracing-appender = "0.2.4"
aes = { version = "0.8", default-features = false }
quick-xml = { version = "0.39.2", features = ["serialize"] }

[features]
stats_integration = []

[dev-dependencies]
serial_test = "1.0.0"
assert_cmd = "2"
predicates = "3"
proptest = "1.10.0"

[target.'cfg(unix)'.dependencies]
nix = "0.26.2"

[profile.profiling]
inherits = "release"
debug = true
