name: Rust CI/CD Pipeline
on:
  push:
    branches: [main]
    tags:
      - "[0-9]*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  linux_test_suite:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: cargo test (linux host/packages)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: skipprd
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skipprd/cloud
          path: cloud
          token: ${{ secrets.SKIPPR_CLOUD_CHECKOUT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: skipprd
          submodules: true
      - name: Install Linux x86 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skipprd
      - run: python3 .github/scripts/test_rust_ci.py
      - run: python3 .github/scripts/test_host_dependency_boundaries.py
      - run: python3 .github/scripts/check_host_dependency_boundaries.py
      - run: python3 .github/scripts/test_runtime_e2e_harness.py
      - run: cargo run -p skippr-connect-gen -- --check
      - name: Run root host test suite
        run: |
          cargo test -p skipprd -- --nocapture --test-threads=1
          cargo test -p skippr-lease -- --nocapture
          cargo test -p skipprd cluster:: -- --nocapture --test-threads=1
          cargo test -p skipprd buffer::durable:: -- --nocapture --test-threads=1
          cargo test -p skippr-query-ballista -- --nocapture --test-threads=1
          cargo test -p skipprd query_flight:: -- --nocapture --test-threads=1
          cargo test -p skipprd sqlrt::wal_table:: -- --nocapture --test-threads=1
          cargo test -p skipprd --test hla_cluster -- --nocapture
          ./scripts/ensure-sibling-cloud.sh
          cargo test -p skipprd --features offset-store-cloud-tables --lib cluster::validation -- --nocapture --test-threads=1
          cargo check -p skipprd --features offset-store-dynamodb
          cargo check --all-features
      - name: Run postgres plugin tests
        run: |
          cargo test -p skippr-plugin-data-sink-postgres -- --nocapture
      - name: Run CDC Iceberg and source plugin tests
        run: |
          cargo test -p skippr-plugin-data-sink-athena-iceberg --lib -- --nocapture
          cargo test -p skippr-plugin-data-source-stripe --lib -- --nocapture
          cargo test -p skippr-plugin-data-source-sumup --lib -- --nocapture
          cargo test -p skippr-plugin-data-source-xero-accounting --lib -- --nocapture
          cargo test -p skippr-plugin-data-source-revolut-business --lib -- --nocapture
          cargo test -p skippr-plugin-data-source-apple-search-ads --lib -- --nocapture
          cargo test -p skippr-plugin-data-source-adroll-ads --lib -- --nocapture
          cargo test -p skippr-plugin-data-source-linkedin-ads --lib -- --nocapture
          cargo test -p skippr-plugin-data-source-meta-ads --lib -- --nocapture
          cargo test -p skippr-plugin-data-source-dynamodb --lib -- --nocapture

  linux_x86:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: cargo build (linux x86)
    needs:
      - linux_test_suite
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skipprd/cloud
          path: cloud
          token: ${{ secrets.SKIPPR_CLOUD_CHECKOUT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: skipprd
          submodules: true
      - name: Build linux x86 release
        uses: ./skipprd/.github/actions/rust-build-release
        with:
          rust-version: "1.92.0"
          architecture_name: linux_x86
          workspace-root: skipprd

  chaos_mode_test:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: Chaos Mode (linux x86)
    needs:
      - linux_x86
      - cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: skipprd-linux_x86
          path: skipprd-linux_x86
      - name: Make skipprd executable
        run: chmod +x ./skipprd-linux_x86/skipprd
      - name: Test linux x86 release
        uses: ./.github/actions/e2e/runtime_scenario
        with:
          scenario: bike_hire_many
          architecture_name: linux_x86
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: cleanup e2e AWS resources
    needs:
      - linux_x86
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS and clean resources
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          aws s3 rm s3://skippr-e2e-sample-data-output --recursive
          aws s3 rm s3://skippr-metadata-test --recursive
          aws glue delete-database --catalog-id 353855562591 --name bikehire || true
          aws glue delete-database --catalog-id 353855562591 --name deadletters || true

  publish_skipprd:
    if: startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/0.0.0' && !startsWith(github.ref, 'refs/tags/test')
    name: Publish skipprd Release
    needs:
      - chaos_mode_test
      - linux_x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASES_BUCKET: skippr-web-install
      SKIPPRD_RELEASE_SUBDIR: skipprd
      SKIPPRD_LATEST_POINTER: latest-skipprd.txt
    steps:
      - uses: actions/checkout@v4
      - name: Download skipprd artifacts
        uses: actions/download-artifact@v4
        with:
          name: skipprd-linux_x86
          path: skipprd-linux_x86
      - name: Compress skipprd release artifacts
        run: |
          set -euo pipefail
          tar -czvf skipprd-linux_x86.tar.gz skipprd-linux_x86/
      - name: Configure Cloudflare R2 credentials for skipprd release upload
        uses: ./.github/actions/configure-r2-releases
        with:
          account_id: ${{ secrets.R2_ACCOUNT_ID }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Upload skipprd binaries to install releases bucket
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          BUCKET="${{ env.RELEASES_BUCKET }}"
          RELEASE_SUBDIR="${{ env.SKIPPRD_RELEASE_SUBDIR }}"
          LATEST_POINTER="${{ env.SKIPPRD_LATEST_POINTER }}"
          aws s3 cp skipprd-linux_x86.tar.gz "s3://${BUCKET}/releases/${RELEASE_SUBDIR}/${TAG}/skipprd-linux_x86.tar.gz"
          printf '%s' "$TAG" > "$LATEST_POINTER"
          aws s3 cp "$LATEST_POINTER" "s3://${BUCKET}/releases/${LATEST_POINTER}" --cache-control "no-cache, no-store, must-revalidate"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo skipprd/skipprd >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo skipprd/skipprd \
              --title "Release $TAG" \
              --notes-file CHANGELOG.txt
          else
            gh release create "$TAG" \
              --repo skipprd/skipprd \
              --title "Release $TAG" \
              --notes-file CHANGELOG.txt
          fi
          gh release upload "$TAG" \
            install.sh \
            skipprd-linux_x86.tar.gz \
            --repo skipprd/skipprd \
            --clobber

  # Disabled for now: Darwin / macOS arm64, Windows, extra e2e.
  # linux x86 on GitHub-hosted ubuntu-latest is the only Rust build/test/chaos/publish lane.
  # macos_arm64:
  #   name: cargo build (macos arm64)
  #   runs-on: macos-14
  # windows_x86:
  #   name: cargo build (windows x86)
  #   runs-on: windows-2022
