skippr:
  workspace: tpc
  skipprd_el_storage_mode: local
pipelines:
  lineitem:
    auto_approve: true
    env: test
    data_source: data_sources.lineitem
    data_sink: data_sinks.local
  orders:
    auto_approve: true
    env: test
    data_source: data_sources.orders
    data_sink: data_sinks.local
  customer:
    auto_approve: true
    env: test
    data_source: data_sources.customer
    data_sink: data_sinks.local
data_sources:
  lineitem:
    File:
      path: SOURCE_LINEITEM
      format: parquet
  orders:
    File:
      path: SOURCE_ORDERS
      format: parquet
  customer:
    File:
      path: SOURCE_CUSTOMER
      format: parquet
data_sinks:
  local:
    Duckdb:
      warehouse: WAREHOUSE_URI
      table_namespace: bronze
