skippr:
  workspace: test
  skipprd_el_storage_mode: local
  store:
    type: dynamodb
    name: skippr-chaos-catalog

pipelines:

  bike_hire_many:
    auto_approve: yes
    env: test
    buffer_threshold_bytes: 4000000000
    buffer_threshold_seconds: 7200
    transform:
      batch_order_fields: bike_id
    data_source: data_sources.s3_bike_hire
    data_sink: data_sinks.lake

data_sources:
  s3_bike_hire:
    S3:
      batch_size_bytes: 2048000
      s3_bucket: skippr-e2e-sample-data
      s3_prefix: bike-hire/
      endpoint_url: R2_S3_ENDPOINT_PLACEHOLDER
      region: auto

data_sinks:
  lake:
    SkipprLake:
      warehouse: LAKE_WAREHOUSE_PLACEHOLDER
      catalog_table: skippr-chaos-catalog
      region: us-east-1
      table_namespace: bronze
      object_store:
        type: file
    schema_sink: schema_sinks.lake_schema

schema_sinks:
  lake_schema:
    SkipprLake:
      warehouse: LAKE_WAREHOUSE_PLACEHOLDER
      catalog_table: skippr-chaos-catalog
      region: us-east-1
      table_namespace: bronze
      object_store:
        type: file
