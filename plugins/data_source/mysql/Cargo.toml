[package]
name = "skippr-plugin-data-source-mysql"
version = "0.1.4"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-mysql"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true

futures = "0.3.25"
mysql_async = { version = "0.34" }
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "Mysql"

[package.metadata.skippr-plugin.source_capability]
name = "Mysql"
guarantee_tier = "SnapshotThenLogExactOnce"
checkpoint_style = "LogNative"
bootstrap_style = "AnchoredSnapshot"
order_model = "GlobalTotalOrder"
supports_deletes = true
event_id_semantics = "LogPosition"
