name: Checkout react sibling
description: >-
  Provide ../react for path dependencies, cloning the react repo when possible
  and falling back to published react-cargo crates otherwise.
runs:
  using: composite
  steps:
    - name: Skip react checkout when sibling already exists
      id: probe
      shell: bash
      run: |
        set -euo pipefail
        react_dir="${GITHUB_WORKSPACE}/../react"
        if [ -f "${react_dir}/src/runtime/Cargo.toml" ]; then
          echo "react dependency already present at ${react_dir}"
          echo "present=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Checkout react repository
      id: checkout
      if: steps.probe.outputs.present != 'true'
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/react
        path: ../react
        token: ${{ env.REACT_REPO_CHECKOUT_TOKEN }}
    - name: Fall back to published react crates
      if: steps.probe.outputs.present != 'true' && steps.checkout.outcome == 'failure'
      shell: bash
      run: |
        set -euo pipefail
        python3 "${GITHUB_WORKSPACE}/.github/scripts/ci_use_react_registry_deps.py"
