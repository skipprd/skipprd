docker_push:
  image: docker:latest
  stage: publish
  script:
#    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
#    - docker tag $CONTAINER_IMAGE $CONTAINER_RELEASE_IMAGE
