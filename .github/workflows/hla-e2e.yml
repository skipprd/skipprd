name: HLA clustered e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/cluster/**"
      - "src/buffer/durable/**"
      - "src/buffer/ingest_buffer.rs"
      - "src/sqlrt/**"
      - "src/query_flight/**"
      - "crates/skippr-query-ballista/**"
      - "crates/skippr-lease/**"
      - "crates/skippr-lease-store-dynamodb/**"
      - "crates/skippr-offset-store-dynamodb/**"
      - "crates/skippr-iceberg-catalog/**"
      - "crates/skippr-tables-client/**"
      - "crates/skippr-store-cloud-tables/**"
      - "tests/hla_e2e/**"
      - ".github/scripts/check_host_dependency_boundaries.py"
      - ".github/workflows/hla-e2e.yml"

jobs:
  hla_e2e:
    name: three-process DynamoDB Local HLA
    runs-on:
      - depot-ubuntu-22.04-16
    env:
      CODEARTIFACT_AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      CODEARTIFACT_AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_REGION: auto
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_BUCKET: skippr-web-rust-cache
      SCCACHE_REGION: auto
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_S3_KEY_PREFIX: skipprd
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "false"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Prepare Rust builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Install Java and boto3
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jre-headless python3-boto3 python3-pip
          pip3 install --user pyarrow
      - name: Host dependency boundary
        shell: bash
        run: python3 .github/scripts/check_host_dependency_boundaries.py
      - name: HLA harness contract
        shell: bash
        run: python3 tests/hla_e2e/test_run.py
      - name: HLA DynamoDB Local CAS/OCC
        shell: bash
        run: python3 tests/hla_e2e/ddb_cas.py
      - name: HLA three-process e2e
        shell: bash
        run: python3 tests/hla_e2e/run.py
