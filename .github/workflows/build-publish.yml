          echo "manifest_dir=${manifest_dir}" >> "$GITHUB_OUTPUT"

      - name: Seed DynamoDB type and CDC source data
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/runtime_e2e_harness.py prepare-aws-state \
            --skip-dynamodb-purge \
            --scenario dynamodb_iceberg_types_cdc
          aws dynamodb create-table \
            --table-name skippr_iceberg_dynamodb_types_cdc \
            --attribute-definitions AttributeName=id,AttributeType=N \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --stream-specification StreamEnabled=true,StreamViewType=NEW_AND_OLD_IMAGES
          aws dynamodb wait table-exists --table-name skippr_iceberg_dynamodb_types_cdc
          aws dynamodb put-item --table-name skippr_iceberg_dynamodb_types_cdc --item '{"id":{"N":"1"},"bool_col":{"BOOL":true},"string_col":{"S":"initial"},"int_col":{"N":"10"},"long_col":{"N":"10000000000"},"decimal_col":{"N":"12.3400"},"json_col":{"M":{"shape":{"M":{"nested":{"BOOL":true}}},"items":{"L":[{"N":"1"},{"N":"2"}]}}},"nullable_col":{"NULL":true}}'
          aws dynamodb put-item --table-name skippr_iceberg_dynamodb_types_cdc --item '{"id":{"N":"2"},"bool_col":{"BOOL":false},"string_col":{"S":"delete-me"},"int_col":{"N":"20"},"long_col":{"N":"20000000000"},"decimal_col":{"N":"22.3400"},"json_col":{"M":{"op":{"S":"delete"}}},"nullable_col":{"S":"present"}}'
          aws dynamodb put-item --table-name skippr_iceberg_dynamodb_types_cdc --item '{"id":{"N":"3"},"bool_col":{"BOOL":true},"string_col":{"S":"insert"},"int_col":{"N":"30"},"long_col":{"N":"30000000000"},"decimal_col":{"N":"32.3400"},"json_col":{"M":{"op":{"S":"insert"}}},"nullable_col":{"S":"present"}}'
          aws dynamodb update-item --table-name skippr_iceberg_dynamodb_types_cdc --key '{"id":{"N":"1"}}' --update-expression 'SET string_col = :s, int_col = :i' --expression-attribute-values '{":s":{"S":"updated"},":i":{"N":"11"}}'
          aws dynamodb delete-item --table-name skippr_iceberg_dynamodb_types_cdc --key '{"id":{"N":"2"}}'
          aws dynamodb put-item --table-name skippr_iceberg_dynamodb_types_cdc --item '{"id":{"N":"4"},"bool_col":{"BOOL":false},"string_col":{"S":"late-insert"},"int_col":{"N":"40"},"long_col":{"N":"40000000000"},"decimal_col":{"N":"42.3400"},"json_col":{"M":{"op":{"S":"late_insert"}}},"nullable_col":{"S":"present"}}'

      - name: Run DynamoDB to Iceberg Glue Athena e2e
        shell: bash
        env:
          USE_LOCAL_PLUGIN_CODE: "1"
          SKIPPR_LOCAL_RUNTIME_PLUGIN_MANIFEST_DIR: ${{ steps.local_runtime.outputs.manifest_dir }}
        run: |
          python3 .github/scripts/runtime_e2e_harness.py run dynamodb_iceberg_types_cdc \
            --mode full \
            --skipprd target/debug/skipprd

