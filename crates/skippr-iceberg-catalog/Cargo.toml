[package]
name = "skippr-iceberg-catalog"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared Iceberg catalog configuration for skipprd and Iceberg plugins"

[dependencies]
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_derive.workspace = true
skippr-plugin-macros = { path = "../skippr-plugin-macros" }
iceberg = "0.9.1"
iceberg-storage-opendal = "0.9.1"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
