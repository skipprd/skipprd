  mssql_iceberg_debug_windows_test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.snowflake_e2e_only != true }}
    needs:
      - cleanup
      - purge_dynamodb
      - linux_test_suite
      - data_engineer_test_suite
    name: MSSQL to Iceberg debug (windows x86)
    runs-on: depot-windows-2022-16
    environment: Skippr
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DATA_DIR_MIN_FREE_BYTES: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
      VCPKGRS_NO_ZLIB: "1"
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: skipprd
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        if: env.SCCACHE_BUCKET != ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: Configure sccache
        if: env.SCCACHE_BUCKET != ''
        shell: pwsh
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $env:GITHUB_ENV
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> $env:GITHUB_ENV

      - name: Configure CodeArtifact Cargo access
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          token="$(aws codeartifact get-authorization-token \
            --domain skippr \
            --domain-owner 132355036174 \
            --region us-east-1 \
            --query authorizationToken \
            --output text)"
          echo "::add-mask::$token"
          echo "CARGO_REGISTRIES_REACT_CARGO_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install protoc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "23.4"
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$version-win64.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "protoc-$version"
          Invoke-WebRequest `
            -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $installDir -Force
          "$installDir\bin" >> $env:GITHUB_PATH
          & "$installDir\bin\protoc.exe" --version

      - name: Configure vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "x64-windows-static-md"
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=$triplet" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\$triplet" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\$triplet" >> $env:GITHUB_ENV
          vcpkg install curl:x64-windows-static-md openssl:x64-windows-static-md zlib:x64-windows-static-md

      - name: Install SQL Server on Windows runner
        uses: potatoqualitee/mssqlsuite@v1.12
        with:
          install: sqlengine, sqlclient
          sa-password: "Skippr!Test123"

      - name: Seed SQL Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sqlcmd = (Get-Command sqlcmd -ErrorAction Stop).Source
          & $sqlcmd -S localhost -U sa -P "Skippr!Test123" -C -Q "IF DB_ID('testdb') IS NOT NULL BEGIN ALTER DATABASE testdb SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE testdb; END; CREATE DATABASE testdb;"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create MSSQL test database" }
          & $sqlcmd -S localhost -U sa -P "Skippr!Test123" -C -d testdb -i ".\.github\actions\e2e\mssql_snowflake\seed.sql"
          if ($LASTEXITCODE -ne 0) { throw "Failed to seed MSSQL test database" }

      - name: Build skipprd and runtime plugins
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
        run: |
          cargo build `
            -p skipprd `
            -p skippr-plugin-data-source-mssql `
            -p skippr-plugin-data-sink-iceberg `
            -p skippr-plugin-schema-sink-iceberg

      - name: Stage local runtime manifests
        id: local_runtime
        shell: pwsh
        env:
          CARGO_TARGET_DIR: target
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
        run: |
          $manifestDir = python .github/scripts/local_runtime_plugins.py `
            --config .github/actions/e2e/mssql_iceberg_debug_windows/skippr.yml `
            --pipeline mssql_iceberg_debug_windows
          "manifest_dir=$manifestDir" >> $env:GITHUB_OUTPUT

      - name: Run MSSQL to Iceberg debug e2e
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
          SKIPPR_RUNTIME_LOG_LEVEL: debug
          USE_LOCAL_PLUGIN_CODE: "1"
          SKIPPR_LOCAL_RUNTIME_PLUGIN_MANIFEST_DIR: ${{ steps.local_runtime.outputs.manifest_dir }}
        run: |
          python .github/scripts/runtime_e2e_harness.py run mssql_iceberg_debug_windows `
            --mode full `
            --skipprd target/debug/skipprd.exe `
            --prepare-aws-state `
            --skip-dynamodb-purge

  publish_skipprd:
    name: Publish skipprd Release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/test') && (github.event_name != 'workflow_dispatch' || inputs.snowflake_e2e_only != true) }}
    needs:
      - bike_hire_test
      - chaos_mode_test
      - deadletters_test
      - published_runtime_plugins_smoke_test
      - linux_x86
      - macos_arm64
      - windows_x86
    runs-on: depot-ubuntu-22.04-16
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Download skipprd artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "skipprd-*"
      - name: Compress skipprd release artifacts
        run: |
          tar -czvf skipprd-linux_x86.tar.gz skipprd-linux_x86/
          tar -czvf skipprd-macos_arm64.tar.gz skipprd-macos_arm64/
          tar -czvf skipprd-windows_x86.tar.gz skipprd-windows_x86/
      - name: Configure AWS credentials for skipprd release upload
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Upload skipprd binaries to install releases bucket
        run: |
          TAG="${{ github.ref_name }}"
          BUCKET="${{ env.RELEASES_BUCKET }}"
          RELEASE_SUBDIR="${{ env.SKIPPRD_RELEASE_SUBDIR }}"
          LATEST_POINTER="${{ env.SKIPPRD_LATEST_POINTER }}"
          for f in skipprd-*.tar.gz; do
            aws s3 cp "$f" "s3://${BUCKET}/releases/${RELEASE_SUBDIR}/${TAG}/${f}"
          done
          printf '%s' "$TAG" > "$LATEST_POINTER"
          aws s3 cp "$LATEST_POINTER" "s3://${BUCKET}/releases/${LATEST_POINTER}" --cache-control "no-cache, no-store, must-revalidate"

  publish_skippr:
    name: Publish skippr Release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/test') && (github.event_name != 'workflow_dispatch' || inputs.snowflake_e2e_only != true) }}
    needs:
      - linux_x86
      - macos_arm64
      - windows_x86
      - skippr_cli_test_suite
      - data_engineer_test_suite
    runs-on: depot-ubuntu-22.04-16
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Download skippr artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "skippr-*"
      - name: Compress skippr release artifacts
        run: |
          tar -czvf skippr-linux_x86.tar.gz skippr-linux_x86/
          tar -czvf skippr-macos_arm64.tar.gz skippr-macos_arm64/
          tar -czvf skippr-windows_x86.tar.gz skippr-windows_x86/
      - name: Configure AWS credentials for skippr release upload
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Upload skippr binaries to install releases bucket
        run: |
          TAG="${{ github.ref_name }}"
          BUCKET="${{ env.RELEASES_BUCKET }}"
