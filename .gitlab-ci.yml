dockerize:
  tags: [ saas-linux-large-amd64 ]
  image: docker:latest
  stage: init
  before_script:
#    - rustup update && cargo update
    - mv Cargo.toml Cargo.toml.orig
    - sed "s/0\\.0\\.0-git/${CI_COMMIT_TAG##*\/v}/" Cargo.toml.orig > Cargo.toml
    - mv Cargo.lock Cargo.lock.orig
    - sed "s/0\\.0\\.0-git/${CI_COMMIT_TAG##*\/v}/" Cargo.lock.orig > Cargo.lock

  script:
    - docker pull $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE || true
    - docker build --cache-from $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE -t $CONTAINER_IMAGE -f Dockerfile .
#    - docker build -t $CONTAINER_IMAGE -f Dockerfile.mac_arm .
#    - docker build -t $CONTAINER_IMAGE -f Dockerfile.lambda .
  after_script:
    # Push to Docker Hub
    - docker login -u skippr -p "$DOCKER_HUB_PASS"
    - docker tag $CONTAINER_IMAGE $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE
    - docker push $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE
  artifacts:
    paths:
      - ~/cargo
  only:
    - master
    - tags

.e2e:
  image: docker:latest
  stage: e2e
  only:
    - master
    - tags


