name: Python CI/CD Pipeline
on:
  push:
    branches: [main]
    tags:
      - "[0-9]*"
      - "python-v*"
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skipprd
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skipprd/cloud
          path: cloud
          token: ${{ secrets.SKIPPR_CLOUD_CHECKOUT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: skipprd
      - name: Install Linux x86 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skipprd
      - run: cargo run -p skippr-connect-gen -- --check
      - run: cargo test -p skipprd --lib
      - run: python3 .github/scripts/test_python_bindings_ci.py
      - run: python3 .github/scripts/test_publish_runtime_plugins.py
      - run: ./scripts/test-python.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: skipprd/target/wheels/*.whl
          if-no-files-found: error
      - run: |
          cd docs
          npm install
          npx vitepress build
  python-publish:
    if: github.repository == 'skipprd/skipprd' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/python-v')) && github.ref != 'refs/tags/python-v0.0.0'
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: skipprd
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - id: pypi
        working-directory: skipprd
        run: python3 .github/scripts/python_wheel_version.py --skip-if-published
      - if: steps.pypi.outputs.needed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: false

