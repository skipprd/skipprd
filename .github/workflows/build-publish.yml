  publish_skippr:  # Skippr publish disabled
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/test')
    needs:
     - linux_x86_test
     - chaos_mode_test
     - s3_wal_test
    runs-on: ubuntu-latest
    steps:
     - name: Check out code
       uses: actions/checkout@v3
     - name: Download Artifacts
       uses: actions/download-artifact@v4
     - name: Compress Release Artifacts
       run: |
         tar -czvf skippr-linux_x86.tar.gz skippr-linux_x86/
     - name: Release builds to GitHub
       uses: softprops/action-gh-release@v1
       with:
         files: |
           install.sh
           ./skippr-linux_x86.tar.gz
         tag_name: ${{ github.ref_name }}
         body: ${{ github.event.head_commit.message }}
         body_path: CHANGELOG.txt
         draft: false
         prerelease: false
         name: Release ${{ github.ref_name }}
         token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
         repository: skipprd/skipprd
         fail_on_unmatched_files: true



