[package]
name = "skippr-plugin-data-source-mssql"
version = "0.1.4"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-mssql"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true

chrono = "0.4.44"
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["io", "io-util", "compat"], default-features = false }
tracing = "0.1"

[features]
mssql_integration = []

[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "Mssql"

[package.metadata.skippr-plugin.source_capability]
name = "Mssql"
guarantee_tier = "IncrementalOnly"
checkpoint_style = "None"
bootstrap_style = "FullScan"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "None"
