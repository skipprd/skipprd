  publish_skipprd:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/test')
    needs:
     - chaos_mode_test
     - s3_wal_test
     - deadletters_test
     - macos_arm64
     - macos_arm64_test_compile
     - windows_x86
     - windows_x86_test_compile
     - linux_test_suite
     - data_engineer_test_suite
     - skippr_cli_test_suite
     - skippr_admin_test_suite
    runs-on: ubuntu-latest
    steps:
     - name: Check out code
       uses: actions/checkout@v4
     - name: Download Artifacts
       uses: actions/download-artifact@v4
       with:
         pattern: "*"
     - name: Compress Release Artifacts
       run: |
         tar -czvf skipprd-linux_x86.tar.gz skipprd-linux_x86/
         tar -czvf skipprd-macos_arm64.tar.gz skipprd-macos_arm64/
         tar -czvf skipprd-windows_x86.tar.gz skipprd-windows_x86/
         tar -czvf skippr-linux_x86.tar.gz skippr-linux_x86/
         tar -czvf skippr-macos_arm64.tar.gz skippr-macos_arm64/
         tar -czvf skippr-windows_x86.tar.gz skippr-windows_x86/
         tar -czvf skippr-admin-linux_x86.tar.gz skippr-admin-linux_x86/
         tar -czvf skippr-admin-macos_arm64.tar.gz skippr-admin-macos_arm64/
         tar -czvf skippr-admin-windows_x86.tar.gz skippr-admin-windows_x86/
     - name: Create or update GitHub Release
       env:
         GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
       run: |
         TAG="${{ github.ref_name }}"
         # Create release if it doesn't exist; update body if it does
         if gh release view "$TAG" --repo skipprd/skipprd >/dev/null 2>&1; then
           gh release edit "$TAG" \
             --repo skipprd/skipprd \
             --title "Release $TAG" \
             --notes-file CHANGELOG.txt
         else
           gh release create "$TAG" \
             --repo skipprd/skipprd \
             --title "Release $TAG" \
             --notes-file CHANGELOG.txt
         fi
         # Upload assets — --clobber overwrites same-name files
         gh release upload "$TAG" \
           install.sh \
           skipprd-linux_x86.tar.gz \
           skipprd-macos_arm64.tar.gz \
           skipprd-windows_x86.tar.gz \
           skippr-linux_x86.tar.gz \
           skippr-macos_arm64.tar.gz \
           skippr-windows_x86.tar.gz \
           skippr-admin-linux_x86.tar.gz \
           skippr-admin-macos_arm64.tar.gz \
           skippr-admin-windows_x86.tar.gz \
           --repo skipprd/skipprd \
           --clobber
     - name: Configure AWS credentials for release upload
       uses: aws-actions/configure-aws-credentials@v4
       with:
         aws-access-key-id: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
         aws-region: us-east-1
     - name: Upload binaries to install releases bucket
       run: |
         TAG="${{ github.ref_name }}"
         BUCKET="${{ env.RELEASES_BUCKET }}"
         RELEASE_SUBDIR="${{ env.SKIPPRD_RELEASE_SUBDIR }}"
         LATEST_POINTER="${{ env.SKIPPRD_LATEST_POINTER }}"
         for f in skipprd-*.tar.gz; do
           aws s3 cp "$f" "s3://${BUCKET}/releases/${RELEASE_SUBDIR}/${TAG}/${f}"
         done
         printf '%s' "$TAG" > "$LATEST_POINTER"
         aws s3 cp "$LATEST_POINTER" "s3://${BUCKET}/releases/${LATEST_POINTER}" --cache-control "no-cache, no-store, must-revalidate"
         for f in skippr-linux_x86.tar.gz skippr-macos_arm64.tar.gz skippr-windows_x86.tar.gz; do
           aws s3 cp "$f" "s3://${BUCKET}/releases/${{ env.SKIPPR_RELEASE_SUBDIR }}/${TAG}/${f}"
         done
         printf '%s' "$TAG" > "${{ env.SKIPPR_LATEST_POINTER }}"
         aws s3 cp "${{ env.SKIPPR_LATEST_POINTER }}" "s3://${BUCKET}/releases/${{ env.SKIPPR_LATEST_POINTER }}" --cache-control "no-cache, no-store, must-revalidate"
         for f in skippr-admin-linux_x86.tar.gz skippr-admin-macos_arm64.tar.gz skippr-admin-windows_x86.tar.gz; do
           aws s3 cp "$f" "s3://${BUCKET}/releases/${{ env.SKIPPR_ADMIN_RELEASE_SUBDIR }}/${TAG}/${f}"
         done
         printf '%s' "$TAG" > "${{ env.SKIPPR_ADMIN_LATEST_POINTER }}"
         aws s3 cp "${{ env.SKIPPR_ADMIN_LATEST_POINTER }}" "s3://${BUCKET}/releases/${{ env.SKIPPR_ADMIN_LATEST_POINTER }}" --cache-control "no-cache, no-store, must-revalidate"



