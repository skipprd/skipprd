[package]
name = "react-suites"
version = "0.0.0-git"
edition = "2021"

[dependencies]
async-trait = "0.1.77"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.85"
tokio = { version = "1", features = ["full"] }
chrono = "=0.4.42"
walkdir = { version = "2.3.2", features = [] }
serde_yaml = "0.9.16"
sha2 = "0.10"
tempfile = "3.10"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

react-core = { path = "../react-core" }
diffy = "0.4.2"
hex = "0.4.3"
