    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: skippr-el-${{ inputs.architecture_name }}
        path: skippr-el-${{ inputs.architecture_name }}
        retention-days: 30
    - name: Upload Runtime Plugin Binaries Artifact
      uses: actions/upload-artifact@v4
      with:
        name: runtime-plugin-binaries-${{ inputs.architecture_name }}
        path: runtime-plugin-binaries-${{ inputs.architecture_name }}
        retention-days: 30