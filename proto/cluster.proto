syntax = "proto3";
package skippr.cluster.v1;

message PipelineKey {
  string tenant = 1;
  string workspace = 2;
  string pipeline = 3;
}

message ClientHello {
  string cluster_hash = 1;
  string node_id = 2;
  uint32 protocol_min = 3;
  uint32 protocol_max = 4;
  reserved 5, 6, 7;
}

message ServerHello {
  string cluster_hash = 1;
  string node_id = 2;
  uint32 protocol = 3;
}

message ReplicaStatus {
  uint64 epoch_seen = 1;
  uint64 catalog_seq_seen = 2;
  bool payload_ready = 3;
  PipelineKey pipeline = 4;
}

message ReplicatePayload {
  string segment_id = 1;
  bytes sha256 = 2;
  uint64 len = 3;
  uint64 epoch = 4;
  PipelineKey pipeline = 5;
}

message ReplicaAck {
  string segment_id = 1;
  bytes sha256 = 2;
}

enum ReplicaNackCode {
  REPLICA_NACK_CODE_UNSPECIFIED = 0;
  REPLICA_NACK_CODE_STALE_EPOCH = 1;
  REPLICA_NACK_CODE_NOT_ASSIGNED = 2;
  REPLICA_NACK_CODE_NOT_CAUGHT_UP = 3;
  reserved 4;
  REPLICA_NACK_CODE_DISK_FULL = 5;
  REPLICA_NACK_CODE_PAYLOAD_HASH_MISMATCH = 6;
  REPLICA_NACK_CODE_UNKNOWN_PIPELINE = 7;
  REPLICA_NACK_CODE_INVALID_PRIMARY_ENDPOINT = 8;
}

message ReplicaNack {
  ReplicaNackCode code = 1;
}

message AssignReplica {
  PipelineKey pipeline = 1;
  uint64 epoch = 2;
  string primary_node = 3;
  string primary_endpoint = 4;
}

message DropReplica {
  PipelineKey pipeline = 1;
}

message DropPayload {
  string segment_id = 1;
  uint64 epoch = 2;
  PipelineKey pipeline = 3;
}

message PruneTo {
  repeated string live_segment_ids = 1;
  uint64 epoch = 2;
  PipelineKey pipeline = 3;
}

message FetchPayload {
  string segment_id = 1;
  PipelineKey pipeline = 2;
}

message FetchPayloadResponse {
  string segment_id = 1;
  bytes sha256 = 2;
  uint64 len = 3;
}

message ControlFrame {
  oneof msg {
    ClientHello hello = 1;
    ServerHello hello_ok = 2;
    ReplicaStatus status_ok = 3;
    ReplicatePayload replicate = 4;
    ReplicaAck ack = 5;
    ReplicaNack nack = 6;
    AssignReplica assign = 7;
    DropReplica drop = 8;
    ReplicaStatus status = 9;
    DropPayload drop_payload = 10;
    PruneTo prune_to = 11;
    FetchPayload fetch_payload = 12;
    FetchPayloadResponse fetch_payload_ok = 13;
  }
}
