version: 1

server:
  port: 8787

storage:
  bucket: asgsdag-datalake

scope:
  tenant: picnic
  workspace: dev
  project_id: example
  # project_id: test

llm:
  # Keep secrets (api keys) in env via EnvSecretsProvider (e.g. LLM_API_KEY).
  provider: OPENAI_COMPAT
  base_url: https://api.openai.com
  chat_model: gpt-5.1
  embed_model: text-embedding-3-small
  context_length: 8192
  http_timeout_secs: 120
  max_tokens: 8192
  temperature: 0.2
  top_p: 1.0

providers:
  athena:
    enabled: true
    workgroup: picnic
    # Region matters for Athena WorkGroups; ensure dbt uses the same region as your WorkGroup.
    region: eu-west-1
    # Athena Data Catalog (Glue) that contains your schemas (databases).
    # This maps to dbt-athena profile key: `database: AwsDataCatalog`.
    target_catalog: AwsDataCatalog

    # Bronze/raw schema (Glue database) for discovery + dbt sources.
    # This maps to dbt-athena profile key: `schema:` when reading raw sources via `source()`.
    source_schema: test_raw
    # source_schema: picnic

    # NOTE: silver/gold are configured via DBT suffix naming below (recommended).
    result_s3: s3://asgsdag-datalake/
    discovery_cache_ttl_secs: 120
    # Max in-flight Athena queries (soft limit is often ~20; keep a buffer).
    max_concurrency: 15

  catalog:
    enabled: true
    refresh_secs: 10800 # 3 hours
    max_concurrency: 8

  dbt:
    enabled: true
    # Run dbt on the host (e.g. local venv), not via Docker.
    runner: host
    target: athena

    # Naming strategy (portable across warehouses):
    # dbt will materialize into: <target_schema>_<tier_suffix>
    # This avoids accidental doubled schemas like `test_warehouse_test_warehouse`.
    naming:
      # Base schema name (dbt target.schema). Example: `test`
      # target_schema: example
      # target_schema: test
      # Tier suffixes. Example schemas: `silver`, `warehouse|gold`
      silver_suffix: silver
      gold_suffix: gold

    # ---- Future warehouse examples (commented) ----
    #
    # BigQuery (dbt-bigquery):
    # providers:
    #   bigquery:
    #     enabled: true
    #     # Container above schema: GCP project (maps to dbt profile `database:`)
    #     target_project: my-gcp-project
    #     # Bronze/raw dataset (maps to dbt `schema:` when reading sources)
    #     source_schema: raw
    #     location: EU
    #
    # Snowflake (dbt-snowflake):
    # providers:
    #   snowflake:
    #     enabled: true
    #     # Container above schema: Snowflake database (maps to dbt profile `database:`)
    #     target_database: ANALYTICS
    #     # Bronze/raw schema (maps to dbt `schema:` when reading sources)
    #     source_schema: RAW
    #     warehouse: COMPUTE_WH
    #     role: ANALYST
    #
    # Postgres (dbt-postgres):
    # providers:
    #   postgres:
    #     enabled: true
    #     # Container above schema: Postgres database name (maps to dbt profile `dbname:`)
    #     target_database: analytics
    #     # Bronze/raw schema (maps to dbt `schema:` when reading sources)
    #     source_schema: raw

  vector:
    enabled: true
