[package]
name = "skippr-plugin-data-source-delta-lake"
version = "0.1.7"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-delta-lake"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true

arrow.workspace = true
deltalake = { version = "=0.32.3", features = ["datafusion"] }
futures = "0.3.25"
serde.workspace = true
serde_derive = "1.0.105"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "DeltaLake"

[package.metadata.skippr-plugin.source_capability]
name = "DeltaLake"
guarantee_tier = "SnapshotThenLogExactOnce"
checkpoint_style = "LogNative"
bootstrap_style = "AnchoredSnapshot"
order_model = "GlobalTotalOrder"
supports_deletes = true
event_id_semantics = "LogPosition"
