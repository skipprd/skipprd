openapi: 3.1.0
info:
  title: ReAct WebSocket API
  version: 0.3.0
  description: |
    WebSocket-based chat threads for the ReAct server. Clients send JSON frames and receive JSON frames.
    Supported client message types: list, suites, new, open, user, approve, reject, history, seen, delete, resume.
    Server message types: list, suites, thread_assigned, processing, token, trace, final, review, await_user, await_approval, unread, ok, error, history.

servers:
  - url: ws://{host}:{port}/
    description: WebSocket endpoint
    variables:
      host:
        default: localhost
      port:
        default: "8787"

# No security (for now)
security: []

tags:
  - name: websocket
    description: WebSocket handshake and message contracts

paths:
  "/":
    get:
      tags: [websocket]
      summary: WebSocket handshake (Upgrade)
      description: |
        Connect via WebSocket and exchange JSON messages.
        Frames must conform to the schemas under components/schemas.
      x-websocket: true
      responses:
        "101":
          description: Switching Protocols to WebSocket
        "400":
          description: Bad Request

components:
  schemas:
    # Discriminated unions for client->server and server->client messages
    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/ListRequest'
        - $ref: '#/components/schemas/SuitesRequest'
        - $ref: '#/components/schemas/NewRequest'
        - $ref: '#/components/schemas/OpenRequest'
        - $ref: '#/components/schemas/UserRequest'
        - $ref: '#/components/schemas/ResumeRequest'
        - $ref: '#/components/schemas/HistoryRequest'
        - $ref: '#/components/schemas/SeenRequest'
        - $ref: '#/components/schemas/PlanRequest'
        - $ref: '#/components/schemas/DeleteRequest'
        - $ref: '#/components/schemas/ApproveRequest'
        - $ref: '#/components/schemas/RejectRequest'
      discriminator:
        propertyName: type
        mapping:
          list: '#/components/schemas/ListRequest'
          suites: '#/components/schemas/SuitesRequest'
          new: '#/components/schemas/NewRequest'
          open: '#/components/schemas/OpenRequest'
          user: '#/components/schemas/UserRequest'
          resume: '#/components/schemas/ResumeRequest'
          history: '#/components/schemas/HistoryRequest'
          seen: '#/components/schemas/SeenRequest'
          plan: '#/components/schemas/PlanRequest'
          delete: '#/components/schemas/DeleteRequest'
          approve: '#/components/schemas/ApproveRequest'
          reject: '#/components/schemas/RejectRequest'

    ServerMessage:
      oneOf:
        - $ref: '#/components/schemas/ListResponse'
        - $ref: '#/components/schemas/SuitesResponse'
        - $ref: '#/components/schemas/FinalResponse'
        - $ref: '#/components/schemas/ReviewResponse'
        - $ref: '#/components/schemas/TraceResponse'
        - $ref: '#/components/schemas/SuiteProgressResponse'
        - $ref: '#/components/schemas/PlanResponse'
        - $ref: '#/components/schemas/PlanUpdateResponse'
        - $ref: '#/components/schemas/AwaitUserResponse'
        - $ref: '#/components/schemas/AwaitApprovalResponse'
        - $ref: '#/components/schemas/OkResponse'
        - $ref: '#/components/schemas/ErrorResponse'
        - $ref: '#/components/schemas/ThreadAssignedResponse'
        - $ref: '#/components/schemas/ProcessingResponse'
        - $ref: '#/components/schemas/TokenResponse'
        - $ref: '#/components/schemas/HistoryResponse'
        - $ref: '#/components/schemas/UnreadResponse'
      discriminator:
        propertyName: type
        mapping:
          list: '#/components/schemas/ListResponse'
          suites: '#/components/schemas/SuitesResponse'
          final: '#/components/schemas/FinalResponse'
          review: '#/components/schemas/ReviewResponse'
          trace: '#/components/schemas/TraceResponse'
          suite_progress: '#/components/schemas/SuiteProgressResponse'
          plan: '#/components/schemas/PlanResponse'
          plan_update: '#/components/schemas/PlanUpdateResponse'
          await_user: '#/components/schemas/AwaitUserResponse'
          await_approval: '#/components/schemas/AwaitApprovalResponse'
          ok: '#/components/schemas/OkResponse'
          error: '#/components/schemas/ErrorResponse'
          thread_assigned: '#/components/schemas/ThreadAssignedResponse'
          processing: '#/components/schemas/ProcessingResponse'
          token: '#/components/schemas/TokenResponse'
          history: '#/components/schemas/HistoryResponse'
          unread: '#/components/schemas/UnreadResponse'

    # Client -> Server
    ListRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid]
      properties:
        v:
          type: integer
        type:
          type: string
          enum: [list]
        cid:
          type: string
          description: Client correlation id (UUID)

    SuitesRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid]
      properties:
        v: { type: integer }
        type: { type: string, enum: [suites] }
        cid:
          type: string
          description: Client correlation id (UUID)

    NewRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, question, suiteId, agentType]
      properties:
        v:
          type: integer
        cid:
          type: string
        type:
          type: string
          enum: [new]
        question:
          type: string
          description: User's question to start a new thread
        suiteId:
          type: string
          description: Suite id to use (e.g. data_engineer | kb)
        agentType:
          type: string
          description: Agent/mode to use (ask | cleanse | model | kb | agent | review). Required.
          enum: [ask, cleanse, model, kb, agent, review]
        trace:
          type: boolean
          nullable: true
          description: If true, stream `TraceResponse` frames while the agent runs. Each trace frame includes `text` plus a coarse `status` (pending|running|ok|failed). If omitted, the server inherits the last-known trace setting for the thread/connection.

    OpenRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id, suiteId, agentType]
      properties:
        v:
          type: integer
        cid:
          type: string
        type:
          type: string
          enum: [open]
        thread_id:
          type: string
          description: Existing thread id returned by a previous interaction
        question:
          type: string
          description: Optional nudge to resume the thread (default is "Continue.")
        suiteId:
          type: string
          description: Suite id to use (e.g. data_engineer | kb)
        agentType:
          type: string
          description: Agent to use for this message; if differs from current, a switch_agent step is recorded.
          enum: [ask, cleanse, model, kb, agent, review]
        trace:
          type: boolean
          nullable: true
          description: If true, stream `TraceResponse` frames while the agent runs. Each trace frame includes `text` plus a coarse `status` (pending|running|ok|failed). If omitted, the server inherits the last-known trace setting for the thread/connection.

    UserRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id, text]
      properties:
        v:
          type: integer
        cid:
          type: string
        type:
          type: string
          enum: [user]
        thread_id:
          type: string
        text:
          type: string
          description: User-provided content in response to an `await_user` prompt
        trace:
          type: boolean
          nullable: true
          description: If true, stream `TraceResponse` frames while the agent runs. Each trace frame includes `text` plus a coarse `status` (pending|running|ok|failed). If omitted, the server inherits the last-known trace setting for the thread/connection.

    ResumeRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, after_seq]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [resume] }
        after_seq: { type: integer }

    HistoryRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [history] }
        thread_id: { type: string }
        before_thread_seq: { type: integer, nullable: true }
        limit: { type: integer, nullable: true, default: 50 }

    SeenRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id, up_to_thread_seq]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [seen] }
        thread_id: { type: string }
        up_to_thread_seq: { type: integer }

    PlanRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [plan] }
        thread_id: { type: string }

    DeleteRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [delete] }
        thread_id: { type: string }
      description: Delete a thread (removes thread JSON and any thread-scoped embeddings)

    ApproveRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [approve] }
        thread_id: { type: string }

    RejectRequest:
      type: object
      additionalProperties: false
      required: [v, type, cid, thread_id]
      properties:
        v: { type: integer }
        cid: { type: string }
        type: { type: string, enum: [reject] }
        thread_id: { type: string }

    # Server -> Client
    ListResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, threads]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [list]
        server_time: { type: string }
        seq: { type: integer }
        threads:
          type: array
          description: List of existing threads with summaries
          items:
            type: object
            required: [thread_id]
            properties:
              thread_id: { type: string }
              title: { type: string, nullable: true }
              last_activity: { type: string, nullable: true }
              unread_count: { type: integer, nullable: true }
              last_message_preview: { type: string, nullable: true }
              suiteId:
                type: string
                nullable: true
                description: Current suite for the thread (derived from thread history)
              agentType:
                type: string
                nullable: true
                description: Current agent/mode for the thread (derived from thread history)

    SuitesResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, suites]
      properties:
        v: { type: integer }
        type: { type: string, enum: [suites] }
        server_time: { type: string }
        seq: { type: integer }
        suites:
          type: array
          description: Available suites and their allowed agent modes.
          items:
            type: object
            additionalProperties: false
            required: [suiteId, allowedAgentTypes]
            properties:
              suiteId: { type: string }
              label: { type: string, nullable: true }
              allowedAgentTypes:
                type: array
                items:
                  type: string
                  description: Agent/mode identifier (dynamic)
              defaultAgentType:
                type: string
                nullable: true
        defaultSuiteId:
          type: string
          nullable: true

    FinalResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, thread_seq, result]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [final]
        server_time: { type: string }
        seq: { type: integer }
        thread_id:
          type: string
        thread_seq:
          type: integer
        result:
          $ref: '#/components/schemas/FinalResult'

    # Typed result union for `final` frames.
    #
    # Notes:
    # - `sql` is NOT a generic field; it is Ask-mode-specific and lives inside `payload.sql`.
    # - `kind` is stable and drives client decoding; `payload` is strict per kind.
    FinalResult:
      oneOf:
        - $ref: '#/components/schemas/AskFinalResult'
        - $ref: '#/components/schemas/KbFinalResult'
        - $ref: '#/components/schemas/GenericFinalResult'
      discriminator:
        propertyName: kind
        mapping:
          ask: '#/components/schemas/AskFinalResult'
          kb: '#/components/schemas/KbFinalResult'
          generic: '#/components/schemas/GenericFinalResult'

    AskFinalResult:
      type: object
      additionalProperties: false
      required: [kind, payload]
      properties:
        kind: { type: string, enum: [ask] }
        payload:
          $ref: '#/components/schemas/AskFinalPayload'

    AskFinalPayload:
      type: object
      additionalProperties: false
      required: [answer, sql]
      properties:
        answer:
          type: string
          description: Plain-text concise answer.
        sql:
          type: string
          description: SQL used/generated by Ask mode to produce the answer.
        data:
          description: Optional tabular data from the last successful run_sql
          type: object
          additionalProperties: false
          required: [header, rows]
          properties:
            header:
              type: array
              items: { type: string }
            rows:
              type: array
              items:
                type: array
                items: { type: string }
        chart:
          description: Optional chart suggestion derived from data shape
          type: object
          additionalProperties: false
          required: [type, x, y]
          properties:
            type:
              type: string
              enum: [line, bar, area]
            x:
              type: string
            y:
              type: array
              items: { type: string }

    KbFinalResult:
      type: object
      additionalProperties: false
      required: [kind, payload]
      properties:
        kind: { type: string, enum: [kb] }
        payload:
          $ref: '#/components/schemas/KbFinalPayload'

    KbFinalPayload:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer:
          type: string
          description: Plain-text concise answer.

    # Temporary catch-all while suites are migrated to typed finals.
    # This should shrink over time as each suite adds explicit payload schemas.
    GenericFinalResult:
      type: object
      additionalProperties: false
      required: [kind, payload]
      properties:
        kind: { type: string, enum: [generic] }
        payload:
          $ref: '#/components/schemas/GenericFinalPayload'

    GenericFinalPayload:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: Human-readable final text for non-Ask suites during migration.

    ReviewResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, thread_seq, text]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [review]
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer }
        text:
          type: string
          description: Read-only reviewer output (red team)
        meta:
          type: object
          nullable: true
          additionalProperties: true

    TraceResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, status, text]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [trace]
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        status:
          $ref: '#/components/schemas/TraceStatus'
        text:
          type: string
          description: Lightweight trace line (tool call / observation), suitable for UI streaming. No prompts or hidden reasoning.

    TraceStatus:
      type: string
      enum: [pending, running, ok, failed]

    SuiteProgressResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, suiteId, phases, completed, current]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [suite_progress]
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        suiteId:
          type: string
          description: Suite id currently running (e.g. data_engineer)
        phases:
          type: array
          items: { type: string }
          description: |
            Ordered list of phases for the current suite (best-effort).

            For `data_engineer`, phases include plan phases:
            - preflight
            - cleanse_plan
            - cleanse_author
            - cleanse_validate
            - cleanse_review
            - model_plan
            - model_author
            - model_validate
            - model_review
            - publish_await_approval
            - publish
            - post_publish_review
            - done
        completed:
          type: array
          items: { type: string }
          description: Phases considered complete (best-effort)
        current:
          type: string
          description: Current phase name (for `data_engineer`, see `phases` list for known values including plan phases)

    PlanResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, plan]
      properties:
        v: { type: integer }
        type: { type: string, enum: [plan] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        plan:
          $ref: '#/components/schemas/PlanSnapshot'

    PlanUpdateResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, plan, changes]
      properties:
        v: { type: integer }
        type: { type: string, enum: [plan_update] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        plan:
          $ref: '#/components/schemas/PlanSnapshot'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/PlanChange'

    PlanSnapshot:
      type: object
      additionalProperties: false
      required: [planKind, planKey, status, tasks]
      properties:
        planKind:
          type: string
          enum: [cleanse, model]
        planKey:
          type: string
        status:
          $ref: '#/components/schemas/PlanStatus'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/PlanTask'
        projectSnapshot:
          type: object
          additionalProperties: true
          description: |
            Optional, suite-owned snapshot payload for UI/debugging (e.g. batched review notes).
            This is an opaque JSON object; clients must treat it as best-effort and forward-compatible.

    PlanStatus:
      type: string
      enum: [draft, approved, completed, cancelled]

    PlanTaskStatus:
      type: string
      enum: [pending, in_progress, done, blocked, needs_update]

    PlanTask:
      oneOf:
        - $ref: '#/components/schemas/CleanseTaskSnapshot'
        - $ref: '#/components/schemas/ModelTaskSnapshot'
      discriminator:
        propertyName: taskKind
        mapping:
          cleanse: '#/components/schemas/CleanseTaskSnapshot'
          model: '#/components/schemas/ModelTaskSnapshot'

    CleanseTaskSnapshot:
      type: object
      additionalProperties: false
      required: [taskId, dataset_id, status]
      properties:
        taskId: { type: string }
        dataset_id: { type: string }
        expected_model_path: { type: string, nullable: true }
        invariants:
          type: array
          items: { type: string }
        status:
          $ref: '#/components/schemas/PlanTaskStatus'
        notes:
          type: array
          items: { type: string }

    ModelTaskSnapshot:
      type: object
      additionalProperties: false
      required: [taskId, name, status]
      properties:
        taskId: { type: string }
        name: { type: string }
        folder: { type: string, nullable: true }
        goal: { type: string, nullable: true }
        inputs:
          type: array
          items: { type: string }
        expected_model_path: { type: string, nullable: true }
        invariants:
          type: array
          items: { type: string }
        status:
          $ref: '#/components/schemas/PlanTaskStatus'
        notes:
          type: array
          items: { type: string }

    PlanChange:
      oneOf:
        - $ref: '#/components/schemas/PlanStatusChangedChange'
        - $ref: '#/components/schemas/TaskStatusChangedChange'
        - $ref: '#/components/schemas/TaskNoteAddedChange'
        - $ref: '#/components/schemas/TaskErrorChange'
      discriminator:
        propertyName: kind
        mapping:
          plan_status_changed: '#/components/schemas/PlanStatusChangedChange'
          task_status_changed: '#/components/schemas/TaskStatusChangedChange'
          task_note_added: '#/components/schemas/TaskNoteAddedChange'
          task_error: '#/components/schemas/TaskErrorChange'

    PlanStatusChangedChange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { $ref: '#/components/schemas/PlanStatus' }
        to: { $ref: '#/components/schemas/PlanStatus' }

    TaskStatusChangedChange:
      type: object
      additionalProperties: false
      required: [taskId, from, to]
      properties:
        taskId: { type: string }
        from: { $ref: '#/components/schemas/PlanTaskStatus' }
        to: { $ref: '#/components/schemas/PlanTaskStatus' }

    TaskNoteAddedChange:
      type: object
      additionalProperties: false
      required: [taskId, note]
      properties:
        taskId: { type: string }
        note: { type: string }

    TaskErrorChange:
      type: object
      additionalProperties: false
      required: [taskId, error]
      properties:
        taskId: { type: string }
        error: { type: string }

    AwaitUserResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, thread_seq, prompt]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [await_user]
        server_time: { type: string }
        seq: { type: integer }
        thread_id:
          type: string
        thread_seq:
          type: integer
        prompt:
          type: string
          description: Question the agent asks the user to proceed
    AwaitApprovalResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, thread_seq, prompt]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [await_approval]
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer }
        prompt:
          type: string
          description: Approval request message; clients should present Approve/Reject controls

    OkResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [ok]
        server_time: { type: string }
        cid: { type: string, nullable: true }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, error]
      properties:
        v: { type: integer }
        type:
          type: string
          enum: [error]
        server_time: { type: string }
        error:
          type: string
        code: { type: string, description: One of rate_limited, invalid_request, not_found, thread_closed, internal }
        cid: { type: string, nullable: true }
        retry_after_ms: { type: integer, nullable: true }

    ThreadAssignedResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, cid, thread_id]
      properties:
        v: { type: integer }
        type: { type: string, enum: [thread_assigned] }
        server_time: { type: string }
        seq: { type: integer }
        cid: { type: string }
        thread_id: { type: string }

    ProcessingResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id]
      properties:
        v: { type: integer }
        type: { type: string, enum: [processing] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        stage: { type: string, enum: [queued, processing, complete, error], nullable: true }
        progress: { type: number, minimum: 0, maximum: 1, nullable: true }
        step:
          type: string
          enum: [run_sql, sql_schema, sql_stats, sql_sample, vect_query]
          nullable: true

    TokenResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, delta]
      properties:
        v: { type: integer }
        type: { type: string, enum: [token] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
        thread_seq: { type: integer, nullable: true }
        for_cid: { type: string, nullable: true }
        delta: { type: string }
        finish_reason: { type: string, enum: [stop, length, error], nullable: true }

    HistoryResponse:
      type: object
      additionalProperties: false
      required: [v, type, server_time, seq, thread_id, messages]
      properties:
        v: { type: integer }
        type: { type: string, enum: [history] }
        server_time: { type: string }
        seq: { type: integer }
        thread_id: { type: string }
