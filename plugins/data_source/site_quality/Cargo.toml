[package]
name = "skippr-plugin-data-source-site-quality"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-site-quality"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1.10"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
sha2 = "0.10"
skippr-plugin-data-source-seo-crawl = { path = "../seo_crawl" }
skippr-runtime-sdk.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "SiteQuality"

[package.metadata.skippr-plugin.source_capability]
name = "SiteQuality"
guarantee_tier = "IncrementalOnly"
checkpoint_style = "CursorBased"
bootstrap_style = "FullScan"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "None"
declares_namespace_contracts = true
