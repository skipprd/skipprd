name: MSSQL to Snowflake E2E
inputs:
  architecture_name:
    description: 'Artifact architecture name, e.g. linux_x86'
    required: true
runs:
  using: "composite"
  steps:
    - name: Run MSSQL to Snowflake via skippr
      shell: bash
      run: |
        set -euo pipefail

        required_env=(
          SKIPPR_API_KEY
          SNOWFLAKE_ACCOUNT
          SNOWFLAKE_USER
          SNOWFLAKE_PRIVATE_KEY_PEM
          SNOWFLAKE_WAREHOUSE
          SNOWFLAKE_DATABASE
          SNOWFLAKE_SCHEMA
        )
        for key in "${required_env[@]}"; do
          if [ -z "${!key:-}" ]; then
            echo "::error::Required environment variable ${key} is not set"
            exit 1
          fi
        done

        skippr_bin="./skippr-${{ inputs.architecture_name }}/skippr"
        skipprd_bin="./skipprd-${{ inputs.architecture_name }}/skipprd"
        chmod +x "$skippr_bin" "$skipprd_bin"
        export PATH="$(pwd)/skipprd-${{ inputs.architecture_name }}:$(pwd)/skippr-${{ inputs.architecture_name }}:$PATH"

        workdir="$(mktemp -d)"
        cleanup() {
          docker compose -f test/el-integration/docker-compose.yml down -v 2>/dev/null || true
          rm -rf "$workdir"
        }
        trap cleanup EXIT

        echo "Writing Snowflake private key"
        python3 - <<'PY' > "$workdir/snowflake_key.p8"
        import os
        pem = os.environ["SNOWFLAKE_PRIVATE_KEY_PEM"]
        if "\\n" in pem and "\n" not in pem:
            pem = pem.replace("\\n", "\n")
        print(pem.rstrip())
        PY
        chmod 600 "$workdir/snowflake_key.p8"
        export SNOWFLAKE_PRIVATE_KEY_PATH="$workdir/snowflake_key.p8"

        echo "Starting MSSQL seed services"
        docker compose -f test/el-integration/docker-compose.yml up -d
        for i in $(seq 1 120); do
          seed_status="$(docker compose -f test/el-integration/docker-compose.yml ps --format json seed 2>/dev/null || echo "")"
          if echo "$seed_status" | grep -q '"exited"' 2>/dev/null; then
            seed_exit="$(docker compose -f test/el-integration/docker-compose.yml ps -a --format json seed 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ExitCode', d.get('exit_code', -1)) if isinstance(d,dict) else d[0].get('ExitCode', d[0].get('exit_code', -1)))" 2>/dev/null || echo "-1")"
            if [ "$seed_exit" = "0" ]; then
              echo "MSSQL seed completed"
              break
            fi
            echo "::error::MSSQL seed failed with exit code ${seed_exit}"
            docker compose -f test/el-integration/docker-compose.yml logs
            exit 1
          fi
          if [ "$i" -eq 120 ]; then
            echo "::error::Timed out waiting for MSSQL seed"
            docker compose -f test/el-integration/docker-compose.yml logs
            exit 1
          fi
          sleep 3
        done

        export MSSQL_CONNECTION_STRING="server=tcp:127.0.0.1,1433;database=testdb;user id=sa;password=Skippr!Test123;TrustServerCertificate=true"
        project_name="mssql_snowflake_e2e_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-1}"
        cat > "$workdir/skippr.yaml" <<EOF
        project: ${project_name}
        warehouse:
          kind: snowflake
          database: \${SNOWFLAKE_DATABASE}
          schema: \${SNOWFLAKE_SCHEMA}
          warehouse: \${SNOWFLAKE_WAREHOUSE}
        source:
          kind: mssql
          connection_string: \${MSSQL_CONNECTION_STRING}
        dbt:
          target_schema: ${project_name}
          silver_suffix: silver
          gold_suffix: gold
        schema_sink: null
        EOF
        if [ -n "${SNOWFLAKE_ROLE:-}" ]; then
          python3 - "$workdir/skippr.yaml" <<'PY'
        import sys
        path = sys.argv[1]
        text = open(path, encoding="utf-8").read()
        text = text.replace(
            "          warehouse: ${SNOWFLAKE_WAREHOUSE}\n",
            "          warehouse: ${SNOWFLAKE_WAREHOUSE}\n          role: ${SNOWFLAKE_ROLE}\n",
        )
        open(path, "w", encoding="utf-8").write(text)
        PY
        fi

        echo "Running skippr doctor"
        "$skippr_bin" --config "$workdir/skippr.yaml" doctor

        echo "Running skippr MSSQL to Snowflake e2e"
        set +e
        "$skippr_bin" --config "$workdir/skippr.yaml" run --log trace 2>&1 | tee "$workdir/skippr-run.log"
        status="${PIPESTATUS[0]}"
        set -e
        if [ "$status" -ne 0 ]; then
          echo "::error::skippr run failed with exit code ${status}"
          exit "$status"
        fi
        if ! grep -q '^Done\.$' "$workdir/skippr-run.log"; then
          echo "::error::skippr run exited successfully but did not print final Done line"
          echo "This catches the silent-exit regression where the wrapper returns right after printing the run id."
          exit 1
        fi
