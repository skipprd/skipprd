name: S3 copy matrix
description: "Copy json/csv/xml through type: copy, S3 (R2) → File and File → S3 (R2)."
inputs:
  skipprd_path:
    required: true
  plugin_binaries_dir:
    required: false
    default: ""
  r2_account_id:
    required: true
  r2_access_key_id:
    required: true
  r2_secret_access_key:
    required: true
runs:
  using: composite
  steps:
    - name: Install Python deps
      shell: bash
      run: python3 -m pip install --quiet boto3
    - name: S3 → File copy matrix
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.r2_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2_secret_access_key }}
        AWS_DEFAULT_REGION: auto
        AWS_EC2_METADATA_DISABLED: "true"
        R2_ACCOUNT_ID: ${{ inputs.r2_account_id }}
        SKIPPRD_PATH: ${{ inputs.skipprd_path }}
        PLUGIN_BINARIES_DIR: ${{ inputs.plugin_binaries_dir }}
        SKIPPR_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      run: |
        set -euo pipefail
        source "${GITHUB_WORKSPACE}/.github/scripts/e2e_stage_plugins.sh"
        work="${RUNNER_TEMP:-/tmp}/skippr-s3-file-copy"
        mkdir -p "${work}"
        e2e_stage_plugins .github/actions/e2e/s3_file_copy/skippr.yml s3_file_copy "${work}/manifests"
        export COPY_WORK="${work}"
        export R2_S3_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
        export COPY_S3_PREFIX="s3-file-copy/${GITHUB_RUN_ID}/"
        python3 .github/actions/e2e/s3_file_copy/run_matrix.py
        e2e_assert_downloaded 'skippr-plugin-data-source-s3*' 'skippr-plugin-data-sink-file*'
        e2e_stage_plugins .github/actions/e2e/s3_file_copy/skippr_s3_sink.yml file_s3_copy "${work}/manifests-s3-sink"
        export COPY_WORK="${work}/s3-sink"
        export COPY_S3_PREFIX="file-s3-copy/${GITHUB_RUN_ID}/"
        python3 .github/actions/e2e/s3_file_copy/run_s3_sink.py
        e2e_assert_downloaded 'skippr-plugin-data-source-file*' 'skippr-plugin-data-sink-s3*'
