[package]
name = "skippr-plugin-data-sink-snowflake"
version = "0.1.4"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-sink-snowflake"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true
hex.workspace = true
parquet.workspace = true

aes = { version = "0.8", default-features = false }
arrow = { version = "58.3.0", features = ["ipc_compression"] }
async-trait = "0.1.77"
aws-config = "1.5.1"
aws-credential-types = "1.2.0"
aws-sdk-s3 = "1.32.0"
base64 = "0.22.1"
bytes = "1.5.0"
chrono = "0.4.44"
dashmap = "5.5.3"
datafusion.workspace = true
futures = "0.3.25"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
object_store.workspace = true
once_cell = "1.17.0"
rand = "0.8.5"
reqwest = { workspace = true }
rsa = { version = "0.9.10" }
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
sha2 = "0.10"
tracing = "0.1"
url = "2.3.1"
uuid = { version = "1", features = ["v4"] }
[package.metadata.skippr-plugin]
kind = "DataSink"
plugin_name = "Snowflake"
supports_schema = true

[package.metadata.skippr-plugin.sink_capability]
name = "Snowflake"
max_sessions_per_child = 1
guarantee_tier = "ExactOnceCdcEligible"
can_manage_skippr_columns = true
can_maintain_tombstone_tables = true
can_compare_order_tokens = true
supports_transactions = true
retry_semantics = "FinalStateIdempotent"
grouping_support = "FinalStateBatches"
