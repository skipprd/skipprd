  publish:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/test')
    needs:
      - linux_x86_test
      - chaos_mode_test
#      - deadletters_test
      - s3_wal_test
#      - macos_arm64
#      - macos_x86
#      - macos_arm64_test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Compress Release Artifacts
        run: |
          ls -la .
          tar -czvf skippr-linux_x86.tar.gz skippr-linux_x86/
#          tar -czvf skippr-macos_arm64.tar.gz skippr-macos_arm64/
#          tar -czvf skippr-macos_x86.tar.gz skippr-macos_x86/
      - name: Release builds to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: |
            install.sh
            ./skippr-linux_x86.tar.gz
#            ./skippr-macos_arm64.tar.gz
#            ./skippr-macos_x86.tar.gz
          tag_name: ${{ github.ref_name }}
          body: ${{ github.event.head_commit.message }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          #          target_commitish: ${{ github.sha }}
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          repository: skipprd/skipprd
          fail_on_unmatched_files: true

  publish_react:
    name: Publish React Release Assets
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/test')
    needs:
      - react_binary_build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Download React Artifacts
        uses: actions/download-artifact@v4

      - name: Compress React Artifacts
        run: |
          ls -la .
          shopt -s nullglob
          for d in react-*; do
            if [ -d "$d" ]; then
              tar -czvf "${d}.tar.gz" "$d"
            fi
          done
          ls -la react-*.tar.gz || true

      - name: Upload React assets to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./react-*.tar.gz
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          repository: skipprd/skipprd
          fail_on_unmatched_files: false

  dockerize:
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/test')
    needs:
      - publish
#      - macos_arm64
#      - macos_x86
#      - linux_x86
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: skippr
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: ls artifacts
        run: |
          ls -la .

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.CONTAINER_IMAGE }} -f Dockerfile .
          
          docker tag ${{ env.CONTAINER_IMAGE }} ${{ env.DOCKER_HUB_REPO }}/${{ env.CONTAINER_IMAGE }}
          docker push ${{ env.DOCKER_HUB_REPO }}/${{ env.CONTAINER_IMAGE }}

          docker tag ${{ env.CONTAINER_IMAGE }} ${{ env.DOCKER_HUB_REPO }}/${{ env.CONTAINER_LATEST_IMAGE }}
          docker push ${{ env.DOCKER_HUB_REPO }}/${{ env.CONTAINER_LATEST_IMAGE }}

          docker tag ${{ env.CONTAINER_IMAGE }} ${{ env.DOCKER_HUB_REPO }}/skippr:stable
          docker push ${{ env.DOCKER_HUB_REPO }}/skippr:stable


