version: 1

server:
  port: 8787

storage:
  # From repo-root skippr.yml: skippr.skippr_s3_bucket
  bucket: asgsdag-datalake

scope:
  # From repo-root skippr.yml: skippr.tenant / skippr.workspace
  tenant: picnic
  workspace: test

  # react-specific partition; closest analogue to a skippr pipeline.
  project_id: app

llm:
  # Keep secrets (api keys) in env via EnvSecretsProvider (e.g. LLM_API_KEY).
  provider: OPENAI_COMPAT
  base_url: https://api.openai.com
  chat_model: gpt-5.1
  embed_model: text-embedding-3-small
  context_length: 8192
  http_timeout_secs: 120
  max_tokens: 8192
  temperature: 0.2
  top_p: 1.0

providers:
  athena:
    enabled: true
    workgroup: picnic
    default_database: picnic
    catalog: AwsDataCatalog
    result_s3: s3://asgsdag-datalake/
    discovery_cache_ttl_secs: 120

  catalog:
    enabled: true
    refresh_secs: 60
    max_concurrency: 8

  dbt:
    enabled: true
    # Use "docker" to avoid host-python/dbt dependency issues.
    runner: docker
    # Pinned official adapter image (example). Choose a version compatible with your DBT project.
    docker_image: ghcr.io/dbt-labs/dbt-athena:1.8.3
    docker_mount_aws_dir: true
    target: athena

  vector:
    enabled: true
