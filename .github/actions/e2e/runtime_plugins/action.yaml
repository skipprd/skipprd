name: Runtime Plugin Acceptance Test
inputs:
  architecture_name:
    description: 'linux_x86, macos_arm64, windows_x86'
    required: true
    default: 'linux_x86'
  releases_bucket:
    description: 'Public S3 bucket containing release assets'
    required: true
  runtime_plugin_versions:
    description: 'Optional newline-delimited PLUGIN=VERSION pins to validate; unpinned plugins resolve from latest'
    required: false
    default: ""
  runtime_plugin_release_subdir:
    description: 'Release subdirectory for published runtime plugin assets'
    required: true
    default: 'runtime-plugins'
runs:
  using: "composite"
  steps:
    - name: Run runtime plugin acceptance tests
      shell: bash
      run: |
        set -euo pipefail

        chmod +x "./skipprd-${{ inputs.architecture_name }}/skipprd"
        runtime_plugin_args=()
        while IFS= read -r runtime_plugin_version; do
          runtime_plugin_version="${runtime_plugin_version#"${runtime_plugin_version%%[![:space:]]*}"}"
          runtime_plugin_version="${runtime_plugin_version%"${runtime_plugin_version##*[![:space:]]}"}"
          if [[ -z "${runtime_plugin_version}" ]]; then
            continue
          fi
          runtime_plugin_args+=(
            --runtime-plugin-version
            "${runtime_plugin_version}"
          )
        done <<< "${{ inputs.runtime_plugin_versions }}"
        python3 .github/scripts/runtime_e2e_harness.py runtime-plugins \
          --skipprd "$PWD/skipprd-${{ inputs.architecture_name }}/skipprd" \
          --mode full \
          --architecture-name "${{ inputs.architecture_name }}" \
          --releases-bucket "${{ inputs.releases_bucket }}" \
          --runtime-plugin-release-subdir "${{ inputs.runtime_plugin_release_subdir }}" \
          "${runtime_plugin_args[@]}"
