name: Chaos Mode Test
inputs:
  architecture_name:
    description: 'macos_arm64, macos-x86, linux_x86'
    required: true
    default: 'stable'
  aws_access_key_id:
    required: true
  aws_secret_access_key:
    required: true
  docker_hub_pass:
    required: true
runs:
  using: "composite"
  steps:
    - name: Run Skippr in Docker
      shell: bash
      run: |
        docker run --name skippr \
          -e AWS_ACCESS_KEY_ID=${{ inputs.aws_access_key_id }} \
          -e AWS_SECRET_ACCESS_KEY=${{ inputs.aws_secret_access_key }} \
          -e AWS_DEFAULT_REGION=us-east-1 \
          -e CHAOS_MODE=no \
          -e DATA_SOURCE_PLUGIN_NAME=s3 \
          -e DATA_SOURCE_S3_BUCKET=skippr-e2e-sample-data \
          -e DATA_SOURCE_S3_PREFIX=bike-hire-many \
          -e DATA_SOURCE_BATCH_SIZE_BYTES=2048000 \
          -e DATA_OUTPUT_PLUGIN_NAME=athena \
          -e DATA_OUTPUT_S3_BUCKET=skippr-e2e-sample-data-output \
          -e DATA_OUTPUT_S3_PREFIX=bikehire \
          -e SCHEMA_OUTPUT_PLUGIN_NAME=glue \
          -e SCHEMA_OUTPUT_GLUE_DATABASE_NAME=bikehire \
          -e DATA_OUTPUT_ATHENA_WORKGROUP_NAME=bikehire \
          -e PIPELINE_NAME=chaos_mode \
          -e SKIPPR_API_TOKEN=B8ib6S3wa9nSq5wAwxkO9dceUIg04d4uTYUHBDg \
          -e APP_ENV=test \
          -e DATA_DIR=./data \
        
          skippr/skippr:latest sync
    - name: Asset Athena
      shell: bash
      run: |
        pip install soda-core-athena
        AWS_DEFAULT_REGION=us-east-1 AWS_ACCESS_KEY_ID=${{ inputs.aws_access_key_id }} AWS_SECRET_ACCESS_KEY=${{ inputs.aws_secret_access_key }}  soda scan -d datalake_e2e -c ./soda/configuration.yml ./soda/bike_hire_many.yml
      #        docker run --name soda -e AWS_DEFAULT_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY -v `pwd`/soda:/soda sodadata/soda-core scan -d datalake_e2e -c /soda/configuration.yml /soda/chaos_mode.yml
      #        if [[ "$(docker logs soda >& container-logs ; cat container-logs | grep 'All is good' | wc -l)" -gt 0 ]]; then exit 0; fi
      #        if [[ "$(docker container wait soda)" -gt 0 ]]; then exit 1; fi


      # ... (your existing Asset Athena step)
