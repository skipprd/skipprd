openapi: 3.1.0
info:
  title: Skippr Ask WebSocket API
  version: 0.1.1
  description: |
    WebSocket-based chat threads for Ask. Clients send JSON frames and receive JSON frames.
    Supported client message types: list, new, open, user.
    Server message types: list, final, await_user, ok, error.

servers:
  - url: ws://{host}:{port}/
    description: WebSocket endpoint
    variables:
      host:
        default: localhost
      port:
        default: "8787"

# No security (for now)
security: []

tags:
  - name: websocket
    description: WebSocket handshake and message contracts

paths:
  "/":
    get:
      tags: [websocket]
      summary: WebSocket handshake (Upgrade)
      description: |
        Connect via WebSocket and exchange JSON messages.
        Frames must conform to the schemas under components/schemas.
      x-websocket: true
      responses:
        "101":
          description: Switching Protocols to WebSocket
        "400":
          description: Bad Request

components:
  schemas:
    # Discriminated unions for client->server and server->client messages
    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/ListRequest'
        - $ref: '#/components/schemas/NewRequest'
        - $ref: '#/components/schemas/OpenRequest'
        - $ref: '#/components/schemas/UserRequest'
      discriminator:
        propertyName: type
        mapping:
          list: '#/components/schemas/ListRequest'
          new: '#/components/schemas/NewRequest'
          open: '#/components/schemas/OpenRequest'
          user: '#/components/schemas/UserRequest'

    ServerMessage:
      oneOf:
        - $ref: '#/components/schemas/ListResponse'
        - $ref: '#/components/schemas/FinalResponse'
        - $ref: '#/components/schemas/AwaitUserResponse'
        - $ref: '#/components/schemas/OkResponse'
        - $ref: '#/components/schemas/ErrorResponse'
      discriminator:
        propertyName: type
        mapping:
          list: '#/components/schemas/ListResponse'
          final: '#/components/schemas/FinalResponse'
          await_user: '#/components/schemas/AwaitUserResponse'
          ok: '#/components/schemas/OkResponse'
          error: '#/components/schemas/ErrorResponse'

    # Client -> Server
    ListRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [list]

    NewRequest:
      type: object
      additionalProperties: false
      required: [type, question]
      properties:
        type:
          type: string
          enum: [new]
        question:
          type: string
          description: User's question to start a new thread

    OpenRequest:
      type: object
      additionalProperties: false
      required: [type, thread_id]
      properties:
        type:
          type: string
          enum: [open]
        thread_id:
          type: string
          description: Existing thread id returned by a previous interaction
        question:
          type: string
          description: Optional nudge to resume the thread (default is "Continue.")

    UserRequest:
      type: object
      additionalProperties: false
      required: [type, thread_id, text]
      properties:
        type:
          type: string
          enum: [user]
        thread_id:
          type: string
        text:
          type: string
          description: User-provided content in response to an `await_user` prompt

    # Server -> Client
    ListResponse:
      type: object
      additionalProperties: false
      required: [type, threads]
      properties:
        type:
          type: string
          enum: [list]
        threads:
          type: array
          description: List of existing thread ids (opaque)
          items:
            type: string

    FinalResponse:
      type: object
      additionalProperties: false
      required: [type, thread_id, result]
      properties:
        type:
          type: string
          enum: [final]
        thread_id:
          type: string
        result:
          type: object
          required: [answer]
          additionalProperties: false
          properties:
            sql:
              description: SQL generated by the agent (may be null)
              type: [string, 'null']
            answer:
              type: string
              description: Plain-text concise answer

    AwaitUserResponse:
      type: object
      additionalProperties: false
      required: [type, thread_id, prompt]
      properties:
        type:
          type: string
          enum: [await_user]
        thread_id:
          type: string
        prompt:
          type: string
          description: Question the agent asks the user to proceed

    OkResponse:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [ok]

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [type, error]
      properties:
        type:
          type: string
          enum: [error]
        error:
          type: string

  examples:
    listRequest:
      summary: List threads
      value:
        type: list
    listResponse:
      summary: Threads listed
      value:
        type: list
        threads:
          - th_1731760000000
          - th_1731761111222

    newRequest:
      summary: Start a new thread
      value:
        type: new
        question: What were total rides last week?
    finalResponse:
      summary: Final answer
      value:
        type: final
        thread_id: th_1731761234567
        result:
          sql: |
            SELECT date, COUNT(*) AS rides
            FROM trips
            WHERE date >= DATE_SUB(CURRENT_DATE, INTERVAL 7 DAY)
            GROUP BY date
            ORDER BY date
          answer: Rides trended up 8% vs the prior week.

    awaitUserResponse:
      summary: Agent needs user input
      value:
        type: await_user
        thread_id: th_1731761234567
        prompt: Please tell me a bit about your business (1–3 sentences).

    userRequest:
      summary: Provide user input
      value:
        type: user
        thread_id: th_1731761234567
        text: We rent e-bikes in NYC and care about weekend demand.
    okResponse:
      summary: Acknowledgement
      value:
        type: ok

x-notes:
  semantics: |
    - Clients send one request frame and receive one response frame.
    - Flow: `new` -> (`final` | `await_user`). If `await_user`, send `user` and then `open` to continue the same thread until `final`.
    - Thread IDs are opaque; clients should not depend on their format.
  security: |
    No authentication/authorization is enforced by the server as specified here. Avoid exposing publicly.


