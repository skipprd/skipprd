name: Runtime E2E Scenario
inputs:
  scenario:
    description: 'Harness scenario name to run'
    required: true
  architecture_name:
    description: 'macos_arm64, macos-x86, linux_x86'
    required: true
    default: 'stable'
  aws_access_key_id:
    required: true
  aws_secret_access_key:
    required: true
  runtime_plugin_versions:
    description: 'Optional newline-delimited PLUGIN=VERSION pins passed to the runtime e2e harness'
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Run runtime e2e harness scenario
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        set -euo pipefail
        runtime_plugin_args=()
        while IFS= read -r runtime_plugin_version; do
          runtime_plugin_version="${runtime_plugin_version#"${runtime_plugin_version%%[![:space:]]*}"}"
          runtime_plugin_version="${runtime_plugin_version%"${runtime_plugin_version##*[![:space:]]}"}"
          if [[ -z "${runtime_plugin_version}" ]]; then
            continue
          fi
          runtime_plugin_args+=(
            --runtime-plugin-version
            "${runtime_plugin_version}"
          )
        done <<< "${{ inputs.runtime_plugin_versions }}"
        python3 .github/scripts/runtime_e2e_harness.py run "${{ inputs.scenario }}" --mode full --skippr-el "./skippr-el-${{ inputs.architecture_name }}/skippr-el" "${runtime_plugin_args[@]}"
