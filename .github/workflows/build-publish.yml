          architecture_name: linux_x86

  windows_x86:
    name: cargo build (windows x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native dependencies (vcpkg)
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows-static-md openssl:x64-windows-static-md zlib:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "ZLIB_ROOT=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-release-windows_x86

      - name: Configure version if tag commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          (Get-Content Cargo.toml) -replace '0\.0\.0-git', '${{ github.ref_name }}' | Set-Content Cargo.toml
          (Get-Content Cargo.lock) -replace '0\.0\.0-git', '${{ github.ref_name }}' | Set-Content Cargo.lock

      - name: Build release
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path skippr-el-windows_x86
          Copy-Item target\release\skippr-el.exe skippr-el-windows_x86\skippr-el.exe
          Get-ChildItem skippr-el-windows_x86
        env:
          RUSTFLAGS: "-C debuginfo=0"

      - name: Verify compiled version
        shell: pwsh
        run: |
          $version = (.\target\release\skippr-el.exe --version 2>&1) -replace '^skippr\s+', ''
          Write-Host "skippr-el version: $version"
          if ($version -eq '0.0.0-git' -or [string]::IsNullOrEmpty($version)) {
            Write-Error "Version was not set during build"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skippr-el-windows_x86
          path: skippr-el-windows_x86
          retention-days: 30

