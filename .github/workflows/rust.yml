name: Rust CI/CD Pipeline
on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  linux_test_suite:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: Python workflow contracts (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/test_rust_ci.py
      - run: python3 .github/scripts/test_host_dependency_boundaries.py
      - run: python3 .github/scripts/test_runtime_e2e_harness.py
      - run: python3 .github/scripts/test_seed_bike_hire_r2.py
      - run: python3 .github/scripts/test_local_runtime_plugins.py
      - run: python3 .github/scripts/test_runtime_plugin_catalog.py

  linux_x86:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: cargo build (linux x86)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skipprd/cloud
          path: cloud
          token: ${{ secrets.SKIPPR_CLOUD_CHECKOUT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: skipprd
          submodules: true
      - name: Build linux x86 release
        uses: ./skipprd/.github/actions/rust-build-release
        with:
          rust-version: "1.92.0"
          architecture_name: linux_x86
          workspace-root: skipprd

  macos_arm64:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: cargo build (macos arm64)
    runs-on: [self-hosted, skippr-darwin-arm64]
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skipprd/cloud
          path: cloud
          token: ${{ secrets.SKIPPR_CLOUD_CHECKOUT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: skipprd
          submodules: true
      - name: Build macos arm64 release
        uses: ./skipprd/.github/actions/rust-build-release
        with:
          rust-version: "1.92.0"
          architecture_name: macos_arm64
          workspace-root: skipprd

  chaos_mode_test:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: Chaos Mode (linux x86)
    needs:
      - linux_x86
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download skipprd
        uses: actions/download-artifact@v4
        with:
          name: skipprd-linux_x86
          path: skipprd-linux_x86
      - name: Download runtime plugins
        uses: actions/download-artifact@v4
        with:
          name: runtime-plugin-binaries-linux_x86
          path: runtime-plugin-binaries-linux_x86
      - name: Make skipprd executable
        run: chmod +x ./skipprd-linux_x86/skipprd
      - name: Test linux x86 release
        uses: ./.github/actions/e2e/runtime_scenario
        with:
          scenario: bike_hire_many
          architecture_name: linux_x86
          skipprd_path: ./skipprd-linux_x86/skipprd
          plugin_binaries_dir: ./runtime-plugin-binaries-linux_x86
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  e2e_file_duckdb:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: File to Duckdb (linux x86)
    needs:
      - linux_x86
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download skipprd
        uses: actions/download-artifact@v4
        with:
          name: skipprd-linux_x86
          path: skipprd-linux_x86
      - name: Download runtime plugins
        uses: actions/download-artifact@v4
        with:
          name: runtime-plugin-binaries-linux_x86
          path: runtime-plugin-binaries-linux_x86
      - name: File append into Duckdb Iceberg
        run: |
          set -euo pipefail
          chmod +x ./skipprd-linux_x86/skipprd
          mkdir -p target/release
          cp runtime-plugin-binaries-linux_x86/* target/release/
          chmod +x target/release/skippr-plugin-*
          if ! command -v duckdb >/dev/null 2>&1; then
            curl -fsSL https://install.duckdb.org | sh
            export PATH="${HOME}/.duckdb/cli/latest:${PATH}"
          fi
          work="${RUNNER_TEMP:-/tmp}/skippr-file-duckdb-append"
          mkdir -p "${work}/source" "${work}/warehouse" "${work}/data" "${work}/manifests"
          cp tests/fixtures/formats/people.csv "${work}/source/people.csv"
          warehouse_uri="file://${work}/warehouse"
          sed \
            -e "s|SOURCE_DIR|${work}/source|" \
            -e "s|WAREHOUSE_URI|${warehouse_uri}|" \
            .github/actions/e2e/file_duckdb_append/skippr.yml \
            > "${work}/skippr.yml"
          python3 .github/scripts/local_runtime_plugins.py \
            --config "${work}/skippr.yml" \
            --pipeline file_duckdb_append \
            --output-dir "${work}/manifests" \
            --release \
            --skip-cargo-build
          USE_LOCAL_PLUGIN_CODE=1 \
          SKIPPR_LOCAL_RUNTIME_PLUGIN_MANIFEST_DIR="${work}/manifests" \
          DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
            ./skipprd-linux_x86/skipprd --config "${work}/skippr.yml" \
            sync --log --pipeline file_duckdb_append --once
          count="$(duckdb -csv -c "SET unsafe_enable_version_guessing=true; INSTALL iceberg; LOAD iceberg; SELECT count(*) FROM iceberg_scan('${work}/warehouse/bronze/file_duckdb_append');")"
          echo "${count}"
          echo "${count}" | tail -n 1 | grep -qx '2'

  e2e_skipprlake:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: File to SkipprLake (linux x86)
    needs:
      - linux_x86
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download skipprd
        uses: actions/download-artifact@v4
        with:
          name: skipprd-linux_x86
          path: skipprd-linux_x86
      - name: Download runtime plugins
        uses: actions/download-artifact@v4
        with:
          name: runtime-plugin-binaries-linux_x86
          path: runtime-plugin-binaries-linux_x86
      - name: SkipprLake north-star harness
        env:
          SKIPPRD_BIN: ${{ github.workspace }}/skipprd-linux_x86/skipprd
          SKIP_CARGO_BUILD: "1"
        run: |
          set -euo pipefail
          chmod +x "$SKIPPRD_BIN"
          python3 -m pip install --quiet boto3
          mkdir -p target/release
          cp runtime-plugin-binaries-linux_x86/* target/release/
          chmod +x target/release/skippr-plugin-*
          python3 tests/skipprlake_e2e/run.py

  e2e_postgres_cdc:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: Postgres CDC to SkipprLake (linux x86)
    needs:
      - linux_x86
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download skipprd
        uses: actions/download-artifact@v4
        with:
          name: skipprd-linux_x86
          path: skipprd-linux_x86
      - name: Download runtime plugins
        uses: actions/download-artifact@v4
        with:
          name: runtime-plugin-binaries-linux_x86
          path: runtime-plugin-binaries-linux_x86
      - name: Make skipprd executable
        run: chmod +x ./skipprd-linux_x86/skipprd
      - name: Postgres snapshot-then-CDC into SkipprLake
        uses: ./.github/actions/e2e/postgres_skipprlake_cdc
        with:
          skipprd_path: ./skipprd-linux_x86/skipprd
          plugin_binaries_dir: ./runtime-plugin-binaries-linux_x86

  e2e_s3_schema_evolution:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: S3 schema evolution to SkipprLake (linux x86)
    needs:
      - linux_x86
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download skipprd
        uses: actions/download-artifact@v4
        with:
          name: skipprd-linux_x86
          path: skipprd-linux_x86
      - name: Download runtime plugins
        uses: actions/download-artifact@v4
        with:
          name: runtime-plugin-binaries-linux_x86
          path: runtime-plugin-binaries-linux_x86
      - name: Make skipprd executable
        run: chmod +x ./skipprd-linux_x86/skipprd
      - name: S3 v1 then v2 into SkipprLake
        uses: ./.github/actions/e2e/s3_skipprlake_evolve
        with:
          skipprd_path: ./skipprd-linux_x86/skipprd
          plugin_binaries_dir: ./runtime-plugin-binaries-linux_x86
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  e2e_file_postgres:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    name: File to Postgres (linux x86)
    needs:
      - linux_x86
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download skipprd
        uses: actions/download-artifact@v4
        with:
          name: skipprd-linux_x86
          path: skipprd-linux_x86
      - name: Download runtime plugins
        uses: actions/download-artifact@v4
        with:
          name: runtime-plugin-binaries-linux_x86
          path: runtime-plugin-binaries-linux_x86
      - name: Make skipprd executable
        run: chmod +x ./skipprd-linux_x86/skipprd
      - name: File append into Postgres
        uses: ./.github/actions/e2e/file_postgres_append
        with:
          skipprd_path: ./skipprd-linux_x86/skipprd
          plugin_binaries_dir: ./runtime-plugin-binaries-linux_x86

  publish_runtime_plugins:
    if: startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/0.0.0' && !startsWith(github.ref, 'refs/tags/test')
    name: Publish runtime plugins
    needs:
      - linux_x86
      - macos_arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASES_BUCKET: skippr-web-install
      RUNTIME_PLUGIN_RELEASE_SUBDIR: runtime-plugins
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download linux runtime plugins
        uses: actions/download-artifact@v4
        with:
          name: runtime-plugin-binaries-linux_x86
          path: runtime-plugin-binaries-linux_x86
      - name: Download macos runtime plugins
        uses: actions/download-artifact@v4
        with:
          name: runtime-plugin-binaries-macos_arm64
          path: runtime-plugin-binaries-macos_arm64
      - name: Require catalog binaries on linux and macos
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(".github/scripts").resolve()))
          from runtime_plugin_catalog import catalog_package_names

          names = catalog_package_names(Path(".").resolve())
          missing = []
          for directory in (
              Path("runtime-plugin-binaries-linux_x86"),
              Path("runtime-plugin-binaries-macos_arm64"),
          ):
              missing.extend(
                  f"{directory}/{name}"
                  for name in names
                  if not (directory / name).is_file()
              )
          if missing:
              raise SystemExit("runtime plugin artifacts missing:\n" + "\n".join(missing))
          print(f"catalog={len(names)} linux+macos artifacts present")
          PY
      - name: Stage runtime plugin release
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_runtime_plugins.py \
            --bucket "$RELEASES_BUCKET" \
            --subdir "$RUNTIME_PLUGIN_RELEASE_SUBDIR" \
            --public-base-url "https://install.skippr.io/releases/${RUNTIME_PLUGIN_RELEASE_SUBDIR}" \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/runtime-plugin-release" \
            --bundle-version "${{ github.ref_name }}"
      - name: Configure Cloudflare R2 credentials for runtime plugin upload
        uses: ./.github/actions/configure-r2-releases
        with:
          account_id: ${{ secrets.R2_ACCOUNT_ID }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Upload runtime plugins to install releases bucket
        run: |
          set -euo pipefail
          BUCKET="${{ env.RELEASES_BUCKET }}"
          RELEASE_SUBDIR="${{ env.RUNTIME_PLUGIN_RELEASE_SUBDIR }}"
          aws s3 sync runtime-plugin-release "s3://${BUCKET}/releases/${RELEASE_SUBDIR}/"
          aws s3 cp runtime-plugin-release/latest/manifest-index.json \
            "s3://${BUCKET}/releases/${RELEASE_SUBDIR}/latest/manifest-index.json" \
            --cache-control "no-cache, no-store, must-revalidate"

  publish_skipprd:
    if: startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/0.0.0' && !startsWith(github.ref, 'refs/tags/test')
    name: Publish skipprd Release
    needs:
      - chaos_mode_test
      - e2e_file_duckdb
      - e2e_skipprlake
      - e2e_postgres_cdc
      - e2e_s3_schema_evolution
      - e2e_file_postgres
      - linux_x86
      - macos_arm64
      - publish_runtime_plugins
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASES_BUCKET: skippr-web-install
      SKIPPRD_RELEASE_SUBDIR: skipprd
      SKIPPRD_LATEST_POINTER: latest-skipprd.txt
    steps:
      - uses: actions/checkout@v4
      - name: Download skipprd artifacts
        uses: actions/download-artifact@v4
        with:
          name: skipprd-linux_x86
          path: skipprd-linux_x86
      - name: Download macos skipprd artifacts
        uses: actions/download-artifact@v4
        with:
          name: skipprd-macos_arm64
          path: skipprd-macos_arm64
      - name: Compress skipprd release artifacts
        run: |
          set -euo pipefail
          tar -czvf skipprd-linux_x86.tar.gz skipprd-linux_x86/
          tar -czvf skipprd-macos_arm64.tar.gz skipprd-macos_arm64/
      - name: Configure Cloudflare R2 credentials for skipprd release upload
        uses: ./.github/actions/configure-r2-releases
        with:
          account_id: ${{ secrets.R2_ACCOUNT_ID }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Upload skipprd binaries to install releases bucket
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          BUCKET="${{ env.RELEASES_BUCKET }}"
          RELEASE_SUBDIR="${{ env.SKIPPRD_RELEASE_SUBDIR }}"
          LATEST_POINTER="${{ env.SKIPPRD_LATEST_POINTER }}"
          aws s3 cp skipprd-linux_x86.tar.gz "s3://${BUCKET}/releases/${RELEASE_SUBDIR}/${TAG}/skipprd-linux_x86.tar.gz"
          aws s3 cp skipprd-macos_arm64.tar.gz "s3://${BUCKET}/releases/${RELEASE_SUBDIR}/${TAG}/skipprd-macos_arm64.tar.gz"
          printf '%s' "$TAG" > "$LATEST_POINTER"
          aws s3 cp "$LATEST_POINTER" "s3://${BUCKET}/releases/${LATEST_POINTER}" --cache-control "no-cache, no-store, must-revalidate"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo skipprd/skipprd >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo skipprd/skipprd \
              --title "Release $TAG" \
              --notes-file CHANGELOG.txt
          else
            gh release create "$TAG" \
              --repo skipprd/skipprd \
              --title "Release $TAG" \
              --notes-file CHANGELOG.txt
          fi
          gh release upload "$TAG" \
            install.sh \
            skipprd-linux_x86.tar.gz \
            skipprd-macos_arm64.tar.gz \
            --repo skipprd/skipprd \
            --clobber

  # Disabled for now: Windows and extra e2e.
  # windows_x86:
