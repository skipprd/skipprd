name: Skippr Cloud runner smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: skippr-linux-x64-2
    runs-on:
      - self-hosted
      - skippr-linux-x64-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove Skippr runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          echo "runner=${RUNNER_NAME:-}"
          echo "labels=${RUNNER_LABELS:-}"
          test -f Cargo.toml
          git rev-parse --short HEAD
          echo ok
