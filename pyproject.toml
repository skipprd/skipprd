[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "skippr"
version = "16.0.0"
description = "skipprd ELT engine — Session, discover, sync, df, query"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pyarrow>=17"]

[project.urls]
Homepage = "https://skippr.io"
Documentation = "https://skippr.io"
Repository = "https://github.com/skipprd/skipprd"

[project.optional-dependencies]
pandas = ["pandas"]

[tool.maturin]
manifest-path = "python/Cargo.toml"
module-name = "skippr"
