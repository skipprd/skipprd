docker_push_release:
  image: docker:latest
  stage: publish
  script:
    # Push to Docker Hub
    - docker login -u skippr -p "$DOCKER_HUB_PASS"
    - docker pull $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE

    - docker tag $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE $DOCKER_HUB_REPO/$CONTAINER_RELEASE_IMAGE
    - docker push $DOCKER_HUB_REPO/$CONTAINER_RELEASE_IMAGE

    - docker tag $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE $DOCKER_HUB_REPO/$CONTAINER_SNAPSHOT_IMAGE
    - docker push $DOCKER_HUB_REPO/$CONTAINER_SNAPSHOT_IMAGE
  only:
#    - master
    - tags

github_publish_release_skipprd_amd64:
  stage: publish
  extends: .github_publish_release
  variables:
    FILE_PATH: "./target/release/skipprd_amd64"
    RELEASE_NAME: "Release $CI_COMMIT_TAG - amd64"

