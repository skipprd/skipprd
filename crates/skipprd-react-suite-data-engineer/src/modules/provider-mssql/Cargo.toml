[package]
name = "react-module-provider-mssql"
version = "0.0.0-git"
edition = "2021"

[dependencies]
async-trait = "0.1.77"
futures = "0.3.25"
serde_json = "1.0.85"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
react-core = { workspace = true }
react-suite-data-engineer = { path = "../../.." }
