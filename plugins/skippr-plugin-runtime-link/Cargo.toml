[package]
name = "skippr-plugin-runtime-link"
version = "0.0.0-git"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
skippr = { path = "../.." }
serde_derive = "1.0.105"
serde = "1.0.105"
serde_json = "1.0.85"
serde_yaml = "0.9.16"
schemars = "0.7.0"
regex = "1.7.0"
memory-stats = "1.0.0"
rand = "0.8.5"
chrono = "=0.4.42"
chrono-tz = "0.8.6"
icu = "1.0.0"
array-init = "2.1.0"
envy = "0.4.2"
aws-config = "1.5.1"
aws-sdk-s3 = "1.32.0"
aws-types = "1.3.1"
tokio = { version = "1", features = ["full"] }
flate2 = "1.0.25"
csv = "1.1.6"
futures = "0.3.25"
periodic = "0.1.1"
glob = "0.3.0"
cc = "1.2.41"
clap = { version = "4.0.32", features = ["derive"] }
yaml-rust = "0.4.5"
once_cell = "1.17.0"
parquet = "56.2.0"
arrow = { version = "56.2.0", features = ["ipc_compression"] }
arrow-schema = "56.2.0"
arrow-buffer = "56.2.0"
indexmap = "1.9.2"
reqwest = { version = "0.11.16", default-features = false, features = ["blocking", "json", "rustls-tls"] }
lazy_static = "1.4.0"
urldecode = "0.1.1"
url = "2.3.1"
aws-smithy-http = "0.60.8"
aws-sdk-glue = "1.38.0"
md5 = "0.7.0"
phf = { version = "0.11.1", default-features = false, features = ["macros"] }
sled = { version = "0.34.4" }
zerocopy = "0.6.1"
byteorder = "1.4.3"
ctrlc = "3.2.5"
signal-hook = "0.3.15"
lru = "0.10.0"
tar = "0.4.38"
zip = "0.6.6"
threadpool = "1.8.1"
num_cpus = "1.16.0"
avro-rs = "0.13.0"
datafusion = "50.3.0"
serde-xml-rs = "0.6.0"
serde-transcode = "1.1.1"
serde-value = "0.7.0"
hex = "0.4.3"
shellexpand = "3.1.0"
toml = "0.8.1"
dashmap = "5.5.3"
libc = "0.2.151"
bincode = { version = "1.3", features = [] }
serde_cbor = { version = "0.11.2", features = [] }
sqlparser = "0.43.1"
ini = "1.3.0"
walkdir = { version = "2.3.2", features = [] }
bytes = "1.5.0"
async-trait = "0.1.77"
thiserror = "1.0.58"
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp"] }
rayon = "1.8.0"
arc-swap = "1.6"
tokio-util = { version = "0.7", features = ["io", "io-util", "compat"], default-features = false }
sha2 = "0.10"
aws-credential-types = "1.2.0"
ratatui = { version = "0.26" }
crossterm = { version = "0.27" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
crossbeam-channel = "0.5.15"
ureq = { version = "2", features = ["json"] }
lancedb = "0.22.3"
log = "0.4.28"
uuid = { version = "1", features = ["v4"] }
tempfile = "3.10"
itertools = "0.12"
base64 = "0.22.1"
tracing-appender = "0.2.4"
aes = { version = "0.8", default-features = false }
axum = "0.7"
quick-xml = { version = "0.39.2", features = ["serialize"] }

aws-sdk-athena = { version = "1.30.0", optional = true }
aws-sdk-dynamodb = { version = "1.51.0", optional = true }
aws-sdk-dynamodbstreams = { version = "1.51.0", optional = true }
aws-sdk-eventbridge = { version = "1", optional = true }
aws-sdk-kinesis = { version = "1.48.0", optional = true }
aws-sdk-redshiftdata = { version = "1", optional = true }
aws-sdk-sns = { version = "1", optional = true }
aws-sdk-sqs = { version = "1.47.0", optional = true }
clickhouse = { version = "0.13", features = ["inserter"], optional = true }
deltalake = { version = "0.27", features = ["datafusion"], optional = true }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"], optional = true }
lapin = { version = "2", optional = true }
mongodb = { version = "3", optional = true }
mysql_async = { version = "0.34", optional = true }
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }
rsa = { version = "0.9.10", optional = true }
rumqttc = { version = "0.24", optional = true }
ssh2 = { version = "0.9", optional = true }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono"], optional = true }
tokio-tungstenite = { version = "0.21", optional = true }
tungstenite = { version = "0.21", optional = true }

[features]
default = []
runtime-plugin-source-amqp = ["dep:lapin"]
runtime-plugin-source-clickhouse = ["dep:clickhouse"]
runtime-plugin-source-delta-lake = ["dep:deltalake"]
runtime-plugin-source-dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-sdk-dynamodbstreams"]
runtime-plugin-source-eventbridge = ["dep:aws-sdk-eventbridge"]
runtime-plugin-source-file = []
runtime-plugin-source-http-client = []
runtime-plugin-source-http-server = []
runtime-plugin-source-kafka = ["dep:rdkafka"]
runtime-plugin-source-kinesis = ["dep:aws-sdk-kinesis"]
runtime-plugin-source-mongodb = ["dep:mongodb"]
runtime-plugin-source-motherduck = []
runtime-plugin-source-mqtt = ["dep:rumqttc"]
runtime-plugin-source-mssql = ["dep:tiberius"]
runtime-plugin-source-mysql = ["dep:mysql_async"]
runtime-plugin-source-pcap = []
runtime-plugin-source-redshift = ["dep:aws-sdk-redshiftdata"]
runtime-plugin-source-s3 = []
runtime-plugin-source-sftp = ["dep:ssh2"]
runtime-plugin-source-sns = ["dep:aws-sdk-sns"]
runtime-plugin-source-sqs = ["dep:aws-sdk-sqs"]
runtime-plugin-source-statsd = []
runtime-plugin-source-stdin = []
runtime-plugin-source-socket = []
runtime-plugin-source-websocket = ["dep:tokio-tungstenite", "dep:tungstenite"]

builtin-runtime-plugins = [
    "dep:aws-sdk-athena",
    "dep:tiberius",
    "dep:jsonwebtoken",
    "dep:rsa",
    "dep:mysql_async",
    "dep:aws-sdk-dynamodb",
    "dep:aws-sdk-kinesis",
    "dep:aws-sdk-sqs",
    "dep:aws-sdk-eventbridge",
    "dep:aws-sdk-sns",
    "dep:aws-sdk-redshiftdata",
    "dep:mongodb",
    "dep:rumqttc",
    "dep:ssh2",
    "dep:deltalake",
    "dep:lapin",
    "dep:rdkafka",
    "dep:clickhouse",
    "dep:aws-sdk-dynamodbstreams",
]
runtime-sink-link = ["builtin-runtime-plugins"]
