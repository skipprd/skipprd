dockerize:
  tags: [ saas-linux-medium-amd64 ]
  image: docker:latest
  stage: init
#  before_script:
#    - rustup update && cargo update
  script:
    - docker pull $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE || true
    - docker build --cache-from $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE -t $CONTAINER_IMAGE -f Dockerfile .
#    - docker build -t $CONTAINER_IMAGE -f Dockerfile.mac_arm .
#    - docker build -t $CONTAINER_IMAGE -f Dockerfile.lambda .
  after_script:
    # Push to Docker Hub
    - docker login -u skippr -p "$DOCKER_HUB_PASS"
    - docker tag $CONTAINER_IMAGE $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE
    - docker push $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE
  artifacts:
    paths:
      - ~/cargo
  only:
    - master
    - tags

s3_plugin:
  image: docker:latest
  stage: e2e
  script:
    - docker pull $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE
    - docker run --name skippre2e -e AWS_DEFAULT_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY -e DATA_SOURCE_PLUGIN_NAME=s3 -e S3_BUCKET=skippr-e2e-sample-data -e S3_PREFIX=bike-hire -e DATA_SOURCE_BATCH_SIZE_BYTES=2048000 -e DATA_OUTPUT_S3_BUCKET=skippr-e2e-sample-data-output -e DATA_OUTPUT_S3_PREFIX=bikehire -e GLUE_DATABASE_NAME=bikehire -e ATHENA_WORKGROUP_NAME=bikehire -e PIPELINE_NAME=s3_plugin -e SKIPPR_API_TOKEN=B8ib6S3wa9nSq5wAwxkO9dceUIg04d4uTYUHBDg -e DATA_DIR=./ -e APP_ENV=test skippr/skipprd:latest
    - if [[ "$(docker logs skippre2e >& container-logs ; cat container-logs | grep -i 'Err' | wc -l)" -gt 0 ]]; then exit 1; fi
    - if [[ "$(docker container wait skippre2e)" -gt 0 ]]; then exit 1; fi
  after_script:
    - docker run --name soda -e AWS_DEFAULT_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY -v `pwd`/soda:/soda sodadata/soda-core scan -d datalake_e2e -c /soda/configuration.yml /soda/s3_plugin.yml
    - if [[ "$(docker container wait soda)" -gt 0 ]]; then exit 1; fi
  only:
    - master
    - tags

