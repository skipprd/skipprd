[package]
name = "skippr-plugin-data-sink-bigquery"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-sink-bigquery"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true
bytes.workspace = true
hex.workspace = true
parquet.workspace = true

arrow = { version = "58.3.0", features = ["ipc_compression"] }
async-trait = "0.1.77"
chrono = "0.4.44"
dashmap = "5.5.3"
datafusion.workspace = true
futures = "0.3.25"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
once_cell = "1.17.0"
reqwest = { workspace = true }
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSink"
plugin_name = "Bigquery"
supports_schema = true

[package.metadata.skippr-plugin.sink_capability]
name = "Bigquery"
guarantee_tier = "ExactOnceCdcEligible"
can_manage_skippr_columns = true
can_maintain_tombstone_tables = true
can_compare_order_tokens = true
supports_transactions = true
