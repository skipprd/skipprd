[package]
name = "skippr-plugin-data-source-google-serp-ranks"
version = "0.1.5"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-google-serp-ranks"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
reqwest = { workspace = true }
sha2 = "0.10"
skippr-plugin-shared-api-source = { path = "../../shared/api_source" }
skippr-runtime-sdk.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "GoogleSerpRanks"

[package.metadata.skippr-plugin.source_capability]
name = "GoogleSerpRanks"
guarantee_tier = "IncrementalOnly"
checkpoint_style = "CursorBased"
bootstrap_style = "FullScan"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "None"
declares_namespace_contracts = true
