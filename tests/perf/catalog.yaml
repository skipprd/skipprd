# skippr-perf scenario catalog. WAL leftover import is out of suite.
# Postgres CDC is out of this matrix until sync --once actually exits.
# SQL filter/derive and CREATE TABLE: File = historical batch, Stdin = stream source.
# Migrate: historical = ALTER after compact then continue ingest; stream = ALTER under a WAL compaction hold then continue ingest.
defaults:
  rows: 10000
  smoke_rows: 200
  linux_rows: 50000
  required_perf: [sync]

scenarios:
  ingest-a-duckdb:
    group: smoke
    kind: ingest
    sink: duckdb
    fixture: exact_arrow
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true

  ingest-a-skipprlake:
    group: smoke
    kind: ingest
    sink: skipprlake
    fixture: exact_arrow
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true
      leftover_seg_count: 0

  copy-b-json-json:
    group: smoke
    kind: copy
    sink: file
    fixture: exact_arrow
    profile: none
    required_perf: [sync, wal_persist, copy_ingest, copy_profile]
    asserts:
      identity: true

  copy-py-json-json:
    group: always
    kind: copy
    sink: file
    fixture: exact_arrow
    transform_py: stamp
    profile: none
    required_perf: [sync, wal_persist, copy_ingest, copy_profile]
    asserts:
      identity: true
      dest_has: [mapped]

  copy-py-site-lookup:
    group: always
    kind: copy
    sink: file
    fixture: site_lookup
    transform_py: site
    batch_partition_fields: detail.site
    profile: none
    required_perf: [sync, wal_persist, copy_ingest, copy_profile]
    asserts:
      identity: true

  ingest-py-duckdb:
    group: always
    kind: ingest
    sink: duckdb
    fixture: site_lookup_hit
    flatten_events: true
    transform_py: site
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      bronze_count: true
      dest_has: [site]

  ingest-py-stream-duckdb:
    group: always
    kind: ingest
    sink: duckdb
    source: stdin
    fixture: site_lookup_hit
    flatten_events: true
    transform_py: site
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist]
    asserts:
      bronze_count: true
      dest_has: [site]

  ingest-py-compose-duckdb:
