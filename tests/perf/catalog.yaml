# skippr-perf scenario catalog. WAL leftover import is out of suite.
# Postgres CDC is out of this matrix until sync --once actually exits.
# Ops/aggregates: File = historical batch, Stdin = stream source.
# Migrate: historical = ALTER after compact; stream = ALTER under a WAL compaction hold.
defaults:
  rows: 10000
  smoke_rows: 200
  linux_rows: 50000
  required_perf: [sync]

scenarios:
  ingest-a-duckdb:
    group: smoke
    kind: ingest
    sink: duckdb
    fixture: exact_arrow
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true

  ingest-a-skipprlake:
    group: smoke
    kind: ingest
    sink: skipprlake
    fixture: exact_arrow
    profile: none
    required_perf: [ingest_profile, plugin_ipc, sync, wal_persist, wal_compact, wal_reclaim]
    asserts:
      exact_arrow_eq_total: true
      exact_fallback_rows: 0
      bronze_count: true
      amount_sum: true
      leftover_seg_count: 0

  copy-b-json-json:
    group: smoke
    kind: copy
    sink: file
    fixture: exact_arrow
    profile: none
    required_perf: [sync, wal_persist, copy_ingest, copy_profile]
    asserts:
      identity: true

  ingest-json-parquet:
    group: smoke
    kind: ingest
    sink: file
    sink_format: parquet
