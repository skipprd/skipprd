version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: skippr_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: skippr_test
    ports:
      - "13306:3306"
    volumes:
      - ./tests/e2e/testdata/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  mssql:
    image: mcr.microsoft.com/azure-sql-edge:1.0.7
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TestPass123!"
      MSSQL_PID: "Developer"
    ports:
      - "11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -lc '</dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack
    environment:
      SERVICES: dynamodb,kinesis,sqs,s3
      DEFAULT_REGION: us-east-1
    ports:
      - "14566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  http-server:
    image: nginx:alpine
    volumes:
      - ./tests/e2e/testdata:/usr/share/nginx/html/testdata:ro
    ports:
      - "18080:80"
