[package]
name = "skippr-plugin-data-source-clickhouse"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-clickhouse"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-core.workspace = true
skippr-runtime-sdk.workspace = true

reqwest = { version = "0.11.16", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_derive = "1.0.105"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "Clickhouse"

[package.metadata.skippr-plugin.source_capability]
name = "Clickhouse"
guarantee_tier = "IncrementalOnly"
checkpoint_style = "CursorBased"
bootstrap_style = "FullScan"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "None"
