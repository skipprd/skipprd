[package]
name = "skippr-wal-catalog"
version = "0.1.0"
edition = "2021"
publish = false
description = "WAL catalog rows, keys, and store trait (sled / memory; DynamoDB impl lives with that offset store)"

[dependencies]
bincode = "1.3"
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
skippr-lease = { path = "../skippr-lease" }
sled = "=0.34.4"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.10"
