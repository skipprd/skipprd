[package]
name = "skippr-tables-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Async CloudTables JSON HTTP client for skipprd (mesh JWT only)"

[dependencies]
guest-broker = { path = "../../../cloud/crates/guest-broker", default-features = false }
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
