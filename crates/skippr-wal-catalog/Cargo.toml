[package]
name = "skippr-wal-catalog"
version = "0.1.0"
edition = "2021"
publish = false
description = "Skippr Store KV (memory + fjall) and WAL catalog rows"

[dependencies]
bincode = "1.3"
fjall = "3.1"
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
skippr-lease = { path = "../skippr-lease" }
sled = "=0.34.4"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.10"
