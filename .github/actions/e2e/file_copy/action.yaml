name: File to File copy matrix
description: "Copy json/csv/xml from a local File source through type: copy into File objects."
inputs:
  skipprd_path:
    required: true
  plugin_binaries_dir:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: File → File copy matrix
      shell: bash
      env:
        SKIPPRD_PATH: ${{ inputs.skipprd_path }}
        PLUGIN_BINARIES_DIR: ${{ inputs.plugin_binaries_dir }}
      run: |
        set -euo pipefail
        source "${GITHUB_WORKSPACE}/.github/scripts/e2e_stage_plugins.sh"
        work="${RUNNER_TEMP:-/tmp}/skippr-file-copy"
        mkdir -p "${work}"
        e2e_stage_plugins .github/actions/e2e/file_copy/skippr.yml file_copy "${work}/manifests"
        export COPY_WORK="${work}"
        python3 .github/actions/e2e/file_copy/run_matrix.py
        e2e_assert_downloaded 'skippr-plugin-data-source-file*' 'skippr-plugin-data-sink-file*'
