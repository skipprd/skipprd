# skippr-perf-db: ingest then skipprd query. File parquet Iceberg vs DuckDB.
# WAL leftover import is out of suite.
# CDC: SnapshotThenLogExactOnce for Postgres, MySQL, DynamoDB (count / update /
# late-delete / reinsert / sum / overlap / iceberg-only), plus ALTER on that lake
# then continue CDC then query.
# File migrate cells ALTER already-ingested rows, ingest a second batch, then query.
# Ops/aggregates/migrate: historical = drained DuckDB SELECT; stream = SkipprLake STREAM with live WAL pin.
# wal_pin: drained = the measured query pinned no WAL (W \ E empty, lake only);
#          live    = the measured query read WAL held behind the compaction hold.
defaults:
  rows: 10000
  smoke_rows: 200
  linux_rows: 50000
  required_perf: [sync, query_collect, query_pin]
  table: events

scenarios:
  q-wal-count-iceberg:
    group: smoke
    kind: query_after_ingest
    sink: skipprlake
    fixture: exact_arrow
    sql: "SELECT count(*) AS n FROM perf_cell.perf_cell"
    asserts:
      query_count: true
      iceberg_parquet: true

  q-wal-point-iceberg:
    group: smoke
    kind: query_after_ingest
    sink: skipprlake
    fixture: exact_arrow
    sql: "SELECT id FROM perf_cell.perf_cell WHERE id = 1"
    asserts:
      query_point: true
      iceberg_parquet: true

  q-union-count-duckdb:
    group: smoke
    kind: query_after_ingest
    sink: duckdb
    fixture: exact_arrow
    sql: "SELECT count(*) AS n FROM perf_cell.perf_cell"
    asserts:
      query_count: true
      iceberg_parquet: true

  q-wal-group-iceberg:
    group: always
    kind: query_after_ingest
    sink: skipprlake
    fixture: exact_arrow
    sql: "SELECT count(*) AS n FROM perf_cell.perf_cell GROUP BY name"
    asserts:
      query_group: true
      iceberg_parquet: true

  q-stream-tail-iceberg:
    group: always
    kind: query_after_ingest
    sink: skipprlake
    fixture: exact_arrow
    wal_tail: true
    sql: "STREAM * FROM perf_cell LIMIT 10"
    asserts:
      stream_limit: true
      iceberg_parquet: true
      wal_pin: live

  q-iceberg-only-iceberg:
    group: always
    kind: query_after_ingest
    sink: skipprlake
    fixture: exact_arrow
    sql: "SELECT count(*) AS n FROM perf_cell.perf_cell"
