name: Runtime E2E Scenario
description: Run a runtime scenario through the skipprd harness.
inputs:
  scenario:
    description: 'Harness scenario name to run'
    required: true
  architecture_name:
    description: 'Artifact architecture name, e.g. linux_x86, macos_arm64, or windows_x86'
    required: true
    default: 'linux_x86'
  r2_account_id:
    required: false
    default: ""
  r2_access_key_id:
    required: false
    default: ""
  r2_secret_access_key:
    required: false
    default: ""
  runtime_plugin_versions:
    description: 'Optional newline-delimited PLUGIN=VERSION pins passed to the runtime e2e harness'
    required: false
    default: ""
  skipprd_path:
    description: 'Path to the skipprd binary under test.'
    required: false
    default: ""
  plugin_binaries_dir:
    description: 'Directory of prebuilt runtime plugin binaries (linux_x86 artifact).'
    required: false
    default: ""
  test_namespace:
    description: 'Optional suffix used to isolate pipeline names and destination databases.'
    required: false
    default: ""
  mode:
    description: 'Harness mode to run: smoke or full.'
    required: false
    default: "full"
runs:
  using: "composite"
  steps:
    - name: Install Python deps
      shell: bash
      run: python3 -m pip install --quiet boto3
    - name: Install DuckDB CLI
      shell: bash
      run: |
        set -euo pipefail
        if command -v duckdb >/dev/null 2>&1; then
          duckdb --version
          exit 0
        fi
        curl -fsSL https://install.duckdb.org | sh
        echo "${HOME}/.duckdb/cli/latest" >> "$GITHUB_PATH"
    - name: Start DynamoDB Local for SkipprLake catalog
      if: inputs.scenario == 'bike_hire_many'
      shell: bash
      run: |
        set -euo pipefail
        docker rm -f skippr-chaos-ddb >/dev/null 2>&1 || true
        docker run -d --name skippr-chaos-ddb -p 18010:8000 amazon/dynamodb-local \
          -jar DynamoDBLocal.jar -sharedDb -inMemory
        python3 - <<'PY'
        import time
        import boto3
        from botocore.config import Config as BotoConfig
        from botocore.exceptions import ClientError
        endpoint = "http://127.0.0.1:18010"
        client = boto3.client(
            "dynamodb",
            endpoint_url=endpoint,
            region_name="us-east-1",
            aws_access_key_id="local",
            aws_secret_access_key="local",
            config=BotoConfig(retries={"max_attempts": 8}),
        )
        deadline = time.time() + 30
        while time.time() < deadline:
            try:
                client.list_tables()
                break
            except Exception:
                time.sleep(0.5)
        else:
            raise SystemExit("DynamoDB Local did not become ready")
        name = "skippr-chaos-catalog"
        try:
            client.delete_table(TableName=name)
            client.get_waiter("table_not_exists").wait(TableName=name)
        except ClientError:
            pass
        client.create_table(
            TableName=name,
            AttributeDefinitions=[
                {"AttributeName": "PK", "AttributeType": "S"},
                {"AttributeName": "SK", "AttributeType": "S"},
            ],
            KeySchema=[
                {"AttributeName": "PK", "KeyType": "HASH"},
                {"AttributeName": "SK", "KeyType": "RANGE"},
            ],
            BillingMode="PAY_PER_REQUEST",
        )
        client.get_waiter("table_exists").wait(TableName=name)
        PY
    - name: Stage local runtime plugins from release artifact
      if: inputs.plugin_binaries_dir != ''
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p target/release
        cp "${{ inputs.plugin_binaries_dir }}"/* target/release/
        chmod +x target/release/skippr-plugin-* || true
        python3 .github/scripts/local_runtime_plugins.py \
          --config .github/actions/e2e/${{ inputs.scenario }}/skippr.yml \
          --pipeline ${{ inputs.scenario }} \
          --output-dir "${RUNNER_TEMP}/local-runtime-manifests" \
          --release \
          --skip-cargo-build
        echo "SKIPPR_LOCAL_RUNTIME_PLUGIN_MANIFEST_DIR=${RUNNER_TEMP}/local-runtime-manifests" >> "$GITHUB_ENV"
        echo "USE_LOCAL_PLUGIN_CODE=1" >> "$GITHUB_ENV"
    - name: Run runtime e2e harness scenario
      shell: bash
      env:
        R2_ACCOUNT_ID: ${{ inputs.r2_account_id }}
        R2_ACCESS_KEY_ID: ${{ inputs.r2_access_key_id }}
        R2_SECRET_ACCESS_KEY: ${{ inputs.r2_secret_access_key }}
        AWS_ACCESS_KEY_ID: ${{ inputs.r2_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2_secret_access_key }}
        AWS_DEFAULT_REGION: auto
        AWS_EC2_METADATA_DISABLED: "true"
        AWS_ENDPOINT_URL_DYNAMODB: http://127.0.0.1:18010
      run: |
        set -euo pipefail
        runtime_plugin_args=()
        while IFS= read -r runtime_plugin_version; do
          runtime_plugin_version="${runtime_plugin_version#"${runtime_plugin_version%%[![:space:]]*}"}"
          runtime_plugin_version="${runtime_plugin_version%"${runtime_plugin_version##*[![:space:]]}"}"
          if [[ -z "${runtime_plugin_version}" ]]; then
            continue
          fi
          runtime_plugin_args+=(
            --runtime-plugin-version
            "${runtime_plugin_version}"
          )
        done <<< "${{ inputs.runtime_plugin_versions }}"
        skipprd_path="${{ inputs.skipprd_path }}"
        if [[ -z "${skipprd_path}" ]]; then
          skipprd_path="./skipprd-${{ inputs.architecture_name }}/skipprd"
        fi
        namespace_args=()
        if [[ -n "${{ inputs.test_namespace }}" ]]; then
          namespace_args=(--namespace "${{ inputs.test_namespace }}")
        fi
        work="${RUNNER_TEMP:-/tmp}/skippr-${{ inputs.scenario }}"
        mkdir -p "${work}/warehouse" "${work}/data"
        export SKIPPR_E2E_LAKE_WAREHOUSE="file://${work}/warehouse"
        if [[ -n "${R2_ACCOUNT_ID}" ]]; then
          export SKIPPR_E2E_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
        fi
        export DATA_DIR="${work}/data"
        export DATA_DIR_MIN_FREE_BYTES=0
        python3 .github/scripts/runtime_e2e_harness.py run "${{ inputs.scenario }}" --mode "${{ inputs.mode }}" --skipprd "${skipprd_path}" "${namespace_args[@]}" "${runtime_plugin_args[@]}"
