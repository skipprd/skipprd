name: MSSQL to Snowflake E2E
inputs:
  architecture_name:
    description: 'Artifact architecture name, e.g. windows_x86'
    required: true
runs:
  using: "composite"
  steps:
    - name: Run MSSQL to Snowflake via skippr
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $requiredEnv = @(
          "SKIPPR_API_KEY",
          "SNOWFLAKE_ACCOUNT",
          "SNOWFLAKE_USER",
          "SNOWFLAKE_PRIVATE_KEY_PEM",
          "SNOWFLAKE_WAREHOUSE",
          "SNOWFLAKE_DATABASE",
          "SNOWFLAKE_SCHEMA"
        )
        foreach ($key in $requiredEnv) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) {
            Write-Error "::error::Required environment variable $key is not set"
          }
        }

        $skipprBin = (Resolve-Path ".\skippr-${{ inputs.architecture_name }}\skippr.exe").Path
        $skipprdBin = (Resolve-Path ".\skipprd-${{ inputs.architecture_name }}\skipprd.exe").Path
        $env:PATH = "$(Split-Path $skipprdBin);$(Split-Path $skipprBin);$env:PATH"

        $workdir = Join-Path $env:RUNNER_TEMP ("mssql-snowflake-" + [guid]::NewGuid().ToString("N"))
        New-Item -ItemType Directory -Force -Path $workdir | Out-Null
        $composePath = ".\.github\actions\e2e\mssql_snowflake\compose.yaml"

        try {
          Write-Host "Writing Snowflake private key"
          $pem = $env:SNOWFLAKE_PRIVATE_KEY_PEM
          if ($pem.Contains("\n") -and -not $pem.Contains("`n")) {
            $pem = $pem.Replace("\n", "`n")
          }
          $keyPath = Join-Path $workdir "snowflake_key.p8"
          Set-Content -Path $keyPath -Value $pem.TrimEnd() -NoNewline -Encoding ascii
          $env:SNOWFLAKE_PRIVATE_KEY_PATH = $keyPath

          Write-Host "Starting MSSQL seed services"
          docker compose -f $composePath up -d
          $seedCompleted = $false
          for ($i = 1; $i -le 120; $i++) {
            $seedStatusRaw = docker compose -f $composePath ps --format json seed 2>$null
            if ($seedStatusRaw -match '"exited"') {
              $seedStatusAllRaw = docker compose -f $composePath ps -a --format json seed 2>$null
              $seedStatus = $seedStatusAllRaw | ConvertFrom-Json
              if ($seedStatus -is [array]) {
                $seedExit = $seedStatus[0].ExitCode
                if ($null -eq $seedExit) { $seedExit = $seedStatus[0].exit_code }
              } else {
                $seedExit = $seedStatus.ExitCode
                if ($null -eq $seedExit) { $seedExit = $seedStatus.exit_code }
              }
              if ("$seedExit" -eq "0") {
                Write-Host "MSSQL seed completed"
                $seedCompleted = $true
                break
              }
              docker compose -f $composePath logs
              Write-Error "::error::MSSQL seed failed with exit code $seedExit"
            }
            Start-Sleep -Seconds 3
          }
          if (-not $seedCompleted) {
            docker compose -f $composePath logs
            Write-Error "::error::Timed out waiting for MSSQL seed"
          }

          $env:MSSQL_CONNECTION_STRING = "server=tcp:127.0.0.1,1433;database=testdb;user id=sa;password=Skippr!Test123;TrustServerCertificate=true"
          $runId = if ($env:GITHUB_RUN_ID) { $env:GITHUB_RUN_ID } else { "local" }
          $runAttempt = if ($env:GITHUB_RUN_ATTEMPT) { $env:GITHUB_RUN_ATTEMPT } else { "1" }
          $projectName = "mssql_snowflake_e2e_${runId}_${runAttempt}"
          $configPath = Join-Path $workdir "skippr.yaml"
          $configLines = @(
            "project: $projectName",
            "warehouse:",
            "  kind: snowflake",
            "  database: $env:SNOWFLAKE_DATABASE",
            "  schema: $env:SNOWFLAKE_SCHEMA",
            "  warehouse: $env:SNOWFLAKE_WAREHOUSE",
            "  role: $env:SNOWFLAKE_ROLE",
            "source:",
            "  kind: mssql",
            "  connection_string: ${env:MSSQL_CONNECTION_STRING}",
            "dbt:",
            "  target_schema: $projectName",
            "  silver_suffix: silver",
            "  gold_suffix: gold",
            "schema_sink: null"
          )
          Set-Content -Path $configPath -Value ($configLines -join "`n") -Encoding utf8

          Write-Host "Running skippr doctor"
          & $skipprBin --config $configPath doctor

          Write-Host "Running skippr MSSQL to Snowflake e2e"
          $logPath = Join-Path $workdir "skippr-run.log"
          & $skipprBin --config $configPath run --log trace 2>&1 | Tee-Object -FilePath $logPath
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Error "::error::skippr run failed with exit code $status"
          }
          if (-not (Select-String -Path $logPath -Pattern '^Done\.$' -Quiet)) {
            Write-Error "::error::skippr run exited successfully but did not print final Done line. This catches the silent-exit regression where the wrapper returns right after printing the run id."
          }
        } finally {
          docker compose -f $composePath down -v 2>$null
          Remove-Item -Recurse -Force $workdir -ErrorAction SilentlyContinue
        }
