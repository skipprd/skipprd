[package]
name = "skippr-plugin-data-sink-synapse"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-sink-synapse"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true
bytes.workspace = true
hex.workspace = true
parquet.workspace = true

arrow = { version = "58.3.0", features = ["ipc_compression"] }
async-trait = "0.1.77"
dashmap = "5.5.3"
datafusion.workspace = true
futures = "0.3.25"
once_cell = "1.17.0"
serde.workspace = true
serde_derive = "1.0.105"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["io", "io-util", "compat"], default-features = false }
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSink"
plugin_name = "Synapse"

[package.metadata.skippr-plugin.sink_capability]
name = "Synapse"
guarantee_tier = "ExactOnceCdcEligible"
can_manage_skippr_columns = true
can_maintain_tombstone_tables = true
can_compare_order_tokens = true
supports_transactions = true
