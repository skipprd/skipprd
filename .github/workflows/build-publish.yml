            (3, true, 'insert', 30, 30000000000, 3.5, 4.5, 32.3400, DATE '2026-01-03', TIMESTAMP '2026-01-03 12:00:00', TIME '14:00:00', JSON_OBJECT('op', 'insert'), 'present');
          UPDATE type_matrix_orders SET string_col = 'updated', int_col = 11 WHERE id = 1;
          DELETE FROM type_matrix_orders WHERE id = 2;
          INSERT INTO type_matrix_orders VALUES
            (4, false, 'late-insert', 40, 40000000000, 4.5, 5.5, 42.3400, DATE '2026-01-04', TIMESTAMP '2026-01-04 12:00:00', TIME '15:00:00', JSON_OBJECT('op', 'late_insert'), 'present');
