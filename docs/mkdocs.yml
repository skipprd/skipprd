site_name: Skippr Developer & Maintainer Docs
repo_url: https://github.com/skipprd/skipprd
site_description: Developer and maintainer guide for Skippr's ingest host, runtime plugin system, CI harness, and release workflow.
docs_dir: docs
site_dir: public-docs
theme:
  name: material
  custom_dir: overrides
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_javascript:
  - javascript/ga-events.js
extra_css:
  - stylesheets/app.css
nav:
  - Home: index.md
  - Maintainers:
      - Repository Map: maintainers/repository-map.md
      - Local Development: maintainers/local-development.md
      - Runtime Plugins: maintainers/runtime-plugins.md
      - Runtime Plugin Contract: maintainers/runtime-plugin-contract.md
      - Runtime E2E Harness: maintainers/runtime-e2e-harness.md
      - Release Workflow: maintainers/release-workflow.md
  - Architecture:
      - How Skippr Works: concepts/how-it-works.md
      - Exactly-Once Delivery: concepts/exactly-once.md
      - Schema Discovery & Evolution: concepts/schema.md
      - Source Landing Semantics: concepts/source-landing-semantics.md
      - GA4 Bronze & Modeling: concepts/ga4-bronze-and-modeling.md
      - Deadletters: concepts/deadletters.md
  - Operator Guides:
      - Installation: getting-started/install.md
      - Quick Start: getting-started/quickstart.md
  - Reference:
      - CLI:
          - discover: cli/discover.md
          - sync: cli/sync.md
          - query: cli/query.md
          - schema: cli/schema.md
          - sql-help: cli/sql-help.md
          - benchmark: cli/benchmark.md
      - SQL Reference: sql/reference.md
      - Configuration:
          - Overview: configuration/overview.md
          - Pipeline & Workspace: configuration/pipeline.md
          - Input Source: configuration/input.md
          - Output Destination: configuration/output.md
          - Transforms: configuration/transforms.md
          - Buffering & WAL: configuration/buffering.md
          - Advanced: configuration/advanced.md
      - Connectors:
          - Inputs:
              - Databases:
                  - ClickHouse: connectors/inputs/clickhouse.md
                  - DynamoDB: connectors/inputs/dynamodb.md
                  - MongoDB: connectors/inputs/mongodb.md
                  - MotherDuck: connectors/inputs/motherduck.md
                  - MSSQL: connectors/inputs/mssql.md
                  - MySQL: connectors/inputs/mysql.md
                  - PostgreSQL: connectors/inputs/postgres.md
                  - Redshift: connectors/inputs/redshift.md
              - Object Stores:
                  - Delta Lake: connectors/inputs/delta_lake.md
                  - Local File: connectors/inputs/file.md
                  - S3: connectors/inputs/s3.md
                  - SFTP: connectors/inputs/sftp.md
              - Streaming:
                  - Kafka: connectors/inputs/kafka.md
                  - SQS: connectors/inputs/sqs.md
                  - Kinesis: connectors/inputs/kinesis.md
                  - AMQP (RabbitMQ): connectors/inputs/amqp.md
                  - SNS: connectors/inputs/sns.md
                  - EventBridge: connectors/inputs/eventbridge.md
                  - MQTT: connectors/inputs/mqtt.md
                  - WebSocket: connectors/inputs/websocket.md
              - HTTP:
                  - Google Analytics (GA4): connectors/inputs/google_analytics.md
                  - Google Search Console: connectors/inputs/google_search_console.md
                  - HTTP Client: connectors/inputs/http_client.md
                  - HTTP Server: connectors/inputs/http_server.md
              - Other:
                  - Socket (TCP/UDP/Unix): connectors/inputs/socket.md
                  - StatsD: connectors/inputs/statsd.md
                  - Stdin: connectors/inputs/stdin.md
                  - PCAP: connectors/inputs/pcap.md
          - Outputs:
              - Warehouses:
                  - Athena (S3 + Glue): connectors/outputs/athena.md
                  - BigQuery: connectors/outputs/bigquery.md
                  - ClickHouse: connectors/outputs/clickhouse.md
                  - Databricks: connectors/outputs/databricks.md
                  - MotherDuck: connectors/outputs/motherduck.md
                  - Postgres: connectors/outputs/postgres.md
                  - Redshift: connectors/outputs/redshift.md
                  - Snowflake: connectors/outputs/snowflake.md
                  - Synapse: connectors/outputs/synapse.md
              - Cloud Storage:
                  - S3: connectors/outputs/s3.md
                  - GCS: connectors/outputs/gcs.md
                  - Azure Blob: connectors/outputs/azure_blob.md
                  - SFTP: connectors/outputs/sftp.md
              - Messaging:
                  - AMQP (RabbitMQ): connectors/outputs/amqp.md
              - Other:
                  - Local File: connectors/outputs/file.md
                  - Stdout: connectors/outputs/stdout.md
  - Operations:
      - Logging Event Map: operations/logging.md
      - Troubleshooting: operations/troubleshooting.md
  - License: license.md

markdown_extensions:
  - toc:
      permalink: True

extra:
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  analytics:
    provider: google
    property: G-9FNNDBH0CQ
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/skipprd/skipprd
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/skipprdata
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/skippr-io/about/
    - icon: fontawesome/brands/slack
      link: https://skipprgroup.slack.com/ssb/redirect
  feedback:
    title: Was this page helpful?
    ratings:
      - icon: material/emoticon-happy-outline
        name: This page was helpful
        data: 1
        note: >-
          Thanks for your feedback!
      - icon: material/emoticon-sad-outline
        name: This page could be improved
        data: 0
        note: >-
          Thanks for your feedback! Help us improve this page by
          using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
