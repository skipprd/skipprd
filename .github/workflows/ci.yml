name: CI
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: [self-hosted, skippr-linux-x64-16]
    defaults:
      run:
        working-directory: skipprd
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skipprd/cloud
          path: cloud
          token: ${{ secrets.SKIPPR_CLOUD_CHECKOUT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: skipprd
      - name: Stamp package versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 .github/scripts/set_root_package_version.py \
            --workspace "$GITHUB_WORKSPACE/skipprd" \
            --version "${{ github.ref_name }}"
      - run: cargo test -p skipprd --lib
      - run: python3 .github/scripts/test_python_bindings_ci.py
      - run: ./scripts/test-python.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: skipprd/target/wheels/*.whl
          if-no-files-found: error
      - run: |
          cd docs
          npm install
          npx vitepress build
  darwin:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: [self-hosted, skippr-darwin-arm64-8]
    defaults:
      run:
        working-directory: skipprd
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skipprd/cloud
          path: cloud
          token: ${{ secrets.SKIPPR_CLOUD_CHECKOUT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: skipprd
      - name: Stamp package versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 .github/scripts/set_root_package_version.py \
            --workspace "$GITHUB_WORKSPACE/skipprd" \
            --version "${{ github.ref_name }}"
      - run: cargo test -p skipprd --lib
      - run: python3 .github/scripts/test_python_bindings_ci.py
      - run: ./scripts/test-python.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-darwin
          path: skipprd/target/wheels/*.whl
          if-no-files-found: error
  python-publish:
    if: github.repository == 'skipprd/skipprd' && startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v0.0.0'
    needs: [linux, darwin]
    runs-on: [self-hosted, skippr-linux-x64-16]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: false
