[package]
name = "skipprd-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for skipprd. Session is the engine."
publish = false

[lib]
name = "skippr"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "58.3.0", features = ["pyarrow"] }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }
serde = "1"
serde_json = "1.0.85"
skipprd = { path = ".." }
tokio = { version = "1", features = ["rt-multi-thread"] }
