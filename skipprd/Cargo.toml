[package]
name = "skipprd"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_derive = "1.0.105"
serde = "1.0.105"
serde_json = "1.0.48"
schemars = "0.7.0"
regex = "1.7.0"
memory-stats = "1.0.0"
rand = "0.8.5"
chrono = "0.4.23"
icu = "1.0.0"
array-init = "2.1.0"
envy = "0.4.2"
io = "0.0.2"
aws-config = "0.52.0"
aws-sdk-s3 = "0.22.0"
aws-types = "0.52.0"
tokio = { version = "1", features = ["full"] }
flate2 = "1.0.25"
csv = "1.1.6"
futures = "0.3.25"
periodic = "0.1.1"
glob = "0.3.0"
clap = "4.0.32"
