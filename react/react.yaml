version: 1

server:
  port: 8787

storage:
  # From repo-root skippr.yml: skippr.skippr_s3_bucket
  bucket: asgsdag-datalake

scope:
  # From repo-root skippr.yml: skippr.tenant / skippr.workspace
  tenant: picnic
  workspace: test

  # react-specific partition; closest analogue to a skippr pipeline.
  project_id: app

llm:
  # Keep secrets (api keys) in env via EnvSecretsProvider (e.g. LLM_API_KEY).
  provider: OPENAI_COMPAT
  base_url: https://api.openai.com
  chat_model: gpt-5.1
  embed_model: text-embedding-3-small
  context_length: 8192
  http_timeout_secs: 120
  max_tokens: 8192
  temperature: 0.2
  top_p: 1.0

providers:
  athena:
    enabled: true
    workgroup: picnic
    # Region matters for Athena WorkGroups; ensure dbt uses the same region as your WorkGroup.
    region: eu-west-1
    # Default database for discovery + unqualified queries.
    source_database: picnic
    # Target database for dbt-modeled outputs.
    modeled_database: picnic_warehouse
    catalog: AwsDataCatalog
    result_s3: s3://asgsdag-datalake/
    discovery_cache_ttl_secs: 120

  catalog:
    enabled: true
    refresh_secs: 10800 # 3 hours
    max_concurrency: 8

  dbt:
    enabled: true
    # Run dbt on the host (e.g. local venv), not via Docker.
    runner: host
    target: athena

  vector:
    enabled: true
