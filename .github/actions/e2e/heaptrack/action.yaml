name: Heaptrack
description: "Heaptrack ingest-A through the skippr-perf harness."
inputs:
  skipprd_path:
    required: true
  plugin_binaries_dir:
    required: false
    default: ""
  scale:
    required: false
    default: linux
  workspace-root:
    required: false
    default: "."
  scenario:
    required: false
    default: ingest-a-duckdb
runs:
  using: composite
  steps:
    - name: Install heaptrack (linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y heaptrack
    - name: Heaptrack ingest-A
      shell: bash
      working-directory: ${{ inputs.workspace-root }}
      env:
        SKIPPRD_BIN: ${{ inputs.skipprd_path }}
        PLUGIN_BINARIES_DIR: ${{ inputs.plugin_binaries_dir }}
        SKIPPR_LOG_LEVEL: perf
        PERF_SCENARIO: ${{ inputs.scenario }}
        PERF_SCALE: ${{ inputs.scale }}
        PERF_PROFILE: heaptrack
        PERF_WORK: ${{ runner.temp }}/skippr-perf-heaptrack
      run: |
        set -euo pipefail
        bash .github/scripts/run_perf_cell.sh
        shopt -s nullglob
        copied=0
        for zst in "${PERF_WORK}/${PERF_SCENARIO}"/heaptrack*; do
          cp "${zst}" "${GITHUB_WORKSPACE}/heaptrack_output${zst##*heaptrack}"
          copied=1
        done
        if [ "${copied}" -eq 0 ]; then
          echo "heaptrack produced no profile under ${PERF_WORK}/${PERF_SCENARIO}" >&2
          exit 1
        fi
    - name: Upload heaptrack output
      uses: actions/upload-artifact@v4
      with:
        name: heaptrack-output
        path: heaptrack_output*
        if-no-files-found: error
