  publish_skippr_el:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/test')
    needs:
     - linux_x86_test
     - chaos_mode_test
     - s3_wal_test
     - macos_arm64
     - windows_x86
    runs-on: ubuntu-latest
    steps:
     - name: Check out code
       uses: actions/checkout@v3
     - name: Download Artifacts
       uses: actions/download-artifact@v4
     - name: Compress Release Artifacts
       run: |
         tar -czvf skippr-el-linux_x86.tar.gz skippr-el-linux_x86/
         tar -czvf skippr-el-macos_arm64.tar.gz skippr-el-macos_arm64/
         tar -czvf skippr-el-windows_x86.tar.gz skippr-el-windows_x86/
     - name: Create or update GitHub Release
       env:
         GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
       run: |
         TAG="${{ github.ref_name }}"
         # Create release if it doesn't exist; update body if it does
         if gh release view "$TAG" --repo skipprd/skipprd >/dev/null 2>&1; then
           gh release edit "$TAG" \
             --repo skipprd/skipprd \
             --title "Release $TAG" \
             --notes-file CHANGELOG.txt
         else
           gh release create "$TAG" \
             --repo skipprd/skipprd \
             --title "Release $TAG" \
             --notes-file CHANGELOG.txt
         fi
         # Upload assets — --clobber overwrites same-name files
         # but never deletes other assets (e.g. skippr-* from react CI)
         gh release upload "$TAG" \
           install.sh \
           skippr-el-linux_x86.tar.gz \
           skippr-el-macos_arm64.tar.gz \
           skippr-el-windows_x86.tar.gz \
           --repo skipprd/skipprd \
           --clobber
     - name: Configure AWS credentials for release upload
       uses: aws-actions/configure-aws-credentials@v4
       with:
         aws-access-key-id: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
         aws-region: us-east-1
     - name: Upload binaries to install releases bucket
       run: |
         TAG="${{ github.ref_name }}"
         BUCKET="${{ env.RELEASES_BUCKET }}"
         LATEST_POINTER="${{ env.SKIPPR_EL_LATEST_POINTER }}"
         for f in skippr-el-*.tar.gz; do
           aws s3 cp "$f" "s3://${BUCKET}/releases/${TAG}/${f}"
         done
         printf '%s' "$TAG" > "$LATEST_POINTER"
         aws s3 cp "$LATEST_POINTER" "s3://${BUCKET}/releases/${LATEST_POINTER}" --cache-control "no-cache, no-store, must-revalidate"



