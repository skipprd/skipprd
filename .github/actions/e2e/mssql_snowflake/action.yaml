name: MSSQL to Snowflake E2E
description: Run the Windows MSSQL to Snowflake skippr E2E scenario.
inputs:
  architecture_name:
    description: 'Artifact architecture name, e.g. windows_x86'
    required: true
  test_namespace:
    description: 'Stable suffix used to isolate pipeline names and Snowflake schemas.'
    required: false
    default: 'cargo_build'
runs:
  using: "composite"
  steps:
    - name: Validate e2e secrets
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $requiredEnv = @(
          "SKIPPR_API_KEY",
          "SNOWFLAKE_ACCOUNT",
          "SNOWFLAKE_USER",
          "SNOWFLAKE_PRIVATE_KEY_PEM",
          "SNOWFLAKE_WAREHOUSE",
          "SNOWFLAKE_DATABASE",
          "SNOWFLAKE_SCHEMA"
        )
        foreach ($key in $requiredEnv) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) {
            Write-Error "::error::Required environment variable $key is not set"
          }
        }

        $apiKey = $env:SKIPPR_API_KEY.Trim()
        if (-not $apiKey.StartsWith("sk_live_")) {
          Write-Error "::error::SKIPPR_API_KEY must be a Skippr API key created by 'skippr user create-api-key' and start with sk_live_. Check the Skippr GitHub environment secret."
        }

    - name: Set up Python for dbt
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dbt for Snowflake
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        python -m pip install --upgrade pip
        python -m pip install dbt-core dbt-snowflake
        dbt --version

    - name: Install SQL Server on Windows runner
      uses: potatoqualitee/mssqlsuite@v1.12
      with:
        install: sqlengine, sqlclient
        sa-password: "Skippr!Test123"

    - name: Run MSSQL to Snowflake via skippr
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # Depot/GitHub runners can expose short-lived AWS session-token variables.
        # This scenario uses explicit long-lived CI access key secrets; an inherited
        # stale session token makes the AWS SDK fail with ExpiredToken.
        Remove-Item Env:AWS_SESSION_TOKEN -ErrorAction SilentlyContinue
        Remove-Item Env:AWS_SECURITY_TOKEN -ErrorAction SilentlyContinue

        $skipprArtifact = ".\skippr-${{ inputs.architecture_name }}\skippr.exe"
        if (Test-Path $skipprArtifact) {
          $skipprBin = (Resolve-Path $skipprArtifact).Path
          $env:PATH = "$(Split-Path $skipprBin);$env:PATH"
        } else {
          $skipprBin = (Get-Command skippr -ErrorAction Stop).Source
        }

        $skipprdArtifact = ".\skipprd-${{ inputs.architecture_name }}\skipprd.exe"
        if (Test-Path $skipprdArtifact) {
          $skipprdBin = (Resolve-Path $skipprdArtifact).Path
          $env:PATH = "$(Split-Path $skipprdBin);$env:PATH"
        }

        $workdir = Join-Path $env:RUNNER_TEMP ("mssql-snowflake-" + [guid]::NewGuid().ToString("N"))
        New-Item -ItemType Directory -Force -Path $workdir | Out-Null
        $pushedLocation = $false

        try {
          Write-Host "Writing Snowflake private key"
          $pem = $env:SNOWFLAKE_PRIVATE_KEY_PEM
          if ($pem.Contains("\n") -and -not $pem.Contains("`n")) {
            $pem = $pem.Replace("\n", "`n")
          }
          $keyPath = Join-Path $workdir "snowflake_key.p8"
          Set-Content -Path $keyPath -Value $pem.TrimEnd() -NoNewline -Encoding ascii
          $env:SNOWFLAKE_PRIVATE_KEY_PATH = $keyPath

          Write-Host "Seeding local SQL Server"
          $sqlcmd = (Get-Command sqlcmd -ErrorAction Stop).Source
          & $sqlcmd -S localhost -U sa -P "Skippr!Test123" -C -Q "IF DB_ID('testdb') IS NOT NULL BEGIN ALTER DATABASE testdb SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE testdb; END; CREATE DATABASE testdb;"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::Failed to create MSSQL test database"
          }
          $seedPath = ".\.github\actions\e2e\mssql_snowflake\seed.sql"
          & $sqlcmd -S localhost -U sa -P "Skippr!Test123" -C -d testdb -i $seedPath
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::Failed to seed MSSQL test database"
          }

          $env:MSSQL_CONNECTION_STRING = "server=tcp:127.0.0.1,1433;database=testdb;user id=sa;password=Skippr!Test123;TrustServerCertificate=true"
          $env:SKIPPR_RUNTIME_LOG_LEVEL = "debug"
          $runId = if ($env:GITHUB_RUN_ID) { $env:GITHUB_RUN_ID } else { "local" }
          $runAttempt = if ($env:GITHUB_RUN_ATTEMPT) { $env:GITHUB_RUN_ATTEMPT } else { "1" }
          $rawNamespace = "${{ inputs.test_namespace }}"
          if ([string]::IsNullOrWhiteSpace($rawNamespace)) {
            $rawNamespace = "cargo_build"
          }
          $testNamespace = ($rawNamespace.ToLowerInvariant() -replace '[^a-z0-9_]+', '_').Trim('_')
          if ([string]::IsNullOrWhiteSpace($testNamespace)) {
            $testNamespace = "cargo_build"
          }
          $projectName = "mssql_snowflake_e2e_${testNamespace}_${runId}_${runAttempt}"
          $targetSchema = "${env:SNOWFLAKE_SCHEMA}_${testNamespace}_${runId}_${runAttempt}".ToUpperInvariant()
          $env:DATA_DIR = Join-Path $workdir "data"
          $configPath = Join-Path $workdir "skippr.yml"

          function ConvertTo-YamlSingleQuoted([string] $value) {
            return "'" + ($value -replace "'", "''") + "'"
          }

          $configLines = @(
            "skippr:",
            "  workspace: $projectName",
            "pipelines:",
            "  ${projectName}:",
            "    data_source: data_sources.mssql",
            "    data_sink: data_sinks.snowflake"
          ) + @(
            "data_sources:",
            "  mssql:",
            "    Mssql:",
            "      connection_string: `${MSSQL_CONNECTION_STRING}",
            "      tables: [dbo.customers, dbo.orders, dbo.order_items]",
            "data_sinks:",
            "  snowflake:",
            "    Snowflake:",
            "      account: `${SNOWFLAKE_ACCOUNT}",
            "      user: `${SNOWFLAKE_USER}",
            "      database: `${SNOWFLAKE_DATABASE}",
            "      schema: $targetSchema",
            "      warehouse: `${SNOWFLAKE_WAREHOUSE}",
            "      private_key_path: `${SNOWFLAKE_PRIVATE_KEY_PATH}"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:SNOWFLAKE_ROLE)) {
            $configLines += "      role: `${SNOWFLAKE_ROLE}"
          }
          $configLines += "schema_sinks: {}"
          Set-Content -Path $configPath -Value ($configLines -join "`n") -Encoding utf8

          Push-Location $workdir
          $pushedLocation = $true

          Write-Host "Running skippr doctor"
          & $skipprBin --config $configPath doctor
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::skippr doctor failed with exit code $LASTEXITCODE"
          }

          Write-Host "Running skippr MSSQL to Snowflake discover/sync/model e2e"
          $logPath = Join-Path $workdir "skippr-model.log"
          & $skipprBin --config $configPath discover --pipeline $projectName --output json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::skippr discover failed with exit code $LASTEXITCODE"
          }
          & $skipprBin --config $configPath sync --pipeline $projectName --once --output json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::skippr sync failed with exit code $LASTEXITCODE"
          }

          Write-Host "Verifying Snowflake raw timestamp and decimal types"
          $checkScript = Join-Path $workdir "assert_snowflake_raw_types.py"
          Set-Content -Path $checkScript -Encoding utf8 -Value @'
        import os
        from decimal import Decimal
        import snowflake.connector
        from cryptography.hazmat.primitives import serialization

        with open(os.environ["SNOWFLAKE_PRIVATE_KEY_PATH"], "rb") as handle:
            private_key = serialization.load_pem_private_key(handle.read(), password=None)
        private_key_der = private_key.private_bytes(
            encoding=serialization.Encoding.DER,
            format=serialization.PrivateFormat.PKCS8,
            encryption_algorithm=serialization.NoEncryption(),
        )

        ctx = snowflake.connector.connect(
            account=os.environ["SNOWFLAKE_ACCOUNT"],
            user=os.environ["SNOWFLAKE_USER"],
            private_key=private_key_der,
            warehouse=os.environ["SNOWFLAKE_WAREHOUSE"],
            database=os.environ["SNOWFLAKE_DATABASE"],
            schema=os.environ["SNOWFLAKE_TARGET_SCHEMA"],
            role=os.environ.get("SNOWFLAKE_ROLE") or None,
        )
        try:
            cur = ctx.cursor()
            cur.execute(
                """
                SELECT DATA_TYPE, NUMERIC_PRECISION, NUMERIC_SCALE
                FROM INFORMATION_SCHEMA.COLUMNS
                WHERE TABLE_CATALOG = %s
                  AND TABLE_SCHEMA = %s
                  AND TABLE_NAME = 'ORDER_ITEMS'
                  AND COLUMN_NAME = 'UNIT_PRICE'
                """,
                (os.environ["SNOWFLAKE_DATABASE"].upper(), os.environ["SNOWFLAKE_TARGET_SCHEMA"].upper()),
            )
            column = cur.fetchone()
            if column is None:
                raise SystemExit("UNIT_PRICE column was not found in ORDER_ITEMS")
            data_type, precision, scale = column
            if data_type != "NUMBER" or int(scale) <= 0:
                raise SystemExit(f"expected UNIT_PRICE numeric with a decimal scale, got {column!r}")

            cur.execute(
                'SELECT TO_CHAR(PLACED_AT, \'YYYY-MM-DD HH24:MI:SS\'), TOTAL_AMOUNT FROM "'
                + os.environ["SNOWFLAKE_DATABASE"].upper()
                + '"."'
                + os.environ["SNOWFLAKE_TARGET_SCHEMA"].upper()
                + '"."ORDERS" WHERE ORDER_ID = %s',
                ("o1",),
            )
            order = cur.fetchone()
            if order != ("2025-01-03 09:15:00", Decimal("120.50")):
                raise SystemExit(f"unexpected ORDERS o1 values: {order!r}")

            cur.execute(
                'SELECT UNIT_PRICE FROM "'
                + os.environ["SNOWFLAKE_DATABASE"].upper()
                + '"."'
                + os.environ["SNOWFLAKE_TARGET_SCHEMA"].upper()
                + '"."ORDER_ITEMS" WHERE ORDER_ITEM_ID = %s',
                ("oi1",),
            )
            item = cur.fetchone()
            if item != (Decimal("50.00"),):
                raise SystemExit(f"unexpected ORDER_ITEMS oi1 UNIT_PRICE: {item!r}")
        finally:
            ctx.close()
        '@
          $env:SNOWFLAKE_TARGET_SCHEMA = $targetSchema
          python $checkScript
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::Snowflake raw type assertion failed with exit code $LASTEXITCODE"
          }

          & $skipprBin --config $configPath --log info model --pipeline mssql-migration --no-resume 2>&1 | Tee-Object -FilePath $logPath
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Error "::error::skippr model failed with exit code $status"
          }
          if (-not (Select-String -Path $logPath -Pattern '^Done\.$' -Quiet)) {
            Write-Error "::error::skippr model exited successfully but did not print final Done line."
          }
        } finally {
          if ($pushedLocation) {
            Pop-Location
          }
          Remove-Item -Recurse -Force $workdir -ErrorAction SilentlyContinue
        }
