skippr:
  skippr_s3_bucket: skippr-e2e-sample-data-output
  tenant: default
  workspace: default

pipelines:
#  cloud_trail:
#    auto_approve: yes
#    env: dev
#    buffer_threshold_bytes: 2000000
#    buffer_threshold_seconds: 600
#    transform:
#      batch_time_fields: eventTime
#      batch_time_unit: day
#      record_field_path: Records
#      batch_partition_fields: eventSource
#    data_source: data_sources.cloud_trail

  bike_hire:
    auto_approve: yes
    env: dev
    buffer_threshold_bytes: 10000000
    buffer_threshold_seconds: 60
    transform:
      batch_time_fields: event_date
      batch_time_unit: day
      time_partition_prefix: date_
      batch_partition_fields: event_type
    data_source: data_sources.s3_bike_hire
    data_sink: data_sinks.test_datalake

  very_small_files:
    env: dev
#    sync_frequency_seconds: 10
    buffer_threshold_bytes: 100000000
    buffer_threshold_seconds: 300
    data_source: data_sources.very_small_files

  metrics:
    env: dev
    auto_approve: yes
    buffer_threshold_bytes: 20000000
    buffer_threshold_seconds: 60
    transform:
      batch_time_fields: datetime
      batch_time_unit: day
      namespace_fields: type
    data_source: data_sources.metrics



data_sources:
  cloud_trail:
    s3:
      batch_size_bytes: 10000000
      s3_bucket: aws-cloudtrail-logs-201015722121-1d5e4776
      s3_prefix: AWSLogs/201015722121/CloudTrail/eu-west-1/
  s3_bike_hire:
    s3:
      # version: 0.1.1
      batch_size_bytes: 2048000
      s3_bucket: skippr-e2e-sample-data
      s3_prefix: bike-hire/
  very_small_files:
    s3:
      batch_size_bytes: 2048000
#      s3_bucket: skippr-dev-sample-data
      s3_bucket: skippr-e2e-sample-data
      s3_prefix: very-small-files/
  metrics:
    s3:
      batch_size_bytes: 2048000
      s3_bucket: skippr-metric-test
      s3_prefix: compacted/metric
      s3_prefix_ordered_depth: 5
      s3_delimiter: /


data_sinks:
  test_datalake:
    schema_sink: schema_sinks.glue_datalake
    Athena:
      # version: 0.1.1
      athena_workgroup_name: bikehire
      s3_bucket: skippr-e2e-sample-data-output
      athena_results_s3_bucket: skippr-e2e-sample-data-output
      s3_prefix: bikehire

schema_sinks:
  glue_datalake:
    Glue:
      # version: 0.1.1
      glue_database_name: datalake