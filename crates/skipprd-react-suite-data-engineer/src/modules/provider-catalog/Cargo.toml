[package]
name = "react-module-provider-catalog"
version = "0.0.0-git"
edition = "2021"

[dependencies]
async-trait = "0.1.77"
chrono = "=0.4.42"
futures-util = "0.3"
serde = "1.0.105"
serde_json = "1.0.85"
serde_yaml = "0.9.16"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
react-core = { workspace = true, features = ["progress"] }
react-suite-data-engineer = { path = "../../.." }

[dev-dependencies]
react-module-storage-memory.workspace = true
