[package]
name = "skippr-plugin-data-source-websocket"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-websocket"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-core.workspace = true
skippr-runtime-sdk.workspace = true

futures = "0.3.25"
serde.workspace = true
serde_derive = "1.0.105"
tokio-tungstenite = { version = "0.21" }
tracing = "0.1"
tungstenite = { version = "0.21" }
url = "2.3.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "Websocket"

[package.metadata.skippr-plugin.source_capability]
name = "Websocket"
guarantee_tier = "UserSuppliedIdentityOnly"
checkpoint_style = "None"
bootstrap_style = "StreamOnly"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "UserSupplied"
