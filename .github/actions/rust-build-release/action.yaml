name: Rust Build Release
description: 'Rust release; caller must checkout repo with submodules'
inputs:
  rust-version:
    description: 'version of rust to install (e.g. stable)'
    required: true
    default: 'stable'
  architecture_name:
    description: 'macos_arm64, macos-x86, linux_x86'
    required: true
    default: 'stable'
  runtime_plugin_packages_json:
    description: 'JSON array of runtime plugin package names to build for this release'
    required: false
    default: '[]'
runs:
  using: "composite"
  steps:
    - name: Install system dependencies (linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ "$(id -u)" = "0" ]; then
          apt-get update
          apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev libssl-dev pkg-config
        else
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev libssl-dev pkg-config
        fi
    - name: Install system dependencies (macos)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v protoc >/dev/null 2>&1; then
          brew install protobuf
        fi
    - name: Setup Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable
        rustup default stable
        rustup component add rustfmt
    - name: Install sccache
      if: env.SCCACHE_BUCKET != ''
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: v0.10.0
    - name: Configure sccache
      if: env.SCCACHE_BUCKET != ''
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
        if [[ -z "${SCCACHE_ENDPOINT:-}" && -n "${R2_ACCOUNT_ID:-}" ]]; then
          echo "SCCACHE_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
        fi
        if [[ -z "${AWS_ENDPOINT_URL:-}" && -n "${R2_ACCOUNT_ID:-}" ]]; then
          echo "AWS_ENDPOINT_URL=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
        fi

    - name: Disable debuginfo generation
      shell: bash
      run: echo "RUSTFLAGS=-C debuginfo=0" >> $GITHUB_ENV
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: v2-release-${{ inputs.architecture_name }}
        env-vars: "CARGO_INCREMENTAL CARGO_TERM_COLOR RUSTFLAGS SKIPPR_CLI_VERSION"
    - name: Configure version if tag commit
      shell: bash
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        python3 .github/scripts/set_root_package_version.py \
          --workspace "$GITHUB_WORKSPACE" \
          --version "${{ github.ref_name }}"
    - name: Verify host dependency boundary
      shell: bash
      run: |
        python3 .github/scripts/check_host_dependency_boundaries.py
    - name: Build release
      shell: bash
      run: |
        if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
          export SKIPPR_CLI_VERSION="${GITHUB_REF_NAME}"
        fi
        export RUNTIME_PLUGIN_PACKAGES_JSON='${{ inputs.runtime_plugin_packages_json }}'
        plugin_packages_file="$(mktemp)"
        python3 - <<'PY' > "${plugin_packages_file}"
        import json
        import os

        for package in json.loads(os.environ["RUNTIME_PLUGIN_PACKAGES_JSON"]):
            print(package)
        PY

        cargo build --release \
          -p skipprd --bin skipprd --features offset-store-dynamodb,offset-store-cloud-tables
        if [ -s "${plugin_packages_file}" ]; then
          cargo_args=()
          while IFS= read -r package; do
            [ -n "${package}" ] || continue
            cargo_args+=(-p "$package")
          done < "${plugin_packages_file}"
          cargo build --release "${cargo_args[@]}"
        fi

        mkdir -p skipprd-${{ inputs.architecture_name }}
        mkdir -p runtime-plugin-binaries-${{ inputs.architecture_name }}
        cp target/release/skipprd skipprd-${{ inputs.architecture_name }}/skipprd
        while IFS= read -r package; do
          [ -n "${package}" ] || continue
          plugin_bin="target/release/${package}"
          if [ ! -f "${plugin_bin}" ]; then
            echo "::error::Expected runtime plugin binary was not produced: ${plugin_bin}"
            exit 1
          fi
          cp "${plugin_bin}" "runtime-plugin-binaries-${{ inputs.architecture_name }}/$(basename "${plugin_bin}")"
        done < "${plugin_packages_file}"
        rm -f "${plugin_packages_file}"
        ls -la skipprd-${{ inputs.architecture_name }}
        ls -la runtime-plugin-binaries-${{ inputs.architecture_name }}
    - name: Verify compiled version
      shell: bash
      run: |
        VERSION=$(target/release/skipprd --version 2>&1 | awk '{print $2}')
        echo "skipprd version: $VERSION"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Version was not plain semver"
          exit 1
        fi
    - name: Show sccache stats
      if: env.SCCACHE_BUCKET != ''
      shell: bash
      run: ${SCCACHE_PATH:-sccache} --show-stats || true
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: skipprd-${{ inputs.architecture_name }}
        path: skipprd-${{ inputs.architecture_name }}
        retention-days: 30
    - name: Upload Runtime Plugin Binaries Artifact
      uses: actions/upload-artifact@v4
      with:
        name: runtime-plugin-binaries-${{ inputs.architecture_name }}
        path: runtime-plugin-binaries-${{ inputs.architecture_name }}
        retention-days: 30