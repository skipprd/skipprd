[package]
name = "skippr-plugin-data-source-mqtt"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-mqtt"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true

rumqttc = { version = "0.24" }
serde.workspace = true
serde_derive = "1.0.105"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "Mqtt"

[package.metadata.skippr-plugin.source_capability]
name = "Mqtt"
guarantee_tier = "UserSuppliedIdentityOnly"
checkpoint_style = "MessageIdentity"
bootstrap_style = "StreamOnly"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "UserSupplied"
