name: Configure R2 releases credentials
description: >
  Point the AWS CLI at Cloudflare R2 (skippr-web-install) for public install/release uploads.
  Does not use AWS S3. Requires R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY secrets.

inputs:
  account_id:
    description: Cloudflare account ID (R2 endpoint host prefix)
    required: true
  access_key_id:
    description: R2 S3 API access key id
    required: true
  secret_access_key:
    description: R2 S3 API secret access key
    required: true

runs:
  using: composite
  steps:
    - name: Export R2 endpoint credentials for AWS CLI
      shell: bash
      env:
        R2_ACCOUNT_ID: ${{ inputs.account_id }}
        R2_ACCESS_KEY_ID: ${{ inputs.access_key_id }}
        R2_SECRET_ACCESS_KEY: ${{ inputs.secret_access_key }}
      run: |
        set -euo pipefail
        if [[ -z "${R2_ACCOUNT_ID}" || -z "${R2_ACCESS_KEY_ID}" || -z "${R2_SECRET_ACCESS_KEY}" ]]; then
          echo "::error::R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, and R2_SECRET_ACCESS_KEY must be set (GitHub Actions secrets)."
          exit 1
        fi
        endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
        {
          echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
          echo "AWS_DEFAULT_REGION=auto"
          echo "AWS_REGION=auto"
          echo "AWS_ENDPOINT_URL=${endpoint}"
          # Clear any prior STS session from aws-actions/configure-aws-credentials
          echo "AWS_SESSION_TOKEN="
          echo "AWS_SECURITY_TOKEN="
        } >> "$GITHUB_ENV"
        echo "Configured AWS CLI → R2 endpoint ${endpoint} (bucket ${RELEASES_BUCKET:-skippr-web-install})"
