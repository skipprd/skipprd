[package]
name = "skippr-plugin-data-source-upfoundry-link-graph-compact"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-upfoundry-link-graph-compact"
path = "src/main.rs"

[dependencies]
arrow.workspace = true
arrow-array = "58.3.0"
async-trait.workspace = true
aws-config = "1.5.1"
aws-sdk-s3 = "1.32.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lance = "7.0.0"
parquet.workspace = true
serde.workspace = true
serde_json = "1.0.85"
skippr-plugin-shared-link-graph = { path = "../../shared/link_graph" }
skippr-runtime-sdk.workspace = true
tokio.workspace = true
tracing = "0.1"

[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "UpfoundryLinkGraphCompact"

[package.metadata.skippr-plugin.source_capability]
name = "UpfoundryLinkGraphCompact"
guarantee_tier = "IncrementalOnly"
checkpoint_style = "CursorBased"
bootstrap_style = "FullScan"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "None"
declares_namespace_contracts = true
