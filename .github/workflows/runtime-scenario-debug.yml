name: Runtime Scenario Debug

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Runtime e2e scenario to run
        required: true
        default: bike_hire
        type: choice
        options:
          - bike_hire
          - bike_hire_s3_wal_many
          - deadletters_test
      test_namespace:
        description: Optional namespace suffix; defaults to this run id when blank
        required: false
        default: ""

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  SCCACHE_BUCKET: skippr-web-rust-cache
  SCCACHE_REGION: auto
  SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  SCCACHE_S3_KEY_PREFIX: skipprd
  SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "false"
  SCCACHE_S3_USE_SSL: "true"

jobs:
  runtime_scenario:
    name: ${{ inputs.scenario }} (linux x86)
    runs-on:
      - self-hosted
      - skippr-linux-x64-16
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Prepare Rust builder
        uses: ./.github/actions/setup-builder
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        with:
          rust-version: stable

      - name: Build linux x86 skipprd
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p skipprd --bin skipprd
          mkdir -p skipprd-linux_x86
          cp target/release/skipprd skipprd-linux_x86/skipprd
          ./skipprd-linux_x86/skipprd --version

      - name: Run targeted runtime scenario
        uses: ./.github/actions/e2e/runtime_scenario
        with:
          scenario: ${{ inputs.scenario }}
          architecture_name: linux_x86
          skipprd_path: ./skipprd-linux_x86/skipprd
          test_namespace: ${{ inputs.test_namespace || github.run_id }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
