name: Deadletter Output Routing Test
inputs:
  architecture_name:
    description: 'macos_arm64, macos-x86, linux_x86'
    required: true
    default: 'stable'
  aws_access_key_id:
    required: true
  aws_secret_access_key:
    required: true
  docker_hub_pass:
    required: true
runs:
  using: "composite"
  steps:
    - name: Run Deadletters Test
      shell: bash
      run: |
        chmod +x ./skippr-${{ inputs.architecture_name }}/skippr
        
        cp .github/actions/e2e/deadletters/skippr.yml ./skippr.yml        
        
        AWS_ACCESS_KEY_ID=${{ inputs.aws_access_key_id }} AWS_SECRET_ACCESS_KEY=${{ inputs.aws_secret_access_key }} AWS_DEFAULT_REGION=us-east-1 ./skippr-${{ inputs.architecture_name }}/skippr sync --log --pipeline deadletters_test

#    - name: Assert deadletters exist via Skippr SQL
#      shell: bash
#      run: |
#        set -euo pipefail
#        OUT=$(AWS_DEFAULT_REGION=us-east-1 AWS_ACCESS_KEY_ID='${{ inputs.aws_access_key_id }}' AWS_SECRET_ACCESS_KEY='${{ inputs.aws_secret_access_key }}' ./skippr-${{ inputs.architecture_name }}/skippr query --sql "SELECT COUNT(*) AS c FROM _dl_deadletters_test")
#        echo "$OUT"
#        COUNT=$(echo "$OUT" | grep -Eo '[0-9]+' | tail -1)
#        if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
#          echo "Expected deadletters in _dl_deadletters_test, got count=$COUNT" >&2
#          exit 1
#        fi

    - name: Assert deadletter Athena routing
      shell: bash
      run: |
        set -euo pipefail
        export AWS_DEFAULT_REGION=us-east-1
        export AWS_ACCESS_KEY_ID=${{ inputs.aws_access_key_id }}
        export AWS_SECRET_ACCESS_KEY=${{ inputs.aws_secret_access_key }}

        wait_for_athena_query() {
          local query_id="$1"
          while true; do
            local state
            state=$(aws athena get-query-execution \
              --query-execution-id "$query_id" \
              --query 'QueryExecution.Status.State' \
              --output text)
            case "$state" in
              SUCCEEDED)
                return 0
                ;;
              FAILED|CANCELLED)
                aws athena get-query-execution --query-execution-id "$query_id"
                echo "Athena query failed: $query_id state=$state" >&2
                exit 1
                ;;
              *)
                sleep 2
                ;;
            esac
          done
        }

        deadletter_count_query_id=$(aws athena start-query-execution \
          --work-group bikehire \
          --query-string "SELECT count(*) FROM _dl_deadletters_test" \
          --query-execution-context Database=deadletters,Catalog=AwsDataCatalog \
          --result-configuration OutputLocation=s3://skippr-e2e-sample-data-output/deadletters-assertions \
          --query 'QueryExecutionId' \
          --output text)
        wait_for_athena_query "$deadletter_count_query_id"
        deadletter_count=$(aws athena get-query-results \
          --query-execution-id "$deadletter_count_query_id" \
          --query 'ResultSet.Rows[1].Data[0].VarCharValue' \
          --output text)
        if [ -z "$deadletter_count" ] || [ "$deadletter_count" = "None" ] || [ "$deadletter_count" -lt 1 ]; then
          echo "Expected _dl_deadletters_test table in deadletters database to contain rows" >&2
          exit 1
        fi

        columns=$(aws glue get-table \
          --database-name deadletters \
          --name _dl_deadletters_test \
          --query 'Table.StorageDescriptor.Columns[].Name' \
          --output text)
        for required_col in id namespace record error failure_code processed_time; do
          if [[ " $columns " != *" $required_col "* ]]; then
            echo "Missing expected deadletter column: $required_col" >&2
            exit 1
          fi
        done

    - name: Assert Athena outputs with Soda
      shell: bash
      run: |
        pip install soda-core-athena
        AWS_DEFAULT_REGION=us-east-1 AWS_ACCESS_KEY_ID=${{ inputs.aws_access_key_id }} AWS_SECRET_ACCESS_KEY=${{ inputs.aws_secret_access_key }} soda scan -d datalake_e2e -c ./soda/configuration.yml ./soda/deadletters_test.yml
        AWS_DEFAULT_REGION=us-east-1 AWS_ACCESS_KEY_ID=${{ inputs.aws_access_key_id }} AWS_SECRET_ACCESS_KEY=${{ inputs.aws_secret_access_key }} soda scan -d deadletters_e2e -c ./soda/configuration.yml ./soda/deadletters_deadletter_output.yml
