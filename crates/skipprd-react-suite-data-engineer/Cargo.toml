[package]
name = "react-suite-data-engineer"
version = "0.0.0-git"
edition = "2021"

[dependencies]
async-trait = "0.1.77"
dashmap = "5.5.3"
once_cell = "1.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.85"
tokio = { version = "1", features = ["full"] }
chrono = "=0.4.42"
walkdir = { version = "2.3.2", features = [] }
serde_yaml = "0.9.16"
sha2 = "0.10"
tempfile = "3.10"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
schemars = { version = "1.2.1", features = ["derive"] }
thiserror = "2"
diffy = "0.4.2"
hex = "0.4.3"
reqwest = { version = "0.12", features = ["json"] }

react-core = { workspace = true, features = ["progress"] }
futures.workspace = true

[dev-dependencies]
react-module-storage-memory.workspace = true
