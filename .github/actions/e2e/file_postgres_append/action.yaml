name: File append into Postgres
description: CSV file source into a Docker Postgres sink on GitHub-hosted runners.
inputs:
  skipprd_path:
    required: true
  plugin_binaries_dir:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Start Postgres sink
      shell: bash
      run: |
        set -euo pipefail
        docker rm -f skippr-file-postgres >/dev/null 2>&1 || true
        docker run -d --name skippr-file-postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=skippr_sink \
          -p 5433:5432 \
          postgres:16-alpine
        ready=0
        for _ in $(seq 1 60); do
          if docker exec skippr-file-postgres psql -U postgres -d skippr_sink -c 'SELECT 1' >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "${ready}" != "1" ]; then
          echo "postgres sink container did not accept SQL" >&2
          docker logs skippr-file-postgres >&2 || true
          exit 1
        fi
    - name: Sync CSV into Postgres
      shell: bash
      env:
        PLUGIN_BINARIES_DIR: ${{ inputs.plugin_binaries_dir }}
      run: |
        set -euo pipefail
        source "${GITHUB_WORKSPACE}/.github/scripts/e2e_stage_plugins.sh"
        work="${RUNNER_TEMP:-/tmp}/skippr-file-postgres"
        mkdir -p "${work}/people" "${work}/data"
        cp tests/fixtures/formats/people.csv "${work}/people/people.csv"
        sed "s|SOURCE_DIR|${work}/people|" \
          .github/actions/e2e/file_postgres_append/skippr.yml \
          > "${work}/skippr.yml"
        e2e_stage_plugins "${work}/skippr.yml" file_postgres_append "${work}/manifests"
        DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          "${{ inputs.skipprd_path }}" --config "${work}/skippr.yml" \
          sync --log --pipeline file_postgres_append --once
        count="$(docker exec skippr-file-postgres psql -U postgres -d skippr_sink -Atc \
          "SELECT count(*) FROM public.file_postgres_append;")"
        echo "count=${count}"
        test "${count}" = "2"
        mkdir -p "${work}/migrations"
        printf '%s\n' \
          'ALTER TABLE file_postgres_append RENAME COLUMN category TO category_code;' \
          > "${work}/migrations/20261020_rename_category.sql"
        DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          "${{ inputs.skipprd_path }}" --config "${work}/skippr.yml" \
          migrate --pipeline file_postgres_append
        DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          "${{ inputs.skipprd_path }}" --config "${work}/skippr.yml" \
          query --plain --sql "SELECT category_code FROM file_postgres_append.file_postgres_append LIMIT 1"
        cols="$(docker exec skippr-file-postgres psql -U postgres -d skippr_sink -Atc \
          "SELECT column_name FROM information_schema.columns WHERE table_name = 'file_postgres_append' ORDER BY 1;")"
        echo "${cols}" | grep -qx 'category_code'
        echo "${cols}" | grep -qvx 'category'
        DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          "${{ inputs.skipprd_path }}" --config "${work}/skippr.yml" \
          sync --log --pipeline file_postgres_append --once
        e2e_assert_downloaded 'skippr-plugin-data-source-file*' 'skippr-plugin-data-sink-postgres*' 'skippr-plugin-schema-sink-postgres*'
