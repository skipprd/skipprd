  linux_x86:
#    needs: smoke_test
    name: cargo build and test (linux x86)
    runs-on:
      - ubuntu-latest-32-cores
#      - ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build linux x86 release
        uses: ./.github/actions/rust-build-release
        with:
          rust-version: stable
          architecture_name: linux_x86

  react_binary_build:
    name: react build (${{ matrix.name }})
    needs:
      - react_ci
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos arm64
            runs_on: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""
          - name: linux x86_64
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          - name: windows x86_64
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3

      - name: Build react release binary
        run: cargo build --release -p react --target ${{ matrix.target }}

      - name: Install dbt runtime (linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install dbt-core dbt-athena-community

      - name: Install dbt runtime (macos)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install dbt-core dbt-athena-community

      - name: Install dbt runtime (windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-athena-community

      - name: Run Linux react config (release binary)
        if: runner.os == 'Linux'
        env:
          REACT_LOG_THREAD_STEPS: ${{ secrets.REACT_LOG_THREAD_STEPS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CIRCLES_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CIRCLES_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CIRCLES_AWS_REGION }}
          AWS_REGION: ${{ secrets.CIRCLES_AWS_REGION }}
        run: |
          ./target/${{ matrix.target }}/release/react --log info run --storage-mode s3 --config ./react/react-linux-x86_64.yaml --suite-id data_engineer --agent agent

      - name: Run macOS react config (release binary)
        if: runner.os == 'macOS'
        env:
          REACT_LOG_THREAD_STEPS: ${{ secrets.REACT_LOG_THREAD_STEPS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CIRCLES_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CIRCLES_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CIRCLES_AWS_REGION }}
          AWS_REGION: ${{ secrets.CIRCLES_AWS_REGION }}
        run: |
          ./target/${{ matrix.target }}/release/react --log info run --storage-mode s3 --config ./react/react-macos-arm64.yaml --suite-id data_engineer --agent agent

      - name: Run Windows react config (release binary)
        if: runner.os == 'Windows'
        env:
          REACT_LOG_THREAD_STEPS: ${{ secrets.REACT_LOG_THREAD_STEPS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CIRCLES_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CIRCLES_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CIRCLES_AWS_REGION }}
          AWS_REGION: ${{ secrets.CIRCLES_AWS_REGION }}
        run: |
          .\target\${{ matrix.target }}\release\react${{ matrix.bin_ext }} --log info run --storage-mode s3 --config .\react\react-windows.yaml --suite-id data_engineer --agent agent

      - name: Upload react artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: react-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/react${{ matrix.bin_ext }}

      - name: Upload react artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: react-${{ matrix.target }}
          path: target\${{ matrix.target }}\release\react${{ matrix.bin_ext }}

