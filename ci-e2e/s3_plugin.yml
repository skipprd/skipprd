s3_plugin:
  extends: .e2e
  tags: [ saas-linux-large-amd64 ]
  script:
    - docker pull $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE
    - docker run --name skippre2e -e AWS_DEFAULT_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY -e DATA_SOURCE_PLUGIN_NAME=s3 -e DATA_SOURCE_S3_BUCKET=skippr-e2e-sample-data -e DATA_SOURCE_S3_PREFIX=bike-hire -e DATA_SOURCE_BATCH_SIZE_BYTES=2048000 -e SCHEMA_OUTPUT_PLUGIN_NAME=glue -e DATA_OUTPUT_PLUGIN_NAME=athena -e DATA_OUTPUT_S3_BUCKET=skippr-e2e-sample-data-output -e DATA_OUTPUT_S3_PREFIX=bikehire -e SCHEMA_OUTPUT_GLUE_DATABASE_NAME=bikehire -e DATA_OUTPUT_ATHENA_WORKGROUP_NAME=bikehire -e PIPELINE_NAME=s3_plugin -e SKIPPR_API_TOKEN=B8ib6S3wa9nSq5wAwxkO9dceUIg04d4uTYUHBDg -e DATA_DIR=./data -e APP_ENV=test -v `pwd`/data:/data skippr/skipprd:latest
    - if [[ "$(docker logs skippre2e >& container-logs ; cat container-logs | grep -i ' Err' | wc -l)" -gt 0 ]]; then exit 1; fi
    - if [[ "$(docker container wait skippre2e)" -gt 0 ]]; then exit 1; fi
  after_script:
    - docker run --name soda -e AWS_DEFAULT_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY -v `pwd`/soda:/soda sodadata/soda-core scan -d datalake_e2e -c /soda/configuration.yml /soda/s3_plugin.yml
    - if [[ "$(docker logs soda >& container-logs ; cat container-logs | grep 'All is good' | wc -l)" -gt 0 ]]; then exit 0; fi
    - if [[ "$(docker container wait soda)" -gt 0 ]]; then exit 1; fi