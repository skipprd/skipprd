docker_push_release:
  image: docker:latest
  stage: publish
  script:
    # Push to Docker Hub
    - docker login -u skippr -p "$DOCKER_HUB_PASS"
    - docker pull $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE

    - docker tag $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE $DOCKER_HUB_REPO/$CONTAINER_RELEASE_IMAGE
    - docker push $DOCKER_HUB_REPO/$CONTAINER_RELEASE_IMAGE

    - docker tag $DOCKER_HUB_REPO/$CONTAINER_LATEST_IMAGE $DOCKER_HUB_REPO/$CONTAINER_SNAPSHOT_IMAGE
    - docker push $DOCKER_HUB_REPO/$CONTAINER_SNAPSHOT_IMAGE
  only:
    - master
    - tags



cleanup:
  image: python:3.8-alpine
  stage: init
  before_script:
    - apk add --no-cache groff less jq
    - pip install awscli
  script:
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region us-east-1
    - aws s3 rm s3://skippr-e2e-sample-data-output/bikehire --recursive
    - aws s3 rm s3://skippr-metadata-test --recursive
    - aws glue delete-database --catalog-id 353855562591 --name bikehire || true
#      aws dynamodb delete-item --table-name Test-MetadataService-Stack-MetadataTable8CB34826-XGZT4CFIJO8Y --key '{"tenant": {"S": "skippr"}}'
  only:
    - master
    - tags

purge_dynamodb:
  image: node:14
  stage: init
  script:
    - npm install aws-sdk
    - node _files/purge-dynamodb.js
  only:
    - master
    - tags