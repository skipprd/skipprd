skippr:
  skippr_s3_bucket: skippr-e2e-sample-data-output
  tenant: skippr

pipelines:

  bike_hire_many2:
    auto_approve: yes
    env: test
    buffer_threshold_bytes: 10000000
    buffer_threshold_seconds: 600
    input: data_inputs.s3_bike_hire
    output: data_outputs.test_datalake

data_inputs:
  s3_bike_hire:
    S3:
      batch_size_bytes: 2048000
      s3_bucket: skippr-e2e-sample-data
      s3_prefix: many/bike-hire-many

data_outputs:
  test_datalake:
    Athena:
      athena_workgroup_name: bikehire
      glue_database_name: bikehire
      s3_bucket: skippr-e2e-sample-data-output
      athena_results_s3_bucket: skippr-e2e-sample-data-output
      s3_prefix: bikehire_many
