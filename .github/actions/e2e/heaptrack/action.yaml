    - name: Install Heaptrack
      shell: bash
      run: |
        if [[ "${{ inputs.architecture_name }}" == "linux_x86" ]]; then
        sudo apt-get update && sudo apt-get install -y heaptrack
        elif [[ "${{ inputs.architecture_name }}" == "macos_arm64" || "${{ inputs.architecture_name }}" == "macos-x86" ]]; then
        brew install heaptrack
        fi

    - name: Run Heaptrack
      shell: bash
      run: |
        if [[ "${{ inputs.architecture_name }}" == "linux_x86" || "${{ inputs.architecture_name }}" == "macos_arm64" || "${{ inputs.architecture_name }}" == "macos-x86" ]]; then
          AWS_ACCESS_KEY_ID=${{ inputs.aws_access_key_id }} AWS_SECRET_ACCESS_KEY=${{ inputs.aws_secret_access_key }} AWS_DEFAULT_REGION=us-east-1 heaptrack ./skippr-${{ inputs.architecture_name }}/skippr sync --log --pipeline bike_hire
          mv heaptrack.*.zst heaptrack_output.zst
        fi

    - name: Upload Heaptrack Output
      uses: actions/upload-artifact@v4
      with:
        name: heaptrack-output
        path: heaptrack_output.zst