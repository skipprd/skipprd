[package]
name = "skippr-plugin-data-source-http-client"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-http-client"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true

flate2 = "1.0.25"
reqwest = { workspace = true }
serde.workspace = true
serde_derive = "1.0.105"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "HttpClient"

[package.metadata.skippr-plugin.source_capability]
name = "HttpClient"
guarantee_tier = "IncrementalOnly"
checkpoint_style = "CursorBased"
bootstrap_style = "FullScan"
order_model = "UnsupportedForFinalState"
supports_deletes = false
event_id_semantics = "None"
