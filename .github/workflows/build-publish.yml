  postgres_iceberg_types_cdc_test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.snowflake_e2e_only != true }}
    needs:
      - cleanup
      - purge_dynamodb
      - linux_test_suite
      - data_engineer_test_suite
    name: Postgres to Iceberg Glue Athena e2e
    runs-on: depot-ubuntu-22.04-16
    environment: Skippr
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skippr_iceberg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skippr_iceberg_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DATA_DIR_MIN_FREE_BYTES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Postgres client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Configure Postgres logical replication
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d skippr_iceberg_e2e <<'SQL'
          ALTER SYSTEM SET wal_level = logical;
          ALTER SYSTEM SET max_replication_slots = 10;
          ALTER SYSTEM SET max_wal_senders = 10;
          SQL
          docker restart "${{ job.services.postgres.id }}"
          until pg_isready -h 127.0.0.1 -U postgres -d skippr_iceberg_e2e; do
            sleep 1
          done

      - name: Seed exhaustive type and CDC source data
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d skippr_iceberg_e2e <<'SQL'
          DROP TABLE IF EXISTS type_matrix_orders;
          CREATE TABLE type_matrix_orders (
            id BIGINT PRIMARY KEY,
            bool_col BOOLEAN,
            string_col TEXT,
            int_col INTEGER,
            long_col BIGINT,
