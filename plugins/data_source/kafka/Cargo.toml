[package]
name = "skippr-plugin-data-source-kafka"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-source-kafka"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true

futures = "0.3.25"
# Keep the Tokio integration while forcing a consistent static zlib setup for
# librdkafka across platforms, including Windows/MSVC release builds.
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "libz-static", "tokio"] }
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tracing = "0.1"
[package.metadata.skippr-plugin]
kind = "DataSource"
plugin_name = "Kafka"

[package.metadata.skippr-plugin.source_capability]
name = "Kafka"
guarantee_tier = "LogStreamExactOnce"
checkpoint_style = "LogNative"
bootstrap_style = "StreamOnly"
order_model = "StableKeyScopedOrder"
supports_deletes = true
event_id_semantics = "LogPosition"
