name: File Duckdb append e2e
description: File source to Duckdb Iceberg on file://, then DuckDB iceberg_scan with version guessing.
runs:
  using: composite
  steps:
    - name: Install DuckDB CLI
      shell: bash
      run: |
        set -euo pipefail
        if command -v duckdb >/dev/null 2>&1; then
          duckdb --version
          exit 0
        fi
        if command -v brew >/dev/null 2>&1; then
          brew install duckdb
          duckdb --version
          exit 0
        fi
        curl -fsSL https://install.duckdb.org | sh
        export PATH="${HOME}/.duckdb/cli/latest:${PATH}"
        duckdb --version

    - name: Build skipprd and Duckdb runtime plugins
      shell: bash
      env:
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"
        RUSTFLAGS: "-C debuginfo=0"
      run: |
        set -euo pipefail
        export CARGO_TARGET_DIR="${PWD}/target"
        cargo build -p skipprd
        plugins="${SKIPPR_PLUGINS_ROOT:?}"
        ln -sfn "$PWD" "$plugins/.host"
        (cd "$plugins" && cargo build \
          -p skippr-plugin-data-source-file \
          -p skippr-plugin-data-sink-duckdb \
          -p skippr-plugin-schema-sink-duckdb)

    - name: Stage local runtime manifests
      id: local_runtime
      shell: bash
      run: |
        set -euo pipefail
        export CARGO_TARGET_DIR="${PWD}/target"
        work="${RUNNER_TEMP:-/tmp}/skippr-file-duckdb-append"
        mkdir -p "${work}/source" "${work}/warehouse" "${work}/data" "${work}/manifests"
        cp tests/fixtures/formats/people.csv "${work}/source/people.csv"
        warehouse_uri="file://${work}/warehouse"
        sed \
          -e "s|SOURCE_DIR|${work}/source|" \
          -e "s|WAREHOUSE_URI|${warehouse_uri}|" \
          .github/actions/e2e/file_duckdb_append/skippr.yml \
          > "${work}/skippr.yml"
        python3 .github/scripts/local_runtime_plugins.py \
          --config "${work}/skippr.yml" \
          --pipeline file_duckdb_append \
          --output-dir "${work}/manifests" \
          --skip-cargo-build
        echo "work=${work}" >> "$GITHUB_OUTPUT"
        echo "warehouse=${work}/warehouse" >> "$GITHUB_OUTPUT"

    - name: Sync File into Duckdb Iceberg and scan
      shell: bash
      env:
        USE_LOCAL_PLUGIN_CODE: "1"
        SKIPPR_LOCAL_RUNTIME_PLUGIN_MANIFEST_DIR: ${{ steps.local_runtime.outputs.work }}/manifests
      run: |
        set -euo pipefail
        work="${{ steps.local_runtime.outputs.work }}"
        warehouse="${{ steps.local_runtime.outputs.warehouse }}"
        export PATH="${HOME}/.duckdb/cli/latest:${PATH}"
        DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          target/debug/skipprd sync --log --pipeline file_duckdb_append --once \
          --config "${work}/skippr.yml"
        count="$(duckdb -csv -c "SET unsafe_enable_version_guessing=true; INSTALL iceberg; LOAD iceberg; SELECT count(*) FROM iceberg_scan('${warehouse}/bronze/file_duckdb_append');")"
        echo "${count}"
        echo "${count}" | tail -n 1 | grep -qx '2'
        query_count() {
          DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
            target/debug/skipprd query --plain --sql "SELECT count(*) FROM file_duckdb_append.file_duckdb_append" \
            --config "${work}/skippr.yml" \
          | python3 -c 'import json,sys; d=next(json.loads(l) for l in reversed(sys.stdin.read().splitlines()) if l.strip().startswith("{") and "\"rows\"" in l); print(d["rows"][0][0])'
        }
        test "$(query_count)" = "2"
        printf '%s\n' '3,Alan Turing,gamma' >> "${work}/source/people.csv"
        echo hold_before_compaction_sink > "${work}/data/failpoint"
        DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          target/debug/skipprd sync --log --pipeline file_duckdb_append --once \
          --config "${work}/skippr.yml" &
        sync_pid=$!
        overlap=""
        for _ in $(seq 1 60); do
          overlap="$(query_count || true)"
          if [ "${overlap}" = "3" ]; then
            break
          fi
          sleep 1
        done
        test "${overlap}" = "3"
        ids="$(DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          target/debug/skipprd query --plain --sql "SELECT id FROM file_duckdb_append.file_duckdb_append" \
          --config "${work}/skippr.yml" \
          | python3 -c 'import json,sys; d=next(json.loads(l) for l in reversed(sys.stdin.read().splitlines()) if l.strip().startswith("{") and "\"rows\"" in l); print(len({r[0] for r in d["rows"]}))')"
        test "${ids}" = "3"
        rm -f "${work}/data/failpoint"
        wait "${sync_pid}" || true
        test "$(query_count)" = "3"
        mkdir -p "${work}/migrations"
        printf '%s\n' \
          'ALTER TABLE file_duckdb_append RENAME COLUMN category TO category_code;' \
          > "${work}/migrations/20261020_rename_category.sql"
        DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          target/debug/skipprd migrate --log --pipeline file_duckdb_append \
          --config "${work}/skippr.yml"
        DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          target/debug/skipprd query --plain --sql "SELECT category_code FROM file_duckdb_append.file_duckdb_append LIMIT 1" \
          --config "${work}/skippr.yml"
        DATA_DIR="${work}/data" DATA_DIR_MIN_FREE_BYTES=0 DATA_DIR_HIGH_WATERMARK_PCT=0 \
          target/debug/skipprd sync --log --pipeline file_duckdb_append --once \
          --config "${work}/skippr.yml"
        cols="$(duckdb -csv -c "SET unsafe_enable_version_guessing=true; INSTALL iceberg; LOAD iceberg; SELECT column_name FROM (DESCRIBE SELECT * FROM iceberg_scan('${warehouse}/bronze/file_duckdb_append'));")"
        echo "${cols}"
        echo "${cols}" | grep -q 'category_code'
