site_name: Skippr Docs
repo_url: https://github.com/skipprd/skipprd
site_description: Skippr is a data ingestion CLI that discovers schemas and writes optimised Parquet to S3 with Glue/Athena integration.
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.footer
    - navigation.sections
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_javascript:
  - javascript/ga-events.js
extra_css:
  - stylesheets/app.css
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/install.md
      - Quick Start: getting-started/quickstart.md
  - Concepts:
      - How Skippr Works: concepts/how-it-works.md
      - Schema Discovery & Evolution: concepts/schema.md
      - Exactly-Once Delivery: concepts/exactly-once.md
      - Deadletters: concepts/deadletters.md
  - CLI Reference:
      - discover: cli/discover.md
      - sync: cli/sync.md
      - query: cli/query.md
      - schema: cli/schema.md
      - sql-help: cli/sql-help.md
      - benchmark: cli/benchmark.md
  - SQL Reference: sql/reference.md
  - Configuration:
      - Overview: configuration/overview.md
      - Pipeline & Workspace: configuration/pipeline.md
      - Input Source: configuration/input.md
      - Output Destination: configuration/output.md
      - Transforms: configuration/transforms.md
      - Buffering & WAL: configuration/buffering.md
      - Advanced: configuration/advanced.md
  - Connectors:
      - Inputs:
          - S3: connectors/inputs/s3.md
          - Local File: connectors/inputs/file.md
          - MSSQL: connectors/inputs/mssql.md
      - Outputs:
          - Athena (S3 + Glue): connectors/outputs/athena.md
          - Local File: connectors/outputs/file.md
          - Snowflake: connectors/outputs/snowflake.md
  - Operations:
      - Logging Event Map: operations/logging.md
      - Troubleshooting: operations/troubleshooting.md
  - License: license.md

markdown_extensions:
  - toc:
      permalink: True

extra:
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  analytics:
    provider: google
    property: G-9FNNDBH0CQ
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/skipprd/skipprd
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/skipprdata
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/skippr-io/about/
    - icon: fontawesome/brands/slack
      link: https://skipprgroup.slack.com/ssb/redirect
  feedback:
    title: Was this page helpful?
    ratings:
      - icon: material/emoticon-happy-outline
        name: This page was helpful
        data: 1
        note: >-
          Thanks for your feedback!
      - icon: material/emoticon-sad-outline
        name: This page could be improved
        data: 0
        note: >-
          Thanks for your feedback! Help us improve this page by
          using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
