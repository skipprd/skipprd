[package]
name = "skippr-cli"
version = "0.0.0-git"
edition = "2021"

[[bin]]
name = "skippr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0.32", features = ["derive"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dialoguer = "0.11"
console = "0.15"
reqwest = { version = "0.12", features = ["json"] }
dirs-next = "2.0"
flate2 = "1"
tar = "0.4"
skipprd = { path = "../.." }

react-core.workspace = true
react.workspace = true
react-suite-data-engineer = { path = "../skipprd-react-suite-data-engineer" }
react-module-storage-s3.workspace = true
react-module-storage-local.workspace = true
react-module-provider-vector-lance.workspace = true
react-module-provider-postgres = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-postgres" }
react-module-provider-bigquery = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-bigquery" }
react-module-provider-athena = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-athena" }
react-module-provider-dbt = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-dbt" }
react-module-provider-catalog = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-catalog" }
react-module-provider-snowflake = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-snowflake" }
react-module-provider-mssql = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-mssql" }
react-module-provider-databricks = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-databricks" }
react-module-provider-synapse = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-synapse" }
react-module-provider-redshift = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-redshift" }
react-module-provider-clickhouse = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-clickhouse" }
react-module-provider-motherduck = { path = "../skipprd-react-suite-data-engineer/src/modules/provider-motherduck" }
chrono = "0.4.42"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
