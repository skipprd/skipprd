[package]
name = "skippr-plugin-data-sink-clickhouse"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "skippr-plugin-data-sink-clickhouse"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tokio.workspace = true
skippr-runtime-sdk.workspace = true
bytes.workspace = true
hex.workspace = true
parquet.workspace = true

arrow = { version = "58.3.0", features = ["ipc_compression"] }
async-trait = "0.1.77"
dashmap = "5.5.3"
datafusion.workspace = true
futures = "0.3.25"
once_cell = "1.17.0"
reqwest = { workspace = true }
serde.workspace = true
serde_derive = "1.0.105"
serde_json = "1.0.85"
tracing = "0.1"
url = "2.3.1"
[package.metadata.skippr-plugin]
kind = "DataSink"
plugin_name = "Clickhouse"
supports_schema = true

[package.metadata.skippr-plugin.sink_capability]
name = "Clickhouse"
max_sessions_per_child = 1
guarantee_tier = "CdcEncodedOnly"
can_manage_skippr_columns = true
can_maintain_tombstone_tables = true
can_compare_order_tokens = true
supports_transactions = false
retry_semantics = "AtLeastOnce"
grouping_support = "CdcEncodedBatches"
