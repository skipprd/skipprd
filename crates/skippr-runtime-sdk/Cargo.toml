[package]
name = "skippr-runtime-sdk"
version = "0.1.4"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
arrow.workspace = true
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap.workspace = true
hex.workspace = true
md5 = "0.7.0"
datafusion.workspace = true
futures.workspace = true
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
skippr-plugin-macros = { path = "../skippr-plugin-macros" }
skippr-lease = { path = "../skippr-lease" }
skippr-object-writer.workspace = true
arrow-schema.workspace = true
bincode = { version = "1.3", features = [] }
bytes.workspace = true
dashmap.workspace = true
libc = "0.2.151"
once_cell.workspace = true
parquet.workspace = true
rand = "0.8.5"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.3.1"

[dev-dependencies]
proptest = "1.10.0"
serde_yaml = "0.9"
tempfile = "3"
