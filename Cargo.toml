[package]
name = "skipprd"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
    "crates/skippr-core",
    "crates/skippr-object-writer",
    "crates/skippr-offset-store-dynamodb",
    "crates/skippr-lease",
    "crates/skippr-lease-store-dynamodb",
    "crates/skippr-tables-client",
    "crates/skippr-store-cloud-tables",
    "crates/skippr-iceberg-catalog",
    "crates/skippr-iceberg-catalog-dynamodb",
    "crates/skippr-query-ballista",
    "crates/skippr-runtime-sdk",
    "plugins/data_source/*",
    "plugins/data_sink/*",
    "plugins/schema_sink/*",
    "plugins/shared/api_source",
    "plugins/shared/link_graph",
    "plugins/shared/backlinks",
]

[workspace.dependencies]
async-trait = "0.1.77"
arrow-array = "58.3.0"
base64 = "0.22.1"
arrow = { version = "58.3.0", features = ["ipc_compression"] }
arrow-flight = { version = "58.3.0", default-features = false, features = ["flight-sql"] }
arrow-schema = "58.3.0"
arrow-buffer = "58.3.0"
ballista = "53.0.0"
bytes = "1.5.0"
clap = { version = "4.0.32", features = ["derive"] }
dashmap = "5.5.3"
datafusion = "53.1.0"
futures = "0.3.25"
futures-util = "0.3"
hex = "0.4.3"
sha2 = "0.10"
md5 = "0.7.0"
native-tls = "0.2.18"
once_cell = "1.17.0"
parquet = "58.3.0"
object_store = { version = "0.13.2", features = ["aws", "azure", "gcp"] }
pgwire-replication = "0.3.0"
postgres-native-tls = "0.5.2"
serde = "1.0.105"
serde_derive = "1.0.105"
serde_json = "1.0.85"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.16"
tokio-tungstenite = "0.21"
tracing = "0.1"
tungstenite = "0.21"
thiserror = "1.0.58"
skippr-core = { path = "crates/skippr-core" }
skippr-object-writer = { path = "crates/skippr-object-writer" }
skippr-runtime-sdk = { path = "crates/skippr-runtime-sdk" }
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[[bin]]
name = "skipprd"
path = "src/main.rs"

[[bin]]
name = "skippr-runtime-plugin-test-helper"
path = "src/bin/skippr-runtime-plugin-test-helper.rs"

[dependencies]
serde_derive = "1.0.105"
serde = "1.0.105"
serde_json = "1.0.85"
simd-json = { version = "0.14", default-features = true }
serde_yaml = "0.9.16"
schemars = "0.7.0"
regex = "1.7.0"
memory-stats = "1.0.0"
rand = "0.8.5"
chrono = "0.4.44"
chrono-tz.workspace = true
icu = "1.0.0"
array-init = "2.1.0"
envy = "0.4.2"
aws-config = "1.5.1"
aws-sdk-s3 = "1.32.0"
aws-types = "1.3.1"
skippr-offset-store-dynamodb = { path = "crates/skippr-offset-store-dynamodb", optional = true }
skippr-lease = { path = "crates/skippr-lease" }
skippr-lease-store-dynamodb = { path = "crates/skippr-lease-store-dynamodb", optional = true }
skippr-iceberg-catalog = { path = "crates/skippr-iceberg-catalog" }
skippr-iceberg-catalog-dynamodb = { path = "crates/skippr-iceberg-catalog-dynamodb", optional = true }
skippr-tables-client = { path = "crates/skippr-tables-client", optional = true }
skippr-store-cloud-tables = { path = "crates/skippr-store-cloud-tables", optional = true }
skippr-query-ballista = { path = "crates/skippr-query-ballista" }
datafusion-proto = "53.1.0"
ballista-core = "53.0.0"
ballista-executor = "53.0.0"
ballista-scheduler = "53.0.0"
iceberg = "0.9.1"
tokio = { version = "1", features = ["full"] }
flate2 = "1.0.25"
csv = "1.1.6"
futures = "0.3.25"
periodic = "0.1.1"
glob = "0.3.0"
cc = "1.2.41"
clap = { version = "4.0.32", features = ["derive"] }
yaml-rust = "0.4.5"
once_cell = "1.17.0"
parquet = "58.3.0"
arrow = { version = "58.3.0", features = ["ipc_compression"] }
arrow-flight = { workspace = true }
arrow-schema = "58.3.0"
arrow-buffer = "58.3.0"
ballista.workspace = true
reqwest.workspace = true
lazy_static = "1.4.0"
urldecode = "0.1.1"
url = "2.3.1"
aws-sdk-glue = "1.38.0"
md5 = "0.7.0"
phf = { version = "0.11.1", default-features = false, features = ["macros"] }
sled = { version = "0.34.4" }
zerocopy = "0.6.1"
byteorder = "1.4.3"
ctrlc = "3.2.5"
signal-hook = "0.3.15"
lru = "0.10.0"
tar = "0.4.38"
zip = "0.6.6"
threadpool = "1.8.1"
num_cpus = "1.16.0"
avro-rs = "0.13.0"
datafusion = "53.1.0"
serde-xml-rs = "0.6.0"
serde-transcode = "1.1.1"
serde-value = "0.7.0"
hex = "0.4.3"
shellexpand = "3.1.0"
toml = "0.8.1"
dashmap = "5.5.3"
libc = "0.2.151"
bincode = { version = "1.3", features = [] }
serde_cbor = { version = "0.11.2", features = [] }
ini = "1.3.0"
walkdir = { version = "2.3.2", features = [] }
bytes = "1.5.0"
async-trait = "0.1.77"
thiserror.workspace = true
object_store = { version = "0.13.2", features = ["aws", "azure", "gcp"] }
rayon = "1.8.0"
arc-swap = "1.6"
tokio-util = { version = "0.7", features = ["io", "io-util", "compat"], default-features = false }
sha2 = "0.10"
aws-credential-types = "1.2.0"
ratatui = { version = "0.26" }
crossterm = { version = "0.27" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
crossbeam-channel = "0.5.15"
log = "0.4.28"
uuid = { version = "1", features = ["v4"] }
tempfile = "3.10"
dotenvy = "0.15.7"
itertools = "0.14"
base64 = "0.22.1"
tracing-appender = "0.2.4"
aes = { version = "0.8", default-features = false }
quick-xml = { version = "0.39.2", features = ["serialize"] }
prost = "0.13"
tonic = { version = "0.14.1", default-features = false, features = ["transport", "codegen", "tls-ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
chitchat = "0.9"
hmac = "0.12"

[build-dependencies]
prost-build = "0.13"

[features]
stats_integration = []
# Used only by crates/skipprd-dfs-hub-compat-tests (keeps plugin out of host dev-deps).
dfs-hub-compat-tests = []
# Release tarballs enable these so published skipprd can use SKIPPR_OFFSET_STORE=dynamodb
# (Lambda) and SKIPPR_OFFSET_STORE=cloud-tables (Skippr Cloud elt guest) without pulling
# those stores into the default host dependency closure (CI boundary check).
offset-store-dynamodb = [
    "dep:skippr-offset-store-dynamodb",
    "dep:skippr-lease-store-dynamodb",
    "dep:skippr-iceberg-catalog-dynamodb",
]
offset-store-cloud-tables = [
    "dep:skippr-tables-client",
    "dep:skippr-store-cloud-tables",
]

[dev-dependencies]
serial_test = "1.0.0"
assert_cmd = "2"
predicates = "3"
proptest = "1.10.0"
skippr-runtime-sdk = { path = "crates/skippr-runtime-sdk" }

[target.'cfg(unix)'.dependencies]
nix = "0.26.2"

[profile.profiling]
inherits = "release"
debug = true

[patch.crates-io]
iceberg = { path = "third_party/iceberg" }
