[package]
name = "skippr-admin"
version = "0.0.0-git"
edition = "2021"

[[bin]]
name = "skippr-admin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0.32", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = "0.4.44"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.3.2"
rustyline = "14"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
aws-config = "1"
aws-sdk-dynamodb = "1"

react-core.workspace = true
react.workspace = true
react-module-provider-vector-lance.workspace = true
react-module-storage-s3.workspace = true
react-suite-debugger.workspace = true
react-suite-data-engineer = { path = "../skipprd-react-suite-data-engineer" }
